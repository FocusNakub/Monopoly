<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>ธนาคารเศรษฐี</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5b52">
<link rel="icon" href="pwa/icon-192.png">
<link rel="apple-touch-icon" href="pwa/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ธนาคารเศรษฐี">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ---------- โทนสี ---------- */
:root{
  --ground:#e9ece5; --surface:#fbfbf6; --surface2:#f0f2ea; --ink:#1c2b2a; --muted:#5d6d68;
  --line:#cdd4c9; --jade:#0f5b52; --jade-ink:#fff; --gold:#c98f0a; --danger:#c0392b; --ok:#1f8a4c;
  --note:#fff6dc; --shadow:0 1px 2px rgba(20,40,35,.08),0 6px 22px rgba(20,40,35,.08);
  --display:'Mitr',system-ui,sans-serif; --body:'IBM Plex Sans Thai',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  /* ขอบซ้าย/ขวาของหน้าจอ: แคบบนมือถือ ขยายอัตโนมัติตามความกว้างจอ (แท็บเล็ต/คอม) จะได้ไม่เหลือขอบว่างเยอะเหมือนกล่องแคบๆ ลอยกลางจอ */
  --gutter:clamp(14px, 3.2vw, 40px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --ground:#0d1514; --surface:#15211f; --surface2:#1c2b28; --ink:#e4ece8; --muted:#95a7a1;
    --line:#2d3e3a; --jade:#3fb8a4; --jade-ink:#062522; --gold:#e8b33a; --danger:#ef6b5b; --ok:#4cc17e; --note:#2a2616; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35); }
}
:root[data-theme="dark"]{ color-scheme:dark; --ground:#0d1514; --surface:#15211f; --surface2:#1c2b28; --ink:#e4ece8; --muted:#95a7a1;
  --line:#2d3e3a; --jade:#3fb8a4; --jade-ink:#062522; --gold:#e8b33a; --danger:#ef6b5b; --ok:#4cc17e; --note:#2a2616; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35); }
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--body);padding-inline:var(--gutter);padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.2;text-wrap:balance}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5em 1em}
button:hover:not(:disabled){background:var(--surface2)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:600}
button.primary:hover:not(:disabled){background:var(--jade);filter:brightness(1.08)}
button.gold{background:var(--gold);border-color:var(--gold);color:#1c1400;font-weight:600}
button.gold:hover:not(:disabled){background:var(--gold);filter:brightness(1.06)}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
button.sm{padding:.25em .7em;font-size:13.5px;border-radius:8px}
button.big{padding:.75em 1.2em;font-size:17px;border-radius:14px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55em .75em;min-width:0;width:100%}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field{display:grid;gap:4px}
.field small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wrap{max-width:1080px;width:100%;margin:0 auto;display:grid;gap:14px}
.tok{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:18px;border:2px solid var(--c);background:var(--surface);flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.badge.me{background:color-mix(in srgb,var(--jade) 16%,var(--surface));border-color:var(--jade)}
.badge.bad{background:color-mix(in srgb,var(--danger) 14%,var(--surface));border-color:var(--danger);color:var(--danger)}
.credit{font-family:var(--mono);font-weight:500;font-size:12px;padding:1px 8px;border-radius:6px;color:#fff;background:var(--cc)}
.warn{font-size:13.5px;background:var(--note);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px}

/* ---------- หน้าแรก ---------- */
.hero{display:grid;gap:6px;padding-top:3vh}
.hero h1{font-size:clamp(34px,8vw,54px);font-weight:600}
.hero h1 span{color:var(--gold)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.features li{display:grid;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.features b{font-family:var(--display);font-weight:500;font-size:15px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.tokpick{display:flex;gap:6px;flex-wrap:wrap}
.tokpick button{font-size:21px;padding:3px 8px;line-height:1.3}
.tokpick button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface));box-shadow:inset 0 0 0 1px var(--gold)}

/* ---------- เกม ---------- */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:20px;margin-right:auto}
.top h1 span{color:var(--gold)}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--surface)}
.turn{display:grid;gap:12px;background:var(--jade);color:var(--jade-ink);border:0;position:relative;overflow:hidden}
.turn::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid color-mix(in srgb,var(--jade-ink) 10%,transparent)}
.turn .rnd{font-family:var(--mono);font-size:13px;opacity:.85}
.turn .who{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:clamp(22px,6vw,30px);font-weight:500}
.turn .who .tok{width:46px;height:46px;font-size:26px;border-color:var(--jade-ink)}
.turn .next{font-size:13.5px;opacity:.85}
.turn button{border-color:transparent}
.turn button.ghost{background:color-mix(in srgb,var(--jade-ink) 14%,transparent);color:var(--jade-ink)}
.effects{display:flex;gap:6px;flex-wrap:wrap}
.effect{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:5px 12px;border-radius:999px;background:var(--note);border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line))}
.effect small{color:var(--muted);font-family:var(--mono)}
.newsticker{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.newsticker .nt-ic{flex:none}
.newsticker .nt-tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.newsticker.up{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:color-mix(in srgb,var(--danger) 8%,var(--surface2))}
.newsticker.down{border-color:color-mix(in srgb,var(--jade) 45%,var(--line));background:color-mix(in srgb,var(--jade) 10%,var(--surface2))}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge-chip{font-size:12px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;border:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:transparent;padding:.5em .3em;font-size:14px;border-radius:9px;position:relative}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.tabs .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.who-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.who-pick button{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.who-pick button[aria-pressed="true"]{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 14%,var(--surface))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:340px){.stats{grid-template-columns:1fr 1fr}}
.loan{display:grid;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.loan.over{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
.loan.offer{border-style:dashed;border-color:var(--gold);background:var(--note)}
.loan .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.loan .amt{font-family:var(--mono);font-size:20px;font-weight:500;margin-left:auto}
.loan .meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.loan.over .bar i{background:var(--danger)}
.section-h{display:flex;align-items:center;gap:8px;margin-top:4px}
.section-h h2{font-size:17px;margin-right:auto}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tscroll{overflow-x:auto}
.hist{display:grid;gap:8px}
.hist .h{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hist .ic{font-size:26px;line-height:1}
.hist small{color:var(--muted);font-family:var(--mono)}
.log{display:grid;gap:2px;font-size:13.5px}
.howto{margin:0;padding-left:1.3em;display:grid;gap:8px;font-size:14.5px;line-height:1.45}
.log div{padding:5px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:34px 1fr;gap:6px}
.log small{font-family:var(--mono);color:var(--muted)}

/* ---------- ป๊อปอัป ---------- */
.modal{position:fixed;inset:0;background:rgba(10,20,18,.55);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:18px;max-width:480px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet .hd{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .hd h2{font-size:19px;margin-right:auto}
.sheet .bd{padding:16px 18px;display:grid;gap:12px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.preview{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:2px}
/* การ์ดอีเว้นท์ */
.evmodal{position:fixed;inset:0;background:rgba(8,16,14,.72);display:grid;place-items:center;padding:16px;z-index:60;perspective:1200px}
.evcard{width:min(100%,380px);border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;animation:flip .7s cubic-bezier(.2,.8,.2,1)}
.evcard .evtop{background:repeating-linear-gradient(135deg,var(--gold) 0 14px,color-mix(in srgb,var(--gold) 80%,#fff) 14px 28px);padding:26px 20px 18px;display:grid;justify-items:center;gap:6px;color:#1c1400}
.evcard .ic{font-size:64px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.evcard .kicker{font-size:12px;letter-spacing:.14em;font-weight:600}
.evcard h2{font-size:28px;font-weight:600;text-align:center}
.evcard .tx{padding:18px 20px;font-size:17px;line-height:1.6;text-align:center}
.evcard .ft{padding:0 20px 20px}
.evcard .ft button{width:100%}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:99;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* ---------- บัญชีธนาคาร ---------- */
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:600;font-family:var(--mono)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--jade)}
.check span{display:grid;gap:1px}
.check small{color:var(--muted);font-size:12.5px}
.card-bank{position:relative;overflow:hidden;border-radius:20px;padding:18px 20px;color:#f6f3e8;
  background:radial-gradient(120% 140% at 100% 0%,#1d7a6d 0%,#0f4d45 45%,#0b3530 100%);box-shadow:var(--shadow);display:grid;gap:4px}
.card-bank::after{content:"";position:absolute;right:-30px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(232,179,58,.16)}
.card-bank.neg{background:radial-gradient(120% 140% at 100% 0%,#8f3a2f 0%,#5d231d 55%,#3b1511 100%)}
.cb-name{font-family:var(--display);font-size:16px}
.cb-label{font-size:12.5px;letter-spacing:.04em;opacity:.8;margin-top:6px}
.cb-bal{font-size:clamp(34px,10vw,46px);font-weight:500;line-height:1.1;letter-spacing:-.01em}
.cb-foot{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;opacity:.9;margin-top:6px;position:relative;z-index:1}
.cb-foot b{font-weight:500}
.card-bank .credit{position:relative;z-index:1}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.actions{grid-template-columns:repeat(4,1fr);gap:6px}}
.actions button{display:grid;justify-items:center;gap:4px;padding:10px 4px;font-size:12.5px;line-height:1.25;border-radius:14px}
.actions button span{font-size:22px;line-height:1}
.txlist{padding:4px 12px}
.txr{display:grid;grid-template-columns:28px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.txr:last-child{border-bottom:0}
.tx-ic{grid-row:1/3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px}
.tx-ic.in{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.tx-ic.out{background:color-mix(in srgb,var(--danger) 13%,var(--surface));color:var(--danger)}
.tx-main{font-size:14px;min-width:0;overflow-wrap:anywhere}
.tx-main small{display:block;color:var(--muted);font-size:12px}
.tx-amt{font-size:15px;text-align:right}
.tx-amt.in{color:var(--ok)} .tx-amt.out{color:var(--danger)}
.tx-r{grid-column:3;font-size:11.5px;text-align:right}
.turn.mine{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
/* ---------- QR เชิญ ---------- */
.invite{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:380px){.invite{grid-template-columns:1fr}}
.qrbox{background:#fff;border-radius:14px;padding:8px;width:148px;max-width:100%;border:1px solid var(--line)}
.qr{display:block;width:100%;height:auto}
/* ---------- ผลการแข่งขัน ---------- */
.podium{display:grid;gap:8px}
.rank{display:grid;grid-template-columns:34px auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.rank .pos{font-size:22px;text-align:center;font-family:var(--mono)}
.rank .rk-name{display:grid;min-width:0}
.rank .rk-name small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.rank .rk-net{font-size:18px}
.rank > button{grid-column:3/5;justify-self:end}
.rank.win{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 40%,transparent)}
.hls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.hl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.hl-ic{font-size:24px}
.hl small{display:block;color:var(--muted);font-size:12px}
.worth{border-color:var(--gold)}
.cev{padding:6px 0;border-bottom:1px dashed var(--line)}
.pm{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.pm:last-child{border-bottom:0}
/* ================== สไตล์แอปธนาคาร (หน้าเล่น) ================== */
body.hasbar{padding-top:0}
body.ingame{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* แถบบน: โลโก้ + บทบาท + เมนู */
.appbar{position:sticky;top:0;z-index:20;margin-inline:calc(-1 * var(--gutter));padding:calc(10px + env(safe-area-inset-top,0px)) var(--gutter) 10px;
  background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:10px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.appbar .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:600;font-size:19px;
  background:linear-gradient(145deg,#1d7a6d,#0b3530);color:#f3d27a;box-shadow:inset 0 0 0 1px rgba(232,179,58,.35)}
.appbar .brand{display:grid;line-height:1.2;min-width:0;margin-right:auto}
.appbar .brand b{font-family:var(--display);font-weight:500;font-size:16.5px}
.appbar .brand b span{color:var(--gold)}
.appbar .brand small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ib{position:relative;width:40px;height:40px;padding:0;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.appbar .ib .count{position:absolute;top:-5px;right:-5px}
.role{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;vertical-align:1px;
  background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.role.banker{background:color-mix(in srgb,var(--gold) 18%,var(--surface));border-color:var(--gold);color:color-mix(in srgb,var(--gold) 70%,var(--ink))}
.role.admin{background:color-mix(in srgb,var(--danger) 12%,var(--surface));border-color:var(--danger);color:var(--danger)}
/* เมนู (bottom sheet) */
.menu{display:grid;gap:2px;margin:-4px -6px}
.menu button{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;text-align:left;border:0;background:transparent;padding:10px 8px;border-radius:12px}
.menu button .mi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--surface2)}
.menu button small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
/* แถบสถานะตา (กะทัดรัด) */
.turnbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.turnbar .tok{width:40px;height:40px;font-size:22px}
.turnbar .tt{min-width:0;display:grid;line-height:1.3}
.turnbar .tt small{font-size:12px;color:var(--muted);font-family:var(--mono)}
.turnbar .tt b{font-family:var(--display);font-weight:500;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turnbar .tt span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turnbar.mine{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 22%,var(--surface)),var(--surface));border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent),var(--shadow)}
.turnbar.mine .tt b{color:color-mix(in srgb,var(--gold) 60%,var(--ink))}
.turnbar .extra{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.turnbar .extra button{flex:1;min-width:max-content}
.turnbar .hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:7px 10px}
.turnbar.over{grid-template-columns:auto 1fr}
.turnbar.bankrupt{background:color-mix(in srgb,var(--danger) 14%,var(--surface));border-color:var(--danger)}
.turnbar.bankrupt .tt b{color:var(--danger)}
/* แถบนำทางด้านล่าง */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav .in{display:flex;gap:2px;width:100%;max-width:720px}
.bnav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:1px;padding:6px 2px;font-size:11.5px;color:var(--muted);border-radius:12px;position:relative}
.bnav button .bi{font-size:21px;line-height:1.15;filter:grayscale(.6);opacity:.75}
.bnav button:hover:not(:disabled){background:transparent;color:var(--ink)}
.bnav button[aria-selected="true"]{color:var(--jade);font-weight:600}
.bnav button[aria-selected="true"] .bi{filter:none;opacity:1}
.bnav button[aria-selected="true"]::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--jade)}
.bnav .count{position:absolute;top:2px;left:calc(50% + 6px)}
.bnav .dot{position:absolute;top:5px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--danger)}
/* หน้าบัญชี */
.hello{display:flex;align-items:center;gap:10px}
.hello .tok{width:42px;height:42px;font-size:23px}
.hello div{display:grid;line-height:1.3}
.hello small{color:var(--muted);font-size:12.5px}
.hello b{font-family:var(--display);font-weight:500;font-size:18px}
.card-bank{padding:20px 20px 16px;gap:2px}
.cb-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.cb-top .chipic{width:36px;height:26px;border-radius:6px;background:linear-gradient(135deg,#f3d27a,#b98613);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cb-acct{font-family:var(--mono);font-size:13px;letter-spacing:.14em;opacity:.8;position:relative;z-index:1}
.cb-bal small{font-size:.45em;opacity:.8;margin-left:4px;letter-spacing:0}
.cb-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.14);padding-top:10px;margin-top:12px}
.cb-foot span{display:grid;font-size:11.5px;opacity:.85;line-height:1.35}
.cb-foot b{font-family:var(--mono);font-size:14.5px;opacity:1}
.qa{display:grid;gap:12px;padding:14px 12px}
.qa-h{font-size:12.5px;font-weight:600;color:var(--muted);padding:0 4px;display:flex;align-items:center;gap:6px}
.qa-h small{font-weight:400}
.qa-g{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.qa-g button{display:grid;justify-items:center;align-content:start;gap:6px;border:0;background:transparent;padding:6px 2px;font-size:12.5px;line-height:1.25;border-radius:12px}
.qa-g button .qi{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:var(--qc,var(--surface2));transition:transform .12s}
.qa-g button:hover:not(:disabled) .qi{transform:translateY(-2px)}
.qa-g button:hover:not(:disabled){background:transparent}
.qi.t1{--qc:color-mix(in srgb,var(--jade) 16%,var(--surface))}
.qi.t2{--qc:color-mix(in srgb,var(--gold) 20%,var(--surface))}
.qi.t3{--qc:color-mix(in srgb,#5b7cc4 18%,var(--surface))}
.notice{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--note);border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line))}
.notice .ni{font-size:22px}
.notice b{display:block;font-size:14.5px}
.notice small{color:var(--muted);font-size:12.5px;display:block}
.notice.bad{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.stmt{padding:2px 14px}
.stmt .rh{font-size:12px;font-weight:600;color:var(--muted);padding:10px 0 2px;border-bottom:1px solid var(--line)}
/* เคาน์เตอร์แบงก์เกอร์ */
.teller{border-radius:20px;padding:18px 20px;color:#f6f3e8;display:grid;gap:4px;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,#b98613 0%,#7a5608 50%,#4a3405 100%);box-shadow:var(--shadow)}
.teller::after{content:"🏦";position:absolute;right:14px;bottom:-14px;font-size:92px;opacity:.14}
.teller .t1{font-size:12.5px;opacity:.85}
.teller .t2{font-family:var(--display);font-size:22px;font-weight:500}
.teller .t3{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:6px;position:relative;z-index:1}
.teller .t3 b{font-family:var(--mono);font-weight:500}
.q{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.q .qh{display:flex;align-items:center;gap:10px}
.q .qk{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.q .qk.in{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:var(--ok)}
.q .qk.out{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
.q .qamt{margin-left:auto;font-family:var(--mono);font-size:24px}
.q .qdo{font-size:14px;background:var(--surface2);border-radius:10px;padding:8px 12px}
.q .row button{flex:1}
.acc{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc small{display:block;color:var(--muted);font-size:12px}
.acc-actions{display:flex;gap:4px;flex:none}
.acc-actions button{padding:5px 7px;font-size:14px;border-radius:8px}
/* ป้ายสถานะเชื่อมต่อ (Live) บนแถบบน */
.livebadge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);flex:none;white-space:nowrap}
.livebadge i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.livebadge.on{color:#1b8a4c}
:root:not([data-theme="light"]) .livebadge.on{color:#4fd982}
.livebadge.on i{background:#2ecc71;box-shadow:0 0 0 0 rgba(46,204,113,.55);animation:livepulse 1.8s infinite}
.livebadge.off{color:var(--danger)}
.livebadge.off i{background:var(--danger)}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.55)}70%{box-shadow:0 0 0 6px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
@media (max-width:360px){.livebadge span{display:none}.livebadge{padding:6px}}
/* สลิปโอนเงิน */
.slip{display:grid;gap:12px;text-align:center}
.slip .ok{width:64px;height:64px;border-radius:50%;margin:4px auto 0;display:grid;place-items:center;font-size:32px;color:#fff;background:var(--ok);box-shadow:0 0 0 8px color-mix(in srgb,var(--ok) 18%,transparent)}
.slip .ok.wait{background:var(--gold);box-shadow:0 0 0 8px color-mix(in srgb,var(--gold) 20%,transparent)}
.slip h3{font-size:19px}
.slip .amt{font-family:var(--mono);font-size:34px;line-height:1.1}
.slip dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:14px;background:var(--surface2);border-radius:14px;padding:12px 14px;
  border-top:2px dashed var(--line)}
.slip dt{color:var(--muted)} .slip dd{margin:0;text-align:right;overflow-wrap:anywhere}
/* ฟอร์มเงิน: ช่องจำนวนเงินตัวใหญ่แบบแอปธนาคาร */
.sheet #in-amt{font-family:var(--mono);font-size:28px;text-align:right;padding:.35em .6em}
.sheet #in-amt{-moz-appearance:textfield;appearance:textfield}
.sheet #in-amt::-webkit-inner-spin-button,.sheet #in-amt::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sheet .quick button{flex:1;min-width:64px}
@media (max-width:560px){
  .modal{place-items:end center;padding:0}
  .sheet{max-width:none;border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
  .sheet .hd::before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%)}
  .sheet .hd{position:relative;padding-top:20px}
}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- ลงทุน / กราฟ / ความสำเร็จ (อัปเดตใหม่) ---- */
.stocks{padding:2px 12px}
.stk{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-areas:"ic n sp p" "own own own own" "b b b b";gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stk:last-child{border-bottom:0}
.stk-ic{grid-area:ic;font-size:24px}
.stk-n{grid-area:n;min-width:0}.stk-n small{display:block;color:var(--muted);font-size:11.5px}
.spark{grid-area:sp;width:60px;height:20px}
.stk-p{grid-area:p;text-align:right}.stk-p small{display:block;font-size:12px}
.stk-own{grid-area:own;font-size:12.5px;color:var(--muted)}
.stk-b{grid-area:b;display:flex;gap:6px;justify-content:flex-end}
.portline{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;width:100%;text-align:left;font-size:13px;padding:8px 12px;border-radius:12px;background:var(--surface2)}
.portline .muted{margin-left:auto}
.unit{display:flex;align-items:center;gap:6px}.unit input{min-width:0}.unit span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.seg{display:flex;gap:6px}.seg button{flex:1}
.seg button[aria-pressed="true"]{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 14%,var(--surface));font-weight:600}
.evodds{display:grid;gap:2px;margin-top:8px;font-size:13.5px}
.evodds>div{display:grid;grid-template-columns:1fr auto 52px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.evodds select{width:auto;padding:.25em .4em;font-size:13px}
.evodds b{text-align:right;font-weight:500}
.chart{width:100%;height:auto;display:block;background:var(--surface2);border-radius:10px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin:6px 0 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.achs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.ach{display:grid;justify-items:center;font-size:20px;width:62px;padding:4px 2px;border-radius:10px;border:1px solid var(--line);filter:grayscale(1);opacity:.35}
.ach small{font-size:9.5px;text-align:center;line-height:1.2;margin-top:2px}
.ach.on{filter:none;opacity:1;border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
/* ---- หน้าแรกแบบเลือกบทบาท + ห้องรอเริ่ม (ออกแบบใหม่) ---- */
.home,.lobby{max-width:520px}
.hero2{display:grid;justify-items:center;text-align:center;gap:6px;padding:4vh 0 6px}
.hero2 .coin{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 34px/1 var(--mono,monospace);color:#1c1400;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 55%,#fff),var(--gold) 60%);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent),var(--shadow)}
.hero2 h1{margin:4px 0 0;font-size:clamp(32px,9vw,44px);font-weight:700;line-height:1.1}
.hero2 h1 span{color:var(--gold)}
.hero2 p{margin:0;color:var(--muted);font-size:14.5px;max-width:34ch}
.homebody{display:grid;gap:14px}
.ask{margin:6px 0 0;font-size:20px}
.roles{display:grid;gap:10px}
.rolecard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.rolecard:hover:not(:disabled){border-color:var(--jade);transform:translateY(-1px);background:var(--surface)}
.rolecard:first-child{border-color:color-mix(in srgb,var(--jade) 55%,var(--line));background:color-mix(in srgb,var(--jade) 7%,var(--surface))}
.rc-ic{font-size:30px;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface2)}
.rc-tx b{display:block;font-size:17px}
.rc-tx em{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--jade);color:var(--jade-ink);vertical-align:2px;margin-left:4px}
.rc-tx small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.rc-go{font-size:26px;color:var(--muted)}
.steps3{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.35}
.steps3 b{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 4px;border-radius:50%;background:var(--surface2);color:var(--ink);font-family:var(--mono)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13.5px;justify-self:center;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover:not(:disabled){background:none;color:var(--ink)}
.backbtn{justify-self:start;background:none;border:0;padding:4px 0;color:var(--jade);font-weight:600}
.backbtn:hover:not(:disabled){background:none}
.bigin{font-size:18px;padding:.6em .8em}
.codein{font:600 24px/1.2 var(--mono,monospace);letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:.45em .5em}
.pinin{font:600 28px/1.2 var(--mono,monospace);letter-spacing:.5em;text-align:center;padding:.4em}
.joinbox .jb-h b{display:block}.joinbox .jb-h small{color:var(--muted);font-size:13px}
.joinbox.hot{border-color:var(--jade);box-shadow:0 0 0 2px color-mix(in srgb,var(--jade) 25%,transparent),var(--shadow)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
button.create{display:grid;gap:2px;padding:14px;border-radius:16px}
button.create small{font-weight:400;font-size:12.5px;opacity:.85}
.invited{text-align:center;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--gold) 16%,var(--surface));border:1px solid var(--gold);font-size:15px}
.explain{font-size:14px}.explain ul{margin:8px 0 0;padding-left:0;list-style:none;display:grid;gap:6px}
.tip{font-size:13px;margin:0}
/* ห้องรอเริ่ม */
.invitecard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.invitecard .qrbox{width:128px}
.ic-r{display:grid;gap:6px;min-width:0}.ic-r small{color:var(--muted);font-size:12.5px}
.bigcode{font-size:34px;letter-spacing:.2em;color:var(--jade);line-height:1.1;font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}.sec-h b{font-size:16px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.prow:last-of-type{border-bottom:0}
.prow .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .mv{display:flex;gap:4px}.prow .mv button{padding:2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.bank{background:color-mix(in srgb,var(--gold) 16%,var(--surface));border-color:var(--gold);font-weight:600}
.chip.adm{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-color:var(--danger)}
.bankcard{border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.bc-h{display:flex;gap:12px;align-items:flex-start}.bc-ic{font-size:28px}.bc-h small{display:block;color:var(--muted);font-size:13px}
.pinbox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.pinbox small{display:block;color:var(--muted);font-size:12px}.pinbox b{font-size:28px;letter-spacing:.25em;color:var(--jade)}
details.rules>summary,.tokdet>summary{cursor:pointer;font-weight:600;color:var(--jade);font-size:14px}
.tokdet>summary{font-weight:400;color:var(--muted);margin-bottom:6px}
.startbar{position:sticky;bottom:10px;z-index:5;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px;border-radius:16px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:var(--shadow)}
.startbar .big{flex:1;max-width:260px}
.waiting{color:var(--muted);font-size:14px;margin:auto}
.admseg{position:sticky;top:-2px;z-index:3;background:var(--surface);padding:4px 0 8px;flex-wrap:wrap}
.admseg button{flex:1 1 auto;white-space:nowrap}
.admquick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.admquick button{display:flex;align-items:center;gap:10px;text-align:left;font-size:20px;padding:12px;border-radius:14px}
.admquick span{font-size:14px;font-weight:600;display:grid}.admquick small{font-weight:400;color:var(--muted);font-size:11.5px}
.howcard>summary{cursor:pointer;display:flex;align-items:baseline;gap:8px;list-style:none}
.howcard>summary::-webkit-details-marker{display:none}
.howcard>summary::after{content:"▾";margin-left:auto;color:var(--muted)}.howcard[open]>summary::after{content:"▴"}
.how5{list-style:none;margin:10px 0 8px;padding:0;display:grid;gap:10px;counter-reset:h}
.how5 li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.h5-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--surface2);position:relative;counter-increment:h}
.h5-ic::after{content:counter(h);position:absolute;top:-5px;left:-5px;width:17px;height:17px;border-radius:50%;background:var(--jade);color:var(--jade-ink);font:600 10.5px/17px var(--mono,monospace);text-align:center}
.how5 b{display:block;font-size:14.5px}.how5 small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}

/* คอมจอกว้าง: แถบเมนูล่างย้ายไปเป็นแถบข้างซ้าย */

/* ================== แอปธนาคาร (ลูกค้า) / ระบบเจ้าหน้าที่ / โต๊ะเล่น ================== */
:root{--ba1:#0a6b5a;--ba2:#0d8a72;--sf1:#14213d;--sf2:#1f3461}
.ba-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 19px/1 var(--mono,monospace);color:#1c1400;flex:none;
  background:radial-gradient(circle at 35% 30%,#ffe9a8,#e0a526 65%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ba-logo.big{width:72px;height:72px;font-size:40px;border-radius:22px}
/* โต๊ะเล่น: การ์ดเงินย่อ + ปุ่มแอปธนาคารเด่นๆ */
.minicard{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:14px 16px;border:0;border-radius:18px;color:#fff;
  background:linear-gradient(135deg,var(--ba1),var(--ba2));box-shadow:0 6px 18px color-mix(in srgb,var(--ba1) 35%,transparent)}
.minicard:hover:not(:disabled){background:linear-gradient(135deg,var(--ba1),var(--ba2));filter:brightness(1.06)}
.mc-l{display:grid}.mc-l small{opacity:.85;font-size:12.5px}.mc-l b{font-size:26px;line-height:1.15}
.mc-r{font-weight:600;font-size:14px;white-space:nowrap;background:rgba(255,255,255,.16);padding:8px 12px;border-radius:12px;position:relative}
.mc-r .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--danger)}
.bnav button.bankbtn .bi{filter:none;opacity:1}
.bnav button.bankbtn{color:var(--ba2);font-weight:700}
/* แอปธนาคาร */
.bankapp{margin:0 calc(-1 * var(--gutter));min-height:100vh;padding:0 var(--gutter) calc(90px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,var(--ba1) 0,var(--ba2) 150px,var(--ground) 150px)}
.ba-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;color:#fff;background:var(--ba1)}
.ba-x{background:rgba(255,255,255,.15);border:0;color:#fff;font-weight:600;padding:.45em .8em;border-radius:999px}
.ba-x:hover:not(:disabled){background:rgba(255,255,255,.25)}
.ba-brand{display:flex;align-items:center;gap:8px;margin:0 auto}.ba-brand b{font-size:16px;letter-spacing:.02em}
.ba-ver .livebadge{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.ba-hello{color:#fff;padding:6px 2px 14px;display:grid}.ba-hello small{opacity:.8}.ba-hello b{font-size:20px}
.ba-turn{width:100%;margin-bottom:10px;border:0;border-radius:14px;padding:10px;font-weight:700;background:var(--gold);color:#1c1400;animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--gold) 35%,transparent)}}
.bankapp .split{grid-template-columns:1fr}
.sf-act .livebadge span{max-width:none}

.bankapp .card-bank{box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ba-nav button[aria-selected="true"]{color:var(--ba2)}.ba-nav button[aria-selected="true"]::before{background:var(--ba2)}
/* ระบบเจ้าหน้าที่ */
.staff{margin:0 calc(-1 * var(--gutter));min-height:100vh;padding:0 var(--gutter) calc(90px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,var(--sf1) 0,var(--sf2) 120px,var(--ground) 120px)}
.sf-top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;color:#fff;background:var(--sf1)}
.sf-brand{display:flex;align-items:center;gap:10px}.sf-brand small{display:block;font-size:11.5px;opacity:.75}.sf-brand b{font-size:16px}
.sf-act{display:flex;gap:6px;align-items:center}.sf-act .ib{background:rgba(255,255,255,.12);border-color:transparent;color:#fff;width:38px;height:38px;border-radius:12px;padding:0}

.sf-who small{font-size:12px;opacity:.75}
.sf-turn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px}
.sf-turn .tok{width:32px;height:32px;font-size:18px}.sf-turn .st-n{flex:1;min-width:120px}
.sf-body{max-width:1080px;padding:0}
.staff .bankseg button[aria-pressed="true"]{background:var(--sf2);border-color:var(--sf2);color:#fff}
.staff .seghint{border-left-color:var(--sf2)}
.sf-nav button[aria-selected="true"]{color:var(--sf2)}

/* หน้าจอเข้าสู่ระบบสั้นๆ */
.splash{position:fixed;inset:0;z-index:90;display:grid;place-content:center;justify-items:center;gap:10px;color:#fff;animation:splash .7s ease forwards}
.splash.bank{background:linear-gradient(160deg,var(--ba1),var(--ba2))}.splash.staff{background:linear-gradient(160deg,var(--sf1),var(--sf2))}
.splash b{font-size:22px}.splash small{opacity:.85}
.splash .bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;display:block}
.splash .bar i{display:block;height:100%;width:40%;background:#fff;border-radius:4px;animation:load .5s ease-in-out infinite}
@keyframes splash{0%{opacity:0}20%{opacity:1}75%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
/* คอม: แอปธนาคารแสดงเป็นกรอบมือถือกลางจอ · เจ้าหน้าที่ใช้เต็มจอ */

  body.ingame.view-bank{padding-left:var(--gutter)}

  body.ingame.view-bank .bnav .in{flex-direction:row}
  body.ingame.view-bank .bnav button{flex:1;display:grid;justify-items:center;padding:6px 2px;font-size:11.5px}
  body.ingame.view-bank .bnav button[aria-selected="true"]{background:transparent}
  body.ingame.view-bank .bnav button[aria-selected="true"]::before{top:-6px;bottom:auto;left:28%;right:28%;width:auto;height:3px}
  .staff,.bankapp{margin-inline:calc(-1 * var(--gutter))}
}
/* ---- QR จ่ายเงิน ---- */
.qrbar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qrbar button{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--ba2) 45%,var(--line));box-shadow:var(--shadow)}
.qrbar button span{grid-row:1/3;font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--ba2) 14%,var(--surface))}
.qrbar b{font-size:15px}.qrbar small{font-size:11.5px;color:var(--muted)}
.payqr{display:grid;place-items:center}
.pq-card{width:min(300px,100%);display:grid;justify-items:center;gap:8px;padding:16px;border-radius:22px;background:#fff;color:#123;box-shadow:0 10px 30px rgba(0,0,0,.18);border-top:6px solid var(--ba2)}
.pq-h{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;width:100%}.pq-h .ba-logo{grid-row:1/3}.pq-h b{font-size:15px}.pq-h small{color:#667;font-size:11.5px}
