.pq-to{font-size:17px}.pq-amt{font-size:28px;font-weight:700;color:var(--ba1)}.pq-amt small{font-size:14px;color:#667}
.scanbox{position:relative;width:100%;max-width:360px;aspect-ratio:1;margin:0 auto;border-radius:22px;overflow:hidden;background:#000}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.sc-frame{position:absolute;inset:14%;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.9)}
.sc-frame i{position:absolute;left:6%;right:6%;height:2px;background:#4ef0b0;box-shadow:0 0 10px #4ef0b0;animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{top:8%}to{top:92%}}
.sc-msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px;padding:0 14px;text-shadow:0 1px 3px #000}
.qrto{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--ba2) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--ba2) 40%,var(--line))}
.qrto small{display:block;color:var(--muted);font-size:12px}.qrto b{font-size:17px}.qrto .badge{margin-left:auto}
[hidden]{display:none!important}
/* ---- รายงานประจำปี ---- */
.rp-pick .chip{cursor:pointer}.rp-pick .chip.on{background:var(--ba2);border-color:var(--ba2);color:#fff;font-weight:700}
.report{display:grid;gap:12px;border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.rp-h{display:flex;align-items:center;gap:12px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--ba1),var(--ba2))}
.rp-tok{font-size:40px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.rp-h small{display:block;opacity:.8;font-size:12px}.rp-h b{display:block;font-size:22px;line-height:1.2}.rp-h em{font-style:normal;color:#ffe9a8;font-weight:600}
.rp-rank{margin-left:auto;font:800 28px var(--mono,monospace)}
.rp-worth{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:0 16px}
.rp-worth small{display:block;color:var(--muted);font-size:12px}.rp-worth b{font-size:28px;display:block;line-height:1.1}
.rp-worth span{font-size:12.5px}.up{color:var(--ok)}.down{color:var(--danger)}
.rp-spark{width:100%;height:50px;color:var(--ba2)}
.rp-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.rp-t{font-weight:700;font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.rb{position:relative;display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:4px 0 10px}
.rb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb i{position:absolute;left:0;bottom:2px;height:5px;border-radius:5px}.rb i.in{background:var(--ok)}.rb i.out{background:var(--danger)}
.rp-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:0 16px}
.rp-facts div{padding:8px 10px;border-radius:12px;background:var(--surface2)}.rp-facts small{display:block;color:var(--muted);font-size:11.5px}.rp-facts b{font-size:13.5px}
.report .badges{padding:0 16px 16px}
.report>:last-child{margin-bottom:16px}
@media (max-width:480px){.rp-cols{grid-template-columns:1fr}.rp-worth{grid-template-columns:1fr}}
/* ================== โต๊ะเล่นแบบใหม่ ================== */
html,body{overflow-x:hidden;max-width:100%}
body.ingame:not(.view-bank):not(.view-staff){background:
  radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--ba2) 22%,transparent),transparent 60%),
  repeating-linear-gradient(45deg,color-mix(in srgb,var(--ink) 2.5%,transparent) 0 2px,transparent 2px 7px),var(--ground)}
.spot{position:relative;display:grid;gap:12px;padding:16px;border-radius:24px;color:#fff;overflow:hidden;
  background:linear-gradient(145deg,#12302b,#0b1f1c);box-shadow:0 12px 32px rgba(0,0,0,.25);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.spot::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--tc) 55%,transparent),transparent 70%);opacity:.55}
.spot.mine{background:linear-gradient(145deg,#3a2c05,#1e1604);border-color:var(--gold)}
.spot.mine::before{background:radial-gradient(circle,rgba(240,196,25,.6),transparent 70%)}
.sp-round{position:absolute;top:12px;right:14px;display:grid;justify-items:center;line-height:1;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.1)}
.sp-round span{font-size:10.5px;opacity:.75}.sp-round b{font-size:22px}
.sp-main{display:flex;align-items:center;gap:14px;position:relative}
.sp-tok{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:42px;background:rgba(255,255,255,.08);
  box-shadow:0 0 0 3px var(--tc),0 0 24px color-mix(in srgb,var(--tc) 70%,transparent);animation:bob 2.4s ease-in-out infinite}
.spot.mine .sp-tok{box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(240,196,25,.7)}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.sp-txt{min-width:0;display:grid;gap:2px}.sp-txt small{opacity:.8;font-size:13px}.sp-txt>b{font-size:26px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot.mine .sp-txt small{color:#ffd95c;font-weight:700}
.sp-q{display:flex;align-items:center;gap:4px;margin-top:4px;flex-wrap:wrap}.sp-q small{font-size:11.5px;opacity:.7;margin-right:4px}.sp-q i{opacity:.4;font-style:normal;font-size:12px}
.qt{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:rgba(255,255,255,.1);box-shadow:0 0 0 1.5px var(--c)}
.qt.skip{opacity:.4}
.sp-act{display:flex;gap:8px;position:relative}
.sp-end{flex:1;min-height:52px;border:0;border-radius:16px;font-size:18px;font-weight:800;color:#1c1400;background:linear-gradient(180deg,#ffd95c,#e0a526);box-shadow:0 4px 0 #9b6f10}
.sp-end:hover:not(:disabled){background:linear-gradient(180deg,#ffe07a,#e8ae2e)}
.sp-end:active{transform:translateY(2px);box-shadow:0 2px 0 #9b6f10}
.sp-go{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;border-radius:16px;font-weight:600;padding:0 14px}
.sp-go:hover:not(:disabled){background:rgba(255,255,255,.18)}
.sp-hint{font-size:13px;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.08);position:relative}
.sp-ev{position:absolute;top:12px;right:76px;background:rgba(255,255,255,.1);border:0;color:#fff;width:40px;height:40px;padding:0;border-radius:12px;font-size:18px}
.pstrip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:thin}
.pc{flex:0 0 132px;scroll-snap-align:start;display:grid;justify-items:center;gap:4px;padding:12px 8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:center}
.pc.now{border-color:var(--c);box-shadow:0 0 0 2px var(--c),var(--shadow)}
.pc.out{opacity:.45;filter:grayscale(.8)}
.pc-top{position:relative}.pc-tok{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--c) 15%,var(--surface));box-shadow:0 0 0 2px var(--c)}
.pc-rk{position:absolute;right:-10px;top:-6px;font-size:18px}
.pc-n{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc-bal{font-size:16px;font-weight:700}
.pc-tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center}.pc-ach{font-size:11.5px}
.tablegrid{display:grid;gap:14px}.tablegrid>div{min-width:0}
@media (min-width:900px){.tablegrid{grid-template-columns:1fr 1fr;align-items:start}}
@media (min-width:1100px){.pstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));overflow:visible}}
/* ให้แต่ละหน้าพอดีจอ: เนื้อหาไม่ถูกแถบล่างทับ และไม่มีช่องว่างเกิน */
.wrap.tablev{min-height:calc(100dvh - 96px);align-content:start}
.bankapp,.staff{min-height:100dvh}
/* ==================================================================
   v5 — หน้าจอในเกมชุดใหม่ (โต๊ะเกม / แอปธนาคาร / ระบบเจ้าหน้าที่)
   แยกไฟล์ไว้ให้แก้ง่าย — ทุกอย่างอยู่ใต้ body.g5 ไม่ชนกับหน้าล็อบบี้/หน้าแรก
   ================================================================== */
body.g5{padding:0;min-height:100dvh}
body.g5 #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.g5v{min-height:100dvh;display:flex;flex-direction:column}
.g5-main{width:100%;max-width:1120px;margin:0 auto;padding:14px 16px calc(110px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;align-content:start}
.g5-main>*{min-width:0}
.g5 .sec-h{display:flex;align-items:center;gap:8px;margin:6px 2px -4px}
.g5 .sec-h h2{font-size:17px;font-weight:500}
.g5 .sec-h .more{margin-left:auto;font-size:13px;border:0;background:none;padding:6px 4px;color:var(--jade);font-weight:600}
.g5 .ib5{width:42px;height:42px;padding:0;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none;position:relative}
.g5 .ib5 .count{position:absolute;top:-5px;right:-5px}
.hdot{display:inline-grid;place-items:center;width:22px;height:22px;padding:0;border-radius:50%;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--muted);flex:none}
.hdot:hover:not(:disabled){color:var(--jade);border-color:var(--jade)}

/* ---------- แถบล่าง (ใช้ร่วมทุกมุมมอง) ---------- */
.g5-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.g5-nav .in{display:flex;align-items:flex-end;gap:2px;width:100%;max-width:560px}
.g5-nav button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 2px;min-height:52px;font-size:11.5px;color:var(--muted);border-radius:12px;position:relative}
.g5-nav button .bi{font-size:21px;line-height:1.15;filter:grayscale(.55);opacity:.8;transition:transform .15s}
.g5-nav button:hover:not(:disabled){background:transparent;color:var(--ink)}
.g5-nav button[aria-selected="true"]{color:var(--nav-on,var(--jade));font-weight:700}
.g5-nav button[aria-selected="true"] .bi{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
.g5-nav button[aria-selected="true"]::after{content:"";position:absolute;bottom:2px;width:18px;height:3px;border-radius:3px;background:currentColor}
.g5-nav .count{position:absolute;top:0;left:calc(50% + 6px)}
.g5-nav .dot{position:absolute;top:4px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--surface)}
/* ปุ่มกลางแบบแอปธนาคารไทย (สแกน/โอน) */
.g5-nav .fab{flex:0 0 74px;margin-top:-26px;color:var(--ink);font-weight:600}
.g5-nav .fab .bi{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;filter:none;opacity:1;color:#1c1400;
  background:linear-gradient(160deg,#ffdc6b,#e2a21f);box-shadow:0 6px 16px rgba(180,120,10,.45),0 0 0 4px var(--surface)}
.g5-nav .fab:active .bi{transform:scale(.94)}

/* ==================================================================
   1) โต๊ะเกม — โทนผ้าสักหลาดเขียวเข้ม แยกบรรยากาศ "เล่นเกม" ออกจาก "แอปธนาคาร"
   ================================================================== */
body.g5-table{background:#0a2520;color:#eaf3ef}
.g5v.table{--glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--gline:rgba(255,255,255,.12);--gmuted:#9fbbb2;
  background:radial-gradient(ellipse 120% 70% at 50% -10%,#1a5a4d 0%,transparent 60%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/14px 14px,
    linear-gradient(180deg,#0d3029,#081d19)}
.table .g5-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;
  background:rgba(8,29,25,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--gline)}
.g5-logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:600;font-size:20px;
  background:linear-gradient(145deg,#ffd76a,#c98a0a);color:#2a1a00;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.25)}
.g5-brand{display:grid;line-height:1.2;min-width:0;margin-right:auto}
.g5-brand b{font-family:var(--display);font-weight:500;font-size:16.5px}
.g5-brand b span{color:#f3c64d}
.g5-brand small{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.table .ib5{background:var(--glass);border-color:var(--gline);color:#fff}
.table .ib5:hover:not(:disabled){background:var(--glass2)}
.table .livebadge{background:var(--glass);border-color:var(--gline);color:#cfe6de}

/* การ์ดตาเล่น (หัวใจของหน้าโต๊ะ) */
.turn5{position:relative;overflow:hidden;border-radius:26px;padding:18px;display:grid;gap:14px;
  background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 28%,#103a33),#0b2722 70%);border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);
  box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.turn5.mine{background:linear-gradient(150deg,#5a4206,#251a03 75%);border-color:#f3c64d}
.turn5::after{content:"";position:absolute;inset:auto -80px -120px auto;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--tc) 45%,transparent),transparent 70%);pointer-events:none}
.turn5.mine::after{background:radial-gradient(circle,rgba(243,198,77,.45),transparent 70%)}
.t5-head{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.t5-av{width:78px;height:78px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:42px;background:rgba(255,255,255,.08);
  box-shadow:0 0 0 3px var(--tc),0 0 26px color-mix(in srgb,var(--tc) 65%,transparent);animation:bob 2.6s ease-in-out infinite}
.turn5.mine .t5-av{box-shadow:0 0 0 3px #f3c64d,0 0 34px rgba(243,198,77,.7)}
.t5-who{min-width:0;display:grid;gap:3px}
.t5-who small{font-size:13px;color:var(--gmuted);font-weight:600;letter-spacing:.02em}
.turn5.mine .t5-who small{color:#ffd95c}
.t5-who b{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t5-round{position:absolute;top:0;right:0;display:grid;justify-items:center;line-height:1;padding:7px 11px;border-radius:13px;background:rgba(0,0,0,.25);border:1px solid var(--gline)}
.t5-round span{font-size:10.5px;opacity:.75}.t5-round b{font-size:22px;font-family:var(--mono)}
.t5-next{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.t5-next small{font-size:11.5px;opacity:.7;margin-right:2px}
.t5-next .qt{width:26px;height:26px;font-size:14px}
.t5-next i{opacity:.35;font-style:normal;font-size:11px}
/* 3 ขั้นตอนในตา: สอนเล่นไปในตัว */
.t5-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative;z-index:1;list-style:none;margin:0;padding:0}
.t5-steps li{display:grid;justify-items:center;gap:2px;text-align:center;padding:8px 4px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--gline);font-size:12px;line-height:1.3;color:#d9ebe5}
.t5-steps li b{font-size:20px;line-height:1}
.t5-steps li.on{background:rgba(243,198,77,.16);border-color:rgba(243,198,77,.5);color:#ffe7a3}
.t5-act{display:flex;gap:8px;position:relative;z-index:1}
.t5-end{flex:1;min-height:56px;border:0;border-radius:18px;font-size:19px;font-weight:800;color:#1c1400;
  background:linear-gradient(180deg,#ffdc6b,#e0a526);box-shadow:0 5px 0 #9b6f10,0 10px 22px rgba(0,0,0,.3)}
.t5-end:hover:not(:disabled){background:linear-gradient(180deg,#ffe384,#e8ae2e)}
.t5-end:active{transform:translateY(3px);box-shadow:0 2px 0 #9b6f10}
.t5-go{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);color:#fff;border-radius:18px;font-weight:600;padding:0 14px;line-height:1.25;font-size:14px}
.t5-go:hover:not(:disabled){background:rgba(255,255,255,.16)}
.t5-hint{position:relative;z-index:1;font-size:13.5px;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.22);color:#d9ebe5}
.t5-ev{position:absolute;top:0;right:64px;background:rgba(0,0,0,.25);border:1px solid var(--gline);color:#fff;width:42px;height:42px;padding:0;border-radius:13px;font-size:18px}
.turn5.over{--tc:#f3c64d}

/* กระเป๋าเงินย่อ (แตะเปิดแอป) */
.wallet5{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;border:0;color:#fff;
  background:linear-gradient(120deg,#12806d,#0b5146);box-shadow:0 10px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.15)}
.wallet5:hover:not(:disabled){background:linear-gradient(120deg,#169079,#0d5a4e)}
.wallet5 .w-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.14);flex:none;position:relative}
.wallet5 .w-ic .dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:#ff5a4a;box-shadow:0 0 0 2px #0b5146}
.wallet5 .w-tx{display:grid;min-width:0;margin-right:auto}
.wallet5 .w-tx small{font-size:12.5px;opacity:.85}
.wallet5 .w-tx b{font-size:24px;font-family:var(--mono);font-weight:500;letter-spacing:-.01em}
.wallet5 .w-go{font-size:13.5px;font-weight:700;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.16);white-space:nowrap}

/* แถบอัตราวันนี้ (เลื่อนแนวนอน) */
.rates5{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin:0 -16px;padding-inline:16px}
.rates5::-webkit-scrollbar{display:none}
.rates5 button{flex:none;display:grid;gap:1px;text-align:left;padding:8px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--gline);color:#eaf3ef;min-width:96px}
.rates5 button:hover:not(:disabled){background:var(--glass2)}
.rates5 small{font-size:11px;color:var(--gmuted)}
.rates5 b{font-family:var(--mono);font-weight:500;font-size:15px}
.rates5 .up{color:#5fd68e}.rates5 .dn{color:#ff8a7a}

/* อันดับเศรษฐี */
.board5{border-radius:22px;background:var(--glass);border:1px solid var(--gline);padding:6px;display:grid;gap:4px}
.lb{display:grid;grid-template-columns:28px 44px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:16px;position:relative}
.lb.now{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 70%,transparent)}
.lb.out{opacity:.45;filter:grayscale(.8)}
.lb-rk{font-size:19px;text-align:center;font-family:var(--mono);color:var(--gmuted)}
.lb-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 0 2px var(--c)}
.lb-n{min-width:0;display:grid;gap:4px}
.lb-n b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-n b em{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#f3c64d;color:#2a1a00;margin-left:6px;vertical-align:2px}
.lb-bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.lb-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,#fff))}
.lb-r{display:grid;justify-items:end;gap:3px}
.lb-r b{font-family:var(--mono);font-weight:500;font-size:16px}
.lb-r b.neg{color:#ff8a7a}
.lb-tags{display:flex;gap:4px;align-items:center}
.table .badge{background:rgba(255,255,255,.08);border-color:var(--gline);color:#eaf3ef}
.table .badge.bad{background:rgba(255,90,74,.18);border-color:#ff8a7a;color:#ffb3a8}
.table .newsticker{background:var(--glass);border-color:var(--gline);color:#eaf3ef}
.table .effect{background:rgba(243,198,77,.14);border-color:rgba(243,198,77,.4);color:#ffe7a3}
.table .sec-h h2{color:#eaf3ef}.table .sec-h .muted,.table .muted{color:var(--gmuted)}
.table .sec-h .more{color:#f3c64d}
.table .hdot{background:var(--glass);border-color:var(--gline);color:var(--gmuted)}
/* การ์ดกระดาษบนโต๊ะ (เนื้อหาเดิม เช่น ข่าว/ผลการแข่ง) ให้อ่านง่ายบนพื้นเข้ม */
.table .paper{background:var(--surface);color:var(--ink);border-radius:22px;padding:14px;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.table .paper .muted{color:var(--muted)}
.table details.dk{border-radius:18px;background:var(--glass);border:1px solid var(--gline);padding:12px 14px}
.table details.dk summary{cursor:pointer;color:#eaf3ef}
.table details.dk .panel{color:var(--ink)}
.table .notice{color:var(--ink)}
.tbl-grid{display:grid;gap:14px}
@media (min-width:980px){
  .tbl-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
  .tbl-grid>.c1{position:sticky;top:76px}
}
.table .g5-nav{--nav-on:#f3c64d;background:rgba(8,29,25,.92);border-top-color:var(--gline)}
.table .g5-nav button{color:#9fbbb2}
.table .g5-nav button:hover:not(:disabled){color:#fff}
.table .g5-nav .fab{color:#fff}
.table .g5-nav .fab .bi{box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 4px #0b231f}
.table .g5-nav .dot{box-shadow:0 0 0 2px #0b231f}

/* ==================================================================
   2) แอปธนาคาร "เศรษฐีแบงก์" — สว่าง สะอาด เหมือนแอปธนาคารจริง
   ================================================================== */
body.g5-bank{background:var(--ground)}
.g5v.bank{--b1:#0f7a69;--b2:#08483f;--nav-on:var(--b1)}
.bk-head{position:relative;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 86px;color:#fff;
  background:radial-gradient(circle at 85% -20%,rgba(255,220,107,.28),transparent 45%),linear-gradient(160deg,var(--b1),var(--b2));
  border-radius:0 0 28px 28px}
.bk-bar{display:flex;align-items:center;gap:8px}
.bk-back{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:13.5px}
.bk-back:hover:not(:disabled){background:rgba(255,255,255,.2)}
.bk-title{margin-right:auto;display:flex;align-items:center;gap:7px;font-family:var(--display);font-size:16px}
.bk-title .g5-logo{width:30px;height:30px;font-size:16px;border-radius:9px}
.bank .ib5{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff}
.bank .ib5:hover:not(:disabled){background:rgba(255,255,255,.2)}
.bank .livebadge{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#e3fff6}
.bk-hello{display:flex;align-items:center;gap:12px;margin-top:16px}
.bk-hello .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.16);box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.bk-hello small{display:block;opacity:.85;font-size:13px}
.bk-hello b{font-family:var(--display);font-weight:500;font-size:21px}
.bk-body{width:100%;max-width:560px;margin:-72px auto 0;padding:0 16px calc(118px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;position:relative;z-index:1}
/* บัตรบัญชี */
.acct5{border-radius:24px;padding:18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#123a35 0%,#0b2723 60%,#1a1206 130%);box-shadow:0 18px 40px rgba(6,40,35,.35)}
.acct5::before{content:"";position:absolute;right:-50px;top:-70px;width:220px;height:220px;border-radius:50%;border:26px solid rgba(232,179,58,.14)}
.acct5.neg{background:linear-gradient(135deg,#4a1712,#22100c)}
.a5-top{display:flex;align-items:center;gap:8px;position:relative}
.a5-top small{font-size:12.5px;opacity:.85}
.a5-top .credit{margin-left:auto}
.a5-no{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13.5px;letter-spacing:.08em;opacity:.8;margin-top:4px}
.a5-no button{border:0;background:rgba(255,255,255,.12);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:999px}
.a5-lbl{margin-top:14px;font-size:13px;opacity:.85;display:flex;align-items:center;gap:6px}
.a5-lbl button{border:0;background:rgba(255,255,255,.12);color:#fff;padding:2px 9px;border-radius:999px;font-size:13px}
.a5-bal{font-family:var(--mono);font-size:40px;font-weight:500;line-height:1.1;letter-spacing:-.02em;position:relative}
.a5-bal small{font-family:var(--body);font-size:15px;opacity:.8;margin-left:6px;letter-spacing:0}
.a5-bal.hid{letter-spacing:.12em}
.a5-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);position:relative}
.a5-foot span{display:grid;font-size:11.5px;opacity:.85}
.a5-foot b{font-family:var(--mono);font-weight:500;font-size:14.5px;opacity:1}
/* ปุ่มหลัก 4 ปุ่ม */
.prim5{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 8px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.prim5 button,.svc5 button{border:0;background:transparent;display:grid;justify-items:center;gap:6px;padding:6px 2px;font-size:12.5px;line-height:1.25;color:var(--ink);text-align:center;border-radius:14px}
.prim5 button:hover:not(:disabled),.svc5 button:hover:not(:disabled){background:var(--surface2)}
.prim5 .pi{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-size:25px;background:color-mix(in srgb,var(--b1) 13%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--b1) 22%,transparent)}
.prim5 b{font-weight:600}
.svc5{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 6px;padding:10px 8px 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.svc5 .si{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--surface2)}
.svc5 .t2 .si,.prim5 .t2 .pi{background:color-mix(in srgb,var(--gold) 18%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent)}
.svc5 .t3 .si{background:color-mix(in srgb,#5b6fd6 14%,var(--surface))}
.svc5 .t4 .si{background:color-mix(in srgb,#c2569a 13%,var(--surface))}
.svc5 small{font-size:11px;color:var(--muted)}
.svc-hd{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:4px 6px 0}
.svc-hd .cash{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--gold) 18%,var(--surface));color:#8a5a00}
/* แบนเนอร์ถึงตา */
.bk-turn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:18px;border:0;text-align:left;font-weight:700;color:#2a1a00;
  background:linear-gradient(100deg,#ffe07a,#f0b638);box-shadow:0 8px 20px rgba(200,140,10,.3);animation:pulse5 2s ease-in-out infinite}
.bk-turn span{margin-left:auto;font-size:13px;opacity:.8}
@keyframes pulse5{50%{box-shadow:0 8px 28px rgba(240,182,56,.6)}}
/* รายการล่าสุด */
.stmt5{border-radius:22px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.stmt5 .rh{padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);letter-spacing:.02em}
.tx5{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;padding:11px 14px;border:0;border-radius:0;background:transparent;text-align:left;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.tx5:hover:not(:disabled){background:var(--surface2)}
.tx5 .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:var(--surface2)}
.tx5.in .ic{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.tx5.out .ic{background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.tx5 .m{min-width:0;display:grid}
.tx5 .m b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx5 .m small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx5 .a{font-family:var(--mono);font-weight:500;font-size:15.5px}
.tx5.in .a{color:var(--ok)}
.empty5{display:grid;justify-items:center;gap:4px;padding:26px 16px;text-align:center;color:var(--muted)}
.empty5 b{font-size:30px}
.bank .split{grid-template-columns:1fr!important}
@media (min-width:700px){
  body.g5-bank{background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,#0f7a69 18%,transparent),transparent 60%),var(--ground)}
  .bk-head{max-width:560px;margin:16px auto 0;border-radius:28px 28px 28px 28px}
  .bank .g5-nav{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:14px;border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
  .bk-body{padding-bottom:130px}
}

/* ==================================================================
   3) ระบบเจ้าหน้าที่ธนาคาร — โทนน้ำเงินกรมท่า แบบระบบหลังบ้านธนาคาร
   ================================================================== */
body.g5-staff{background:#eef1f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body.g5-staff{background:#0d1320}}
:root[data-theme="dark"] body.g5-staff{background:#0d1320}
.g5v.staff{--s1:#1d3a78;--s2:#0f1f45;--nav-on:#2c56b0}
.tl-head{color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(160deg,var(--s1),var(--s2))}
.tl-bar{display:flex;align-items:center;gap:10px;max-width:1120px;margin:0 auto}
.tl-bar .g5-brand small{opacity:.8}
.staff .ib5{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff}
.staff .livebadge{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#e3ecff}
.tl-who{display:flex;align-items:center;gap:8px;max-width:1120px;margin:10px auto 0;flex-wrap:wrap}
.tl-who .badge5{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:9px;background:#fff;color:#0f1f45;font-weight:700;font-size:13px}
.tl-who small{opacity:.8;font-size:12.5px}
.tl-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:1120px;margin:12px auto 0}
.tl-kpi div{display:grid;gap:2px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.tl-kpi small{font-size:11px;opacity:.8}
.tl-kpi b{font-family:var(--mono);font-weight:500;font-size:17px}
.tl-kpi .hot{background:rgba(255,196,64,.18);border-color:rgba(255,196,64,.5)}
.tl-kpi .hot b{color:#ffd56b}
.tl-turn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);flex-wrap:wrap}
.tl-turn .nm{margin-right:auto;display:grid;line-height:1.25}
.tl-turn .nm small{font-size:12px;color:var(--muted)}
.tl-turn .nm b{font-size:16px}
.staff .g5-main{max-width:900px}
.staff .bankseg button[aria-pressed="true"]{background:var(--s1,#1d3a78);border-color:var(--s1,#1d3a78)}
.staff .q{border-left:4px solid var(--s1)}
@media (max-width:420px){.tl-kpi{grid-template-columns:repeat(2,1fr)}}

/* ==================================================================
   ทัวร์สอนเล่น (ชี้ทีละจุด) + ศูนย์ช่วยเหลือ + มีอะไรใหม่
   ================================================================== */
#tour-root{position:fixed;inset:0;z-index:80;pointer-events:none}
#tour-root.on{pointer-events:auto}
.tour-hole{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(4,14,12,.72);transition:all .28s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid #ffd95c;outline-offset:3px}
.tour-hole.none{width:0!important;height:0!important;left:50%!important;top:40%!important;outline:0}
.tour-tip{position:fixed;left:16px;right:16px;max-width:400px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:20px;padding:16px;display:grid;gap:10px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);transition:top .28s cubic-bezier(.2,.8,.2,1);animation:tipIn .25s ease-out}
@keyframes tipIn{from{opacity:0;transform:translateY(6px)}}
.tour-tip .tk{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--gold)}
.tour-tip h3{font-family:var(--display);font-weight:500;font-size:19px;margin:0;display:flex;gap:8px;align-items:center}
.tour-tip p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink)}
.tour-tip .tf{display:flex;align-items:center;gap:8px}
.tour-tip .dots{display:flex;gap:5px;margin-right:auto}
.tour-tip .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tour-tip .dots i.on{background:var(--jade);width:18px;border-radius:4px}
.tour-tip .skip{border:0;background:none;color:var(--muted);padding:8px 6px}
.help5{display:grid;gap:12px}
.help5 .quick5{display:grid;gap:8px;counter-reset:q;list-style:none;margin:0;padding:0}
.help5 .quick5 li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:14px;background:var(--surface2);font-size:14px;line-height:1.5}
.help5 .quick5 li::before{counter-increment:q;content:counter(q);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--jade);color:var(--jade-ink)}
.help5 .tours{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.help5 .tours button{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:16px;font-size:12.5px;line-height:1.3}
.help5 .tours button span{font-size:24px}
.help5 .tours button.cur{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.help5 details{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.help5 details[open]{box-shadow:var(--shadow)}
.help5 summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:600;list-style:none}
.help5 summary::-webkit-details-marker{display:none}
.help5 summary::after{content:"›";margin-left:auto;color:var(--muted);transition:transform .2s;font-size:18px}
.help5 details[open] summary::after{transform:rotate(90deg)}
.help5 summary .hi{font-size:20px}
.help5 .hb{padding:0 14px 14px;font-size:14px;line-height:1.65;color:var(--ink)}
.help5 .hb ul{margin:0;padding-inline-start:1.2em;display:grid;gap:4px}
.help5 .grp{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:4px 2px -4px}
.help5 .ver{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.help5 .ver button{margin-left:auto}
.news5{display:grid;gap:10px}
.news5 .vh{display:flex;align-items:baseline;gap:8px}
.news5 .vh b{font-family:var(--display);font-weight:500;font-size:18px}
.news5 ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.news5 li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.5}
.news5 li span{font-size:20px}
/* สลิปแบบแอปธนาคาร */
.eslip{display:grid;gap:0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.eslip .es-h{display:flex;align-items:center;gap:10px;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#0f7a69,#08483f)}
.eslip .es-h .g5-logo{width:34px;height:34px;font-size:18px}
.eslip .es-h b{font-family:var(--display);font-weight:500}
.eslip .es-h small{display:block;opacity:.8;font-size:12px}
.eslip .es-ok{display:grid;justify-items:center;gap:6px;padding:18px 16px 8px;text-align:center}
.eslip .es-ok i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:28px;color:#fff;background:var(--ok);box-shadow:0 0 0 8px color-mix(in srgb,var(--ok) 16%,transparent)}
.eslip .es-ok i.wait{background:var(--gold)}
.eslip .es-ok i.out{background:#4a6cd4;box-shadow:0 0 0 8px color-mix(in srgb,#4a6cd4 16%,transparent)}
.eslip .es-amt{font-family:var(--mono);font-size:32px;font-weight:500}
.eslip .es-ft{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 16px}
.eslip .es-p{display:grid;justify-items:center;gap:2px;text-align:center;font-size:13px;min-width:0}
.eslip .es-p span{font-size:26px}
.eslip .es-p b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eslip dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;padding:12px 16px 16px;border-top:1px dashed var(--line);font-size:13.5px}
.eslip dt{color:var(--muted)}.eslip dd{margin:0;text-align:right;font-weight:600}
@media (prefers-reduced-motion:reduce){.t5-av,.bk-turn{animation:none}}
.stack5{display:grid;gap:14px;align-content:start}
.stack5>*{min-width:0}
/* ---- แก้ล้นจอ / ปรับละเอียด ---- */
.g5-brand b,.bk-title,.bk-back{white-space:nowrap}
.g5-brand{flex:1 1 auto}
.bk-title{min-width:0;overflow:hidden;text-overflow:ellipsis}
.bk-hello>div{margin-right:auto;min-width:0}
.bk-hello .livebadge{flex:none}
.bk-head{width:100%;box-sizing:border-box}
.staff .bankseg{grid-template-columns:repeat(5,minmax(0,1fr))}
.staff .bankseg button{padding:9px 2px;font-size:12px;min-width:0}
.g5 .row{max-width:100%}
@media (max-width:420px){
  .g5-top .livebadge .rf,.tl-bar .livebadge .rf{display:none}
  .g5-brand b{font-size:15px}
}
@media (max-width:370px){.g5-top .livebadge span,.tl-bar .livebadge span{display:none}.g5-top .livebadge,.tl-bar .livebadge{padding:6px}}
@media (min-width:980px){.rates5{margin:0;padding-inline:0;flex-wrap:wrap;overflow:visible}}
.g5v.staff{margin:0;padding:0;background:none;min-height:100dvh}
.chips5{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.chips5::-webkit-scrollbar{display:none}
.chips5 button{flex:none;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.tl-bar,.tl-who,.tl-kpi{max-width:868px}

/* ==================================================================
   v5.1 — หน้าเข้าเกม / หน้าเล่นหน้าเดียว / แจ้งเตือน
   ================================================================== */
/* ---------- พื้นผ้าสักหลาดใช้ร่วม: หน้าเข้าเกม + ล็อบบี้ + หน้าเล่น ---------- */
body.g5-entry{padding:0;color:#eaf3ef;min-height:100dvh;
  background:radial-gradient(ellipse 120% 60% at 50% -10%,#1d6656 0%,transparent 60%),
    radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/14px 14px,
    linear-gradient(180deg,#0d3029,#081d19)}
html:has(body.g5-entry),html:has(body.g5-table){background:#081d19}

/* ---------- หน้าเข้าเกม ---------- */
.entry{min-height:100dvh;display:grid;align-content:start;gap:8px;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 40px;max-width:1080px;margin:0 auto}
.en-hero{position:relative;display:grid;justify-items:center;text-align:center;gap:6px;padding:10px 0 6px}
.en-coin{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:40px;color:#2a1a00;
  background:radial-gradient(circle at 35% 30%,#ffe9a0,#e0a526 60%,#a87308);box-shadow:0 0 0 5px rgba(243,198,77,.18),0 10px 30px rgba(0,0,0,.4);animation:coinspin 6s ease-in-out infinite}
@keyframes coinspin{0%,80%,100%{transform:rotateY(0)}88%{transform:rotateY(180deg)}}
.en-hero h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,9vw,54px);line-height:1.1;margin:4px 0 0;letter-spacing:-.01em}
.en-hero h1 span{color:#f3c64d}
.en-hero p{margin:0;color:#b9d3ca;font-size:14.5px}

   v5.2 — ธนาคารแบบจัดเต็ม: ตารางอัตรา · โต๊ะปรับดอกเบี้ย · ประกาศ · แดชบอร์ด
   ================================================================== */
/* สีชุดข้อมูลกราฟ (ผ่านตัวตรวจตาบอดสี: น้ำเงิน ส้ม เขียวน้ำทะเล เหลือง) */
:root{--vz1:#2a78d6;--vz2:#eb6834;--vz3:#1baf7a;--vz4:#eda100;--vz-neg:#e34948;--vz-grid:#e3e6e0;--vz-ax:#5d6d68;--vz-surf:var(--surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--vz1:#3987e5;--vz2:#d95926;--vz3:#199e70;--vz4:#c98500;--vz-neg:#e66767;--vz-grid:#2a3533;--vz-ax:#95a7a1}}
:root[data-theme="dark"]{--vz1:#3987e5;--vz2:#d95926;--vz3:#199e70;--vz4:#c98500;--vz-neg:#e66767;--vz-grid:#2a3533;--vz-ax:#95a7a1}
.up{color:var(--ok)}.dn{color:var(--danger)}.neg{color:var(--danger)}

/* ---------- ตารางอัตราแบบติดหน้าสาขา ---------- */
.rtab{display:grid;gap:10px;color:var(--ink)}
.rtab-h{display:grid;gap:1px}
.rtab-h b{font-family:var(--display);font-weight:500;font-size:16px}
.rtab-h small{color:var(--muted);font-size:12px}
.rx-g{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.rx-h{display:flex;align-items:center;gap:8px;width:100%;padding:8px 12px;font-weight:700;font-size:13.5px;background:var(--surface2);border:0;border-radius:0;text-align:left;color:var(--ink)}
.rx-h.edit .pen{margin-left:auto;font-weight:500;font-size:12px;color:var(--jade)}
.rx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}
.rx>span:first-child{display:grid;line-height:1.3}
.rx small{font-size:11.5px;color:var(--muted)}
.rx b{font-family:var(--mono);font-weight:500;font-size:15px;text-align:right}
.rx .rx-t{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.rx .rx-t:empty{display:none}
.rx-tiers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:8px 10px}
.rx-tiers span{display:grid;justify-items:center;gap:1px;padding:6px 2px;border-radius:10px;background:var(--surface2);min-width:0}
.rx-tiers i{font-style:normal;font-weight:700;font-size:12px;color:var(--c)}
.rx-tiers b{font-family:var(--mono);font-weight:500;font-size:14px}
.rt-ch,.rt-pend{font-style:normal;font-size:11px;font-weight:700;padding:0 6px;border-radius:999px;white-space:nowrap}
.rt-ch.up{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.rt-ch.dn{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.rt-pend{background:color-mix(in srgb,var(--gold) 18%,transparent);color:color-mix(in srgb,var(--gold) 70%,var(--ink))}
.pendbar{font-size:13px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line))}
.mood{font-size:11px;padding:0 6px;border-radius:999px;background:var(--surface2)}

/* ---------- โต๊ะปรับดอกเบี้ย ---------- */
.stepper label{display:grid;justify-items:center;min-width:74px;line-height:1.1;cursor:text}
.stepper .pol-in{width:74px;text-align:center;font-family:var(--mono);font-size:18px;font-weight:600;padding:4px 2px;border-radius:10px;background:var(--surface2);border:1px solid transparent}
.stepper .pol-in:focus{border-color:var(--jade);outline:0;background:var(--surface)}
.stepper .pol-in::-webkit-inner-spin-button{display:none}
.stepper label small{font-size:10.5px;color:var(--muted)}
.pol-row .was{color:var(--muted)}
.pol-row.ch .was{color:var(--ink)}
.g5 .pol-save{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.modal .pol-save{bottom:0}
.impact{display:grid;gap:6px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--vz1) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--vz1) 35%,var(--line))}
.impact>small{color:var(--muted);margin-top:-4px;font-size:12px}
.imp-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.imp-g span{display:grid;gap:1px;padding:6px 8px;border-radius:10px;background:var(--surface)}
.imp-g small{font-size:11px;color:var(--muted)}.imp-g b{font-family:var(--mono);font-weight:500;font-size:13.5px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.presets button{display:grid;grid-template-columns:auto 1fr;gap:0 8px;text-align:left;padding:10px 12px;border-radius:14px;align-items:center}
.presets button span{grid-row:span 2;font-size:22px}
.presets button small{font-size:11.5px;color:var(--muted);line-height:1.35}
.mode52 .seg{display:grid;grid-template-columns:1fr 1fr}
.mode52 .seg.mk{grid-template-columns:repeat(5,1fr)}
.dash-open,.tl-dash{display:grid;grid-template-columns:auto 1fr auto;gap:0 10px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px}
.dash-open span,.tl-dash span{grid-row:span 2;font-size:24px}
.dash-open small,.tl-dash small{font-size:12px;color:var(--muted)}
.dash-open i,.tl-dash i{grid-row:span 2;font-style:normal;font-size:20px;color:var(--muted)}
.dash-open{background:color-mix(in srgb,var(--vz1) 8%,var(--surface));border-color:color-mix(in srgb,var(--vz1) 40%,var(--line))}
.dash-open b,.tl-dash b,.dash-open small,.tl-dash small{grid-column:2}
.dash-open span,.tl-dash span{grid-column:1;grid-row:1/3}.dash-open i,.tl-dash i{grid-column:3;grid-row:1/3}
.tl-dash{max-width:868px;width:100%;margin:10px auto 0;display:grid;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff}
.tl-dash small,.tl-dash i{color:rgba(255,255,255,.75)}
@media (max-width:420px){.presets{grid-template-columns:1fr}}

/* ---------- ประกาศธนาคาร ---------- */
.ann{display:grid;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.ann-h{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;background:linear-gradient(135deg,#1d3a78,#0f1f45)}
.ann-h .g5-logo{width:32px;height:32px;font-size:17px;flex:none}
.ann-h>div{flex:1;min-width:0;display:grid;line-height:1.3}
.ann-h b{font-family:var(--display);font-weight:500;font-size:14.5px}
.ann-h small{font-size:11.5px;opacity:.8}
.ann-cat{flex:none;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.16);white-space:nowrap}
.ann.c-rate .ann-h{background:linear-gradient(135deg,#0f7a69,#08483f)}
.ann.c-warn .ann-h,.ann.c-urgent .ann-h{background:linear-gradient(135deg,#a3341f,#6e1c12)}
.ann.c-promo .ann-h,.ann.c-event .ann-h{background:linear-gradient(135deg,#a8770a,#6b4a04)}
.ann.hi{box-shadow:0 0 0 2px var(--danger)}
.ann-b{display:grid;gap:10px;padding:12px 14px 14px}
.ann-b h3{font-size:17px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ann-pri{font-family:var(--body);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--danger);color:#fff}
.ann-b p{margin:0;font-size:14.5px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.ann-t{width:100%;border-collapse:collapse;font-size:13px}
.ann-t th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.ann-t td{padding:6px;border-bottom:1px dashed var(--line)}
.ann-t .r{text-align:right}
.ann-kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin:0;font-size:13px}
.ann-kv dt{color:var(--ink)}.ann-kv dd{margin:0;text-align:right;font-weight:600}
.ann-eff{font-size:13.5px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 14%,var(--surface))}
.ann-note{display:grid;gap:2px;font-size:13.5px;padding:8px 10px;border-left:3px solid var(--jade);background:var(--surface2);border-radius:0 10px 10px 0}
.ann-note small{color:var(--muted);font-size:11.5px}
.ann .rtab{margin-top:2px}
.annlist{display:grid;gap:8px;color:var(--ink)}
.annrow{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.annrow.hi{border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}
.annrow summary{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;list-style:none}
.annrow summary::-webkit-details-marker{display:none}
.annrow summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:18px;transition:transform .2s}
.annrow[open] summary::after{transform:rotate(90deg)}
.ar-ic{font-size:22px;flex:none}
.ar-t{display:grid;min-width:0;line-height:1.3}
.ar-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-t small{font-size:11.5px;color:var(--muted)}
.annrow .ann{border:0;border-top:1px solid var(--line);border-radius:0}
.annrow .ann-h{display:none}
.ann-pop{width:min(100%,440px);max-height:min(88dvh,760px);overflow:auto;display:grid}
.ann-pop .ann{border:0;border-radius:0}
.ann-pop .ann-h{padding:16px}
.ann-pop .ann-b h3{font-size:20px}
.ann-pop .ft{padding:0 14px 14px}
.ann-pop.dun{box-shadow:0 0 0 3px var(--danger),0 30px 80px rgba(0,0,0,.5)}
.tpl,.catpick{display:flex;gap:6px;flex-wrap:wrap}
.catpick [aria-pressed="true"],.tpl button:active{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55em .75em;width:100%;resize:vertical;box-sizing:border-box}
.table .annlist summary{color:var(--ink)}

/* ---------- แดชบอร์ด ---------- */
.dash .tl-head{padding-bottom:0}
.dk-back{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;flex:none}
.tape{max-width:1120px;margin:12px auto 0;overflow:hidden;border-top:1px solid rgba(255,255,255,.14);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tape-in{display:flex;gap:26px;width:max-content;padding:8px 0;font-family:var(--mono);font-size:12.5px;color:#dfe8ff;animation:tape 38s linear infinite}
.tape-in span{white-space:nowrap}
@keyframes tape{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tape-in{animation:none;flex-wrap:wrap;width:auto;gap:6px 18px}}
.dash .g5-main.dash-main{max-width:1200px}
.dash .tl-bar{max-width:1200px}
.dfilter{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dfilter [aria-pressed="true"]{background:var(--s1,#1d3a78);border-color:var(--s1,#1d3a78);color:#fff}
.hero5{display:grid;grid-template-columns:1fr;gap:12px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink)}
.hero5>div:first-child{display:grid;gap:2px}
.hero5 small{color:var(--muted);font-size:12.5px}
.hero5>div>b{font-family:var(--body);font-weight:600;font-size:clamp(36px,9vw,52px);line-height:1.05;letter-spacing:-.01em}
.dl{font-size:12.5px;font-weight:600;color:var(--muted)}
.dl small{font-weight:400;color:var(--muted)}
.dl.good{color:var(--ok)}.dl.bad{color:var(--danger)}
.hero-est{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start}
.hero-est small{grid-column:1/-1}
.hero-est span{display:grid;font-size:12px;color:var(--muted);padding:8px 10px;border-radius:12px;background:var(--surface2)}
.hero-est b{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--ink)}
@media (min-width:760px){.hero5{grid-template-columns:1.2fr 1fr;align-items:center}}
.tiles5{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.tiles5{grid-template-columns:repeat(4,minmax(0,1fr))}}
.st5{display:grid;gap:2px;align-content:start;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);min-width:0;position:relative}
.st5>small{font-size:12px;color:var(--muted)}
.st5>b{font-family:var(--body);font-weight:600;font-size:22px;line-height:1.2}
.st5 em{font-style:normal;font-size:11.5px;color:var(--muted);line-height:1.35}
.st5 .spk{margin-top:2px}
.spk polyline{fill:none;stroke:var(--vz-ax);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;opacity:.7}
.spk circle{fill:var(--vz1)}
.dgrid{display:grid;gap:14px}
@media (min-width:980px){.dgrid{grid-template-columns:1fr 1fr}}
.card5{display:grid;gap:8px;align-content:start;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);min-width:0}
.card5 h3{font-size:16px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.card5 h3 small{font-family:var(--body);font-size:12px;color:var(--muted)}
/* กราฟ */
.vz-box{overflow:hidden}
.vz{display:block;max-width:100%;height:auto;touch-action:pan-y}
.vz text{font-family:var(--body)}
.vz-grid{stroke:var(--vz-grid);stroke-width:1}
.vz-grid.zero{stroke:var(--vz-ax);opacity:.5}
.vz-ax{fill:var(--vz-ax);font-size:10.5px}
.vz-end{fill:var(--ink);font-size:11px;font-weight:600}
.vz-lead{stroke:var(--vz-ax);stroke-width:1}
.vz-l{fill:none;stroke:var(--c);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.vz-dot{fill:var(--c);stroke:var(--surface);stroke-width:2}
.vz-b{fill:var(--vz1)}.vz-b.neg{fill:var(--vz-neg)}
.vz-hit{fill:transparent;cursor:crosshair}
.vz-hit:hover{fill:color-mix(in srgb,var(--vz-ax) 6%,transparent)}
.vz-cross{stroke:var(--vz-ax);stroke-width:1;pointer-events:none}
.vz-lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.vz-lg span{display:inline-flex;align-items:center;gap:6px}
.vz-lg i{display:inline-block;width:14px;height:2px;border-radius:2px;background:var(--c)}
.vz-lg i.bar{height:10px;width:10px;border-radius:3px}
.vz-tbl summary{font-size:12px;color:var(--muted);cursor:pointer}
.vz-tbl table{font-size:12.5px;margin-top:6px}
.vz-tbl .r{text-align:right}
#vz-tip{position:fixed;z-index:95;display:none;gap:3px;min-width:120px;max-width:240px;padding:8px 10px;border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.22);pointer-events:none;font-size:12.5px}
#vz-tip small{color:var(--muted);font-size:11.5px}
#vz-tip div{display:grid;grid-template-columns:12px auto 1fr;gap:6px;align-items:center}
#vz-tip i{width:12px;height:2px;border-radius:2px;background:var(--c)}
#vz-tip b{font-family:var(--mono);font-weight:600}
#vz-tip span{color:var(--muted)}
.mix{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.mix i{background:var(--c);min-width:3px;cursor:pointer}
.mix i.on,.sheet5 i.on{filter:brightness(1.12);outline:2px solid var(--ink);outline-offset:-2px}
.mix-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px}
.mix-l span{display:grid;grid-template-columns:10px 1fr auto auto;gap:6px;align-items:center}
.mix-l i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.mix-l b{font-family:var(--mono);font-weight:500}
.mix-l small{color:var(--muted);min-width:30px;text-align:right}
.mini-k{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-k span{display:grid;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.mini-k small{font-size:11.5px;color:var(--muted)}.mini-k b{font-family:var(--mono);font-weight:500}
.sheet5{display:grid;gap:6px}
.sh-r{display:grid;grid-template-columns:minmax(70px,120px) 1fr 64px;gap:8px;align-items:center;font-size:13px}
.sh-r.out{opacity:.5}
.sh-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-bar{display:flex;height:18px;border-left:0}
.sh-l{display:flex;justify-content:flex-end;border-right:1.5px solid var(--vz-ax)}
.sh-r2{display:flex;gap:2px;padding-left:2px}
.sh-bar i{display:block;height:100%;background:var(--c);min-width:2px;cursor:pointer}
.sh-l i{border-radius:4px 0 0 4px}
.sh-r2 i:last-child{border-radius:0 4px 4px 0}
.sh-v{text-align:right;font-family:var(--mono);font-weight:500;font-size:12.5px}
.crd5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.crd5 span{display:grid;justify-items:center;gap:1px;padding:8px 2px;border-radius:12px;background:var(--surface2);border-top:3px solid var(--c)}
.crd5 i{font-style:normal;font-weight:700;font-size:12.5px}
.crd5 b{font-size:22px;font-family:var(--body);font-weight:600}
.crd5 small{font-size:10.5px;color:var(--muted)}
table.book{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
table.book th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
table.book td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.book .r{text-align:right}
table.book tr.bad td{background:color-mix(in srgb,var(--danger) 7%,transparent)}
table.book tr.out td{opacity:.5}
details.pg>summary{display:flex;align-items:baseline;gap:8px;cursor:pointer;list-style:none;padding:6px 2px}
details.pg>summary::-webkit-details-marker{display:none}
details.pg>summary small{font-weight:400;font-size:12px;color:var(--muted)}
details.pg>summary::after{content:"›";margin-left:auto;color:var(--muted);font-size:18px;transition:transform .2s}
details.pg[open]>summary::after{transform:rotate(90deg)}
details.pg[open]{display:grid;gap:6px}
.modal .seg [aria-pressed="true"],.mode52 .seg [aria-pressed="true"]{background:var(--jade);color:var(--jade-ink);border-color:var(--jade)}
.ann-t td.up,.ann-t td.dn{color:var(--ink);font-weight:600}
/* แถบ "ประกาศ" ลอยเหนือแถบล่างเมื่อมีร่าง (sticky ใช้ไม่ได้เพราะ body ตั้ง overflow-x:hidden) */
.g5v .g5-main .pol-save.on{position:fixed;left:50%;transform:translateX(-50%);width:min(868px,calc(100% - 24px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:31;box-sizing:border-box}
.g5-main:has(.pol-save.on){padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}

/* v5.3 โฉนดทั้งหมด */
.dd-g{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.dd-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dd-list{display:grid;gap:6px;max-height:52vh;overflow:auto;margin:6px 0}
.dd-card{border:1px solid var(--line,#e3e6e0);border-radius:12px;background:var(--surface,#fff);padding:0 12px}
.dd-card summary{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;list-style:none;flex-wrap:wrap}.dd-card summary::-webkit-details-marker{display:none}
.dd-card summary small{margin-left:auto}
.dd-no{min-width:28px;height:28px;border-radius:8px;color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.dd-t{width:100%;border-collapse:collapse;margin:0 0 10px;font-size:14px}.dd-t td{padding:5px 0;border-top:1px solid var(--line,#e3e6e0)}.dd-t td.num{text-align:right;font-weight:600}

/* v5.3.2 ปุ่มเลือกแต้มเต๋า (กดง่าย บนมือถือ) */
.dice-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.die{font-size:22px;font-weight:700;padding:12px 0;border-radius:12px;border:2px solid var(--line,#d8ddd6);background:var(--surface,#fff);cursor:pointer}
.die.on{background:#2a78d6;color:#fff;border-color:#2a78d6}

/* v5.3.3 แอนิเมชันเดินหมาก */
.walk-ov{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(10,20,30,.55);transition:opacity .45s}
.walk-ov.out{opacity:0}
.walk-card{background:var(--surface,#fff);color:var(--ink,#1d2b26);border-radius:18px;padding:16px 14px;width:min(92vw,420px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.walk-title{font-weight:700;margin-bottom:10px;text-align:center}
.walk-track{position:relative;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.walk-track i{display:block;height:22px;border-radius:6px;background:var(--line,#e3e6e0);transition:background .15s,transform .15s}
.walk-track i.sp{background:#f3d37a}
.walk-track i.hot{background:#2a78d6;transform:scale(1.15)}
.walk-tok{position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--tc,#2a78d6);color:#fff;display:grid;place-items:center;font-size:12px;transition:transform .22s cubic-bezier(.3,1.4,.6,1);pointer-events:none;box-shadow:0 0 0 2px #fff}
.walk-land{min-height:26px;margin-top:12px;text-align:center;font-size:16px;animation:walkPop .4s ease-out}
@keyframes walkPop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}

/* v5.3.4 โหมด 3D */
body[data-fx="css"] .die,body[data-fx="board"] .die{transform-style:preserve-3d}
body[data-fx="css"] .die.tumble,body[data-fx="board"] .die.tumble{animation:dieTumble .75s cubic-bezier(.2,.7,.3,1)}
@keyframes dieTumble{0%{transform:perspective(300px) rotateX(0) rotateY(0)}50%{transform:perspective(300px) rotateX(360deg) rotateY(200deg) translateY(-10px)}100%{transform:perspective(300px) rotateX(720deg) rotateY(360deg)}}
body[data-fx="css"] .walk-card,body[data-fx="board"] .walk-card{transform:perspective(900px) rotateX(10deg);transition:transform .4s}
.walk-stage{min-height:60px}
.board3d-cv{display:block;margin:0 auto;border-radius:14px;touch-action:none;cursor:grab}
.fx-opt{display:grid;gap:2px;text-align:left;width:100%;margin:6px 0;padding:12px;border-radius:12px;border:2px solid var(--line,#d8ddd6);background:var(--surface,#fff);cursor:pointer}
.fx-opt.on{border-color:#2a78d6}.fx-opt small{color:var(--muted,#5d6d68)}

function debit(s, seat, amt, kind, note, to = null) { s.players[seat].bal -= amt; addTx(s, kind, seat, to, amt, note); }

const r2 = x => Math.round(x * 100) / 100;
// ส่วนต่างดอกกู้ของเครดิตระดับ c (ธนาคารตั้งเองได้ ไม่ตั้ง = ค่าเริ่มต้นของระดับนั้น)
const crAdj = (s, c) => { const v = s.settings['cr' + CREDIT[c].name]; return v == null ? CREDIT[c].adj : +v; };
// ดอกกู้ธนาคารของเครดิตระดับ c (สูตรเดียว ใช้ทั้งคิดเงินจริงและโชว์บนจอ)
function rateForCredit(s, c) {
  if (hasEffect(s, 'rate0')) return 0;
  const floor = s.settings.rateFloor == null ? 1 : +s.settings.rateFloor;
  let r = Math.max(floor, s.settings.rate + crAdj(s, c) + (s.marketMod || 0));
  if (hasEffect(s, 'rateX2')) r *= 2;
  if (hasEffect(s, 'rateHalf')) r = Math.max(floor, r / 2);
  return r2(r);
}
const bankRate = (s, seat) => rateForCredit(s, s.players[seat].credit);
const odRateOf = (s, seat) => r2(bankRate(s, seat) + (+s.settings.odAdd || 0));
const loanRate = (s, L) => r2((L.lender == null ? bankRate(s, L.borrower) : L.rate) + (L.overdue ? (s.settings.lateAdd == null ? 2 : +s.settings.lateAdd) : 0));
function bankCap(s, seat) { return roundUnit(s, s.settings.start * s.settings.capPct / 100 * CREDIT[s.players[seat].credit].cap); }
const bankDebt = (s, seat) => s.loans.filter(L => L.lender == null && L.borrower === seat && L.status === 'active').reduce((a, L) => a + L.balance, 0);
const debtOf = (s, seat) => s.loans.filter(L => L.borrower === seat && L.status === 'active').reduce((a, L) => a + L.balance, 0);
const lentOf = (s, seat) => s.loans.filter(L => L.lender === seat && L.status === 'active').reduce((a, L) => a + L.balance, 0);
function bumpCredit(s, seat, d) {
  const p = s.players[seat], old = p.credit;
  p.credit = Math.max(0, Math.min(CREDIT.length - 1, p.credit + d));
  if (p.credit !== old) log(s, `${d > 0 ? '📈' : '📉'} เครดิตของ ${p.name} ${d > 0 ? 'ขึ้น' : 'ลด'}เป็น ${CREDIT[p.credit].name}`);
}

// base = ราคาฐาน (อิงกระดาน 1,500) · vol = ความผันผวน · div = ปันผล %/รอบ · hedge = ทองคำ วิ่งสวนตลาด
const STOCKS = [
  { id: 'rail', icon: '🚆', name: 'รถไฟฟ้า', base: 60, vol: 'mid', div: 1 },
  { id: 'food', icon: '🍜', name: 'ก๋วยเตี๋ยวเรือ', base: 30, vol: 'low', div: 2 },
  { id: 'tech', icon: '📱', name: 'ไทยเทค', base: 80, vol: 'high', div: 0 },
  { id: 'gold', icon: '🪙', name: 'ทองคำ', base: 100, vol: 'low', div: 0, hedge: true },
];
const STOCK_BY_ID = Object.fromEntries(STOCKS.map(x => [x.id, x]));
const VOL = { low: [-6, -3, -1, 0, 1, 2, 3, 5], mid: [-12, -8, -4, -1, 1, 3, 6, 10, 14], high: [-25, -15, -8, -3, 2, 6, 12, 20, 30] };
const priceUnit = s => Math.max(1, unitOf(s) / 10);
const stockBase = (s, x) => { const u = priceUnit(s); return Math.max(u, Math.round(x.base * s.settings.start / 1500 / u) * u); };
const stockOn = s => !!s.settings.stocks && !!s.mkt;
const held = (p, id) => ((p.sh || {})[id] || [0, 0]);
const stockValue = (s, seat) => { const p = s.players[seat]; if (!s.mkt || !p.sh) return 0; return Object.entries(p.sh).reduce((a, [id, h]) => a + (s.mkt[id] ? s.mkt[id].p * h[0] : 0), 0); };
function initMarket(s) { s.mkt = {}; for (const x of STOCKS) { const p = stockBase(s, x); s.mkt[x.id] = { p, h: [p] }; } }
// ขยับราคาหุ้นตัวเดียว pct% (ใช้ทั้งตอนขึ้นรอบใหม่และอีเว้นท์) — มีพื้น 20% และเพดาน 6 เท่าของราคาฐาน กันพอร์ตพังหมดตัว
function stockMove(s, id, pct) {
  const m = s.mkt && s.mkt[id]; if (!m) return;
  const b = stockBase(s, STOCK_BY_ID[id]), u = priceUnit(s);
  m.p = Math.min(b * 6, Math.max(Math.max(u, Math.round(b * 0.2 / u) * u), Math.round(m.p * (1 + pct / 100) / u) * u));
}
const pushHist = m => { m.h.push(m.p); if (m.h.length > 10) m.h.shift(); };
// ---------- ฝากประจำ / จำนอง ----------
const depValue = (s, seat) => (s.deps || []).filter(d => d.seat === seat).reduce((a, d) => a + d.val, 0);
const mortOf = (s, seat) => (s.morts || []).filter(m => m.seat === seat).reduce((a, m) => a + m.bal, 0);
const depRateFor = (s, rounds) => r2((s.settings.depRate || 0) + (rounds >= 6 ? +(s.settings.dep6Add ?? 2) : rounds >= 4 ? +(s.settings.dep4Add ?? 1) : 0));
const stat = p => (p.st = p.st || {});
// สถิติธนาคาร: int ดอกเบี้ยรับ · tax ภาษี · fee ค่าธรรมเนียม · auc ขายประมูล · out ดอกเบี้ย/ปันผลที่จ่ายออก
const bst = (s, k, v) => { s.bst = s.bst || {}; s.bst[k] = (s.bst[k] || 0) + v; };
const minBalOf = s => Math.round(s.settings.start * (s.settings.minBalPct || 0) / 100);

// ---------- ความมั่งคั่งสุทธิ (ใช้จัดอันดับ) ----------
// = ยอดบัญชี + เงินสดกระดาษที่แจ้ง + มูลค่าทรัพย์สินที่แจ้ง + หุ้น + ฝากประจำ + เงินที่คนอื่นติดเรา − หนี้ − หนี้จำนอง
function netWorth(s, seat) {
  const p = s.players[seat];
  return p.bal + (p.cash || 0) + (p.assets || 0) + stockValue(s, seat) + depValue(s, seat) + lentOf(s, seat) - debtOf(s, seat) - mortOf(s, seat);
}
function gameStats(s, seat) {
  const mine = s.loans.filter(L => L.borrower === seat && ['active', 'paid', 'forgiven'].includes(L.status));
  const sent = s.tx.filter(t => t.f === seat && t.t != null && t.k === 'transfer').reduce((a, t) => a + t.a, 0);
  const got = s.tx.filter(t => t.t === seat && t.k === 'transfer').reduce((a, t) => a + t.a, 0);
  const lent = s.loans.filter(L => L.lender === seat && ['active', 'paid', 'forgiven'].includes(L.status)).reduce((a, L) => a + L.principal, 0);
  return { borrowed: mine.reduce((a, L) => a + L.principal, 0), interest: mine.reduce((a, L) => a + L.interest, 0), sent, got, lent };
}
