        <div class="row" style="flex-wrap:nowrap"><span style="flex:1;min-width:0">${pn(i)}${p.out ? ' <span class="badge bad">ออก</span>' : ''}</span><b class="num" style="${p.bal < 0 ? 'color:var(--danger)' : ''}">${baht(p.bal)}</b></div>
        <div class="row" style="gap:6px"><input type="number" inputmode="numeric" data-adj="${i}" placeholder="± ปรับยอด" aria-label="ปรับยอดบัญชี ${esc(p.name)}" style="width:118px;padding:.35em .6em"><button class="sm" data-adj-go="${i}">ปรับ</button>
          <select data-credit="${i}" aria-label="เครดิต ${esc(p.name)}" style="width:auto;padding:.35em .5em">${CREDIT.map((c, ci) => `<option value="${ci}" ${p.credit === ci ? 'selected' : ''}>เครดิต ${c.name}</option>`).join('')}</select>
          <button class="sm ${p.out ? '' : 'danger'}" data-out="${i}" style="margin-left:auto">${p.out ? 'กลับเข้าเกม' : 'ล้มละลาย'}</button></div></div>`; }).join('')}
      </div>
      <div class="muted" style="font-size:12.5px">ปรับยอด: ใส่ตัวเลขบวกเพื่อเติม ลบเพื่อหัก (เช่น แก้ยอดที่กดผิด)</div>`;
  }
  html += `<details class="panel" style="padding:12px 14px"><summary><b>กติกาเสริม</b></summary><div class="stack" style="margin-top:10px">${settingsFields(s.settings, false, 'ap')}<button id="ap-save-settings">บันทึกการตั้งค่า</button></div></details>`;
  if (playing) {
    // ---- อีเว้นท์ที่แอดมินสร้างเอง ----
    const custom = s.customEvents || [];
    html += `<div class="section-h"><h2>สร้างอีเว้นท์เอง</h2></div>
    <div class="panel stack" style="padding:12px 14px">
      <div class="tokpick" role="group" aria-label="ไอคอน">${EV_ICONS.map((ic, k) => `<button type="button" data-evic="${ic}" aria-pressed="${k === 0}">${ic}</button>`).join('')}</div>
      <div class="field"><label for="ce-title">ชื่ออีเว้นท์</label><input id="ce-title" maxlength="30" placeholder="เช่น ปาร์ตี้หลังเลิกเรียน"></div>
      <div class="field"><label for="ce-text">ข้อความบนการ์ด</label><input id="ce-text" maxlength="160" placeholder="เช่น {ชื่อ} ต้องเลี้ยงชาไข่มุกทุกคน"><small>ใช้ {ชื่อ} แทนชื่อคนที่โดน และ {เงิน} แทนจำนวนเงิน</small></div>
      <div class="grid2">
        <div class="field"><label for="ce-target">ใครโดน</label><select id="ce-target"><option value="random">สุ่ม 1 คน</option><option value="all">ทุกคน</option><option value="seat">เลือกผู้เล่น</option><option value="none">ไม่มีเงินเกี่ยวข้อง</option></select></div>
        <div class="field"><label for="ce-seat">ผู้เล่น (ถ้าเลือกเอง)</label><select id="ce-seat">${s.order.map(i => `<option value="${i}">${esc(P(i).name)}</option>`).join('')}</select></div>
        <div class="field"><label for="ce-amt">เงิน (+ รับ / − จ่าย)</label><input id="ce-amt" type="number" inputmode="numeric" placeholder="เช่น -500"></div>
        <label class="check" for="ce-deck" style="align-self:end"><input type="checkbox" id="ce-deck"><span><b>ใส่ในสำรับสุ่ม</b><small>ให้โผล่มาเองตอนสุ่มอีเว้นท์</small></span></label>
      </div>
      <div class="row"><button class="primary" id="ce-now">เรียกเลยตอนนี้</button><button id="ce-save">บันทึกไว้ใช้ทีหลัง</button></div>
      ${custom.length ? `<div class="label" style="margin-top:6px">อีเว้นท์ที่สร้างไว้</div>${custom.map(c => `<div class="row cev" style="flex-wrap:nowrap"><span style="font-size:20px">${c.icon}</span><span style="flex:1;min-width:0"><b>${esc(c.title)}</b>${c.inDeck ? ' <span class="badge">อยู่ในสำรับ</span>' : ''}<br><small class="muted">${esc(c.text || '')}${c.amount ? ` · ${c.amount > 0 ? '+' : '−'}${fmt(Math.abs(c.amount))}` : ''}</small></span>
        <button class="sm" data-cev-fire="${c.id}">เรียก</button><button class="sm danger" data-cev-del="${c.id}" aria-label="ลบ">✕</button></div>`).join('')}` : ''}
    </div>`;
    const loans = s.loans.filter(L => ['active', 'offer'].includes(L.status));
    html += `<div class="section-h"><h2>แก้ไขสัญญาเงินกู้</h2><span class="muted num">${loans.length}</span></div>`;
    html += loans.length ? loans.map(L => `<div class="loan" data-loan="${L.id}">
        <div class="l1"><b>${pn(L.borrower)} ${L.status === 'offer' ? '(ข้อเสนอ) ' : ''}· ${L.lender == null ? '🏦 ธนาคาร' : 'จาก ' + esc(P(L.lender).name)}</b></div>
        <div class="grid2">
          <div class="field"><label>ยอดคงเหลือ</label><input type="number" data-f="balance" value="${L.balance}"></div>
          <div class="field"><label>ดอกเบี้ย %/รอบ</label><input type="number" data-f="rate" value="${L.rate}"></div>
          <div class="field"><label>ครบกำหนดรอบที่</label><input type="number" data-f="dueRound" value="${L.dueRound || (s.round + (L.rounds || 0))}" ${L.status === 'offer' ? 'disabled' : ''}></div>
          <div class="field"><label>สถานะ</label><select data-f="status">${Object.entries(LOAN_STATUS_LABEL).map(([k, l]) => `<option value="${k}" ${L.status === k ? 'selected' : ''}>${l}</option>`).join('')}${L.status === 'offer' ? '<option value="offer" selected>รอตอบรับ</option>' : ''}</select></div>
        </div>
        <div class="row" style="justify-content:flex-end"><button class="sm primary" data-save-loan="${L.id}">บันทึก</button></div>
      </div>`).join('') : '<p class="empty">ไม่มีสัญญาที่เปิดอยู่</p>';
    html += `<div class="section-h"><h2>รอบและอีเว้นท์</h2></div>
    <div class="panel stack" style="padding:12px 14px">
      <div class="row" style="flex-wrap:nowrap">ตอนนี้รอบที่ <b class="num">${s.round}</b><input id="ap-round" type="number" value="${s.round}" style="max-width:90px;margin-left:auto"><button class="sm" id="ap-set-round">ตั้งรอบ</button></div>
      <div class="field"><label for="ap-event">เรียกอีเว้นท์ที่เลือกทันที</label><select id="ap-event">${EVENTS.map(e => `<option value="${e.id}">${e.icon} ${esc(e.title)}</option>`).join('')}${(s.customEvents || []).map(c => `<option value="${c.id}">${c.icon} ${esc(c.title)} (สร้างเอง)</option>`).join('')}</select></div>
      <button id="ap-force-event">เรียกอีเว้นท์นี้เลย</button>
    </div>
    <button class="danger" data-a="endGame">จบเกม</button>`;
  }
  return html;
}
function wireAdminPanel() {
  const bd = $('#modal-root .bd'); if (!bd) return;
  const on = (sel, fn) => { const el = $(sel, bd); if (el) el.onclick = fn; };
  on('#ap-copy-pin', () => copyText(S().pin));
  on('#ap-reset-pin', () => confirmBox('สร้างรหัส PIN ใหม่?', 'แอดมินคนอื่นที่เคยใส่รหัสเดิมจะหลุดสถานะ ต้องขอรหัสใหม่จากคุณ', 'สร้างใหม่', () => dispatch(null, { type: 'resetPin' })));
  on('#ap-copy-bankpin', () => copyText(S().bankPin));
  on('#ap-reset-bankpin', () => confirmBox('สร้างรหัส PIN แบงก์เกอร์ใหม่?', 'แบงก์เกอร์คนอื่นที่เคยใส่รหัสเดิมจะหลุดสถานะ ต้องขอรหัสใหม่จากคุณ', 'สร้างใหม่', () => dispatch(null, { type: 'resetBankPin' })));
  on('#ap-save-settings', async () => { if (await dispatch(null, { type: 'settings', settings: readSettings('ap') })) toast('บันทึกแล้ว'); });
  $$('[data-req-ok]', bd).forEach(b => b.onclick = () => dispatch(null, { type: 'resolveReq', id: +b.dataset.reqOk, ok: true }));
  $$('[data-req-no]', bd).forEach(b => b.onclick = () => dispatch(null, { type: 'resolveReq', id: +b.dataset.reqNo, ok: false }));
  $$('[data-adj-go]', bd).forEach(b => b.onclick = () => { const i = +b.dataset.adjGo, v = +$(`[data-adj="${i}"]`, bd).value; if (!v) return toast('ใส่จำนวนเงิน เช่น 500 หรือ -500'); dispatch(null, { type: 'adjustBalance', seat: i, delta: v }); });
  $$('[data-credit]', bd).forEach(sel => sel.onchange = () => dispatch(null, { type: 'adjustCredit', seat: +sel.dataset.credit, credit: +sel.value }));
  $$('[data-out]', bd).forEach(b => b.onclick = () => {
    const seat = +b.dataset.out;
    if (P(seat).out) return dispatch(null, { type: 'setOut', seat });
    confirmBox(`${P(seat).name} ล้มละลาย?`, 'ผู้เล่นจะถูกข้ามตา และข้อเสนอกู้/คำขอที่ค้างจะถูกยกเลิก (กดกลับเข้าเกมได้ภายหลัง)', 'ยืนยัน', () => dispatch(null, { type: 'setOut', seat }));
  });
  $$('[data-save-loan]', bd).forEach(b => b.onclick = () => {
    const id = +b.dataset.saveLoan, card = b.closest('[data-loan]');
    const val = f => card.querySelector(`[data-f="${f}"]`).value;
    dispatch(null, { type: 'editLoan', id, balance: +val('balance'), rate: +val('rate'), dueRound: +val('dueRound'), status: val('status') === 'offer' ? undefined : val('status') });
  });
  on('#ap-set-round', () => dispatch(null, { type: 'setRound', round: +$('#ap-round').value }));
  on('#ap-force-event', () => dispatch(null, { type: 'forceEvent', id: $('#ap-event').value }));
  // อีเว้นท์สร้างเอง
  $$('[data-evic]', bd).forEach(b => b.onclick = () => $$('[data-evic]', bd).forEach(x => x.setAttribute('aria-pressed', x === b)));
  const ce = now => {
    const icon = ($('[data-evic][aria-pressed="true"]', bd) || {}).dataset?.evic || '⭐';
    const act = { type: 'addCustomEvent', icon, title: $('#ce-title').value, text: $('#ce-text').value, target: $('#ce-target').value, seat: +$('#ce-seat').value,
      amount: +$('#ce-amt').value || 0, inDeck: $('#ce-deck').checked, now };
    if (!act.title.trim()) return toast('ใส่ชื่ออีเว้นท์ก่อน');
    dispatch(null, act).then(ok => { if (ok) toast(now ? 'เรียกอีเว้นท์แล้ว' : 'บันทึกอีเว้นท์แล้ว'); });
  };
  on('#ce-now', () => ce(true));
  on('#ce-save', () => ce(false));
  $$('[data-cev-fire]', bd).forEach(b => b.onclick = () => dispatch(null, { type: 'forceEvent', id: b.dataset.cevFire }));
  $$('[data-cev-del]', bd).forEach(b => b.onclick = () => dispatch(null, { type: 'deleteCustomEvent', id: b.dataset.cevDel }));
}
function refreshAdminPanel() {
  const bd = $('#modal-root .bd'); if (!bd) return;
  // เก็บค่าที่กำลังพิมพ์ในฟอร์มสร้างอีเว้นท์ไว้ ไม่ให้หายตอนข้อมูลอัปเดต
  const keep = ['ce-title', 'ce-text', 'ce-target', 'ce-seat', 'ce-amt'].map(id => [id, $('#' + id, bd)?.value]);
  const deck = $('#ce-deck', bd)?.checked, ic = $('[data-evic][aria-pressed="true"]', bd)?.dataset.evic;
  const open = $('details', bd)?.open, scroll = $('#modal-root .sheet')?.scrollTop;
  bd.innerHTML = adminPanelHtml(S());
  keep.forEach(([id, v]) => { const el = $('#' + id, bd); if (el && v != null) el.value = v; });
  if ($('#ce-deck', bd) && deck != null) $('#ce-deck', bd).checked = deck;
  if (ic) $$('[data-evic]', bd).forEach(x => x.setAttribute('aria-pressed', x.dataset.evic === ic));
  if (open && $('details', bd)) $('details', bd).open = true;
  if (scroll != null) $('#modal-root .sheet').scrollTop = scroll;
  wireAdminPanel();
}
function openAdminPanel() {
  if (!isAdmin()) return openAdminClaim();
  openModal('🛡️ แผงแอดมิน', adminPanelHtml(S()), refreshAdminPanel);
  wireAdminPanel();
}

// ---------- แบงก์เกอร์ (คนถือเงินสดธนาคาร ยืนยันฝาก/ถอน/รับเงินได้อย่างเดียว) ----------
function bankerPanelHtml(s) {
  const admin = isAdmin();
  const roleLine = App.mode === 'local' ? 'โหมดเครื่องเดียว: คนถือเครื่องคือแอดมิน+แบงก์เกอร์ ควบคุมได้ทุกอย่าง'
    : admin ? '🛡️ คุณเป็นแอดมิน (ทำหน้าที่แบงก์เกอร์ได้ด้วยอยู่แล้ว)' : '🏧 คุณอยู่ในโหมดแบงก์เกอร์ (ยืนยันฝาก/ถอน/รับเงินได้อย่างเดียว แก้ไขค่าอื่นในเกมไม่ได้)';
  let html = `<div class="muted" style="font-size:13.5px">${roleLine}</div>`;
  if (s.status !== 'playing') return html + '<p class="empty">เกมยังไม่เริ่ม ยังไม่มีคำขอฝาก/ถอน</p>';
  const reqs = s.reqs || [];
  html += `<div class="section-h"><h2>คำขอรอยืนยัน</h2>${reqs.length ? `<span class="count">${reqs.length}</span>` : ''}</div>`;
  html += reqs.length ? reqs.map(r => `<div class="loan offer"><div class="l1"><b>${pn(r.seat)} · ${REQ_KIND[r.kind]}</b><span class="amt">${fmt(r.amt)}</span></div>
      <div class="muted" style="font-size:13px">${r.kind === 'deposit' ? 'รับแบงก์จากผู้เล่นแล้วค่อยกดยืนยัน' : r.kind === 'withdraw' ? `ส่งแบงก์ให้ผู้เล่นแล้วค่อยกดยืนยัน (ยอดในบัญชี ${baht(P(r.seat).bal)})` : esc(r.note || 'ไม่ระบุเหตุผล')}</div>
      <div class="row"><button class="sm primary" data-req-ok="${r.id}">ยืนยัน</button><button class="sm danger" data-req-no="${r.id}">ปฏิเสธ</button></div></div>`).join('')
    : '<p class="empty">ยังไม่มีคำขอฝาก/ถอนรอยืนยัน</p>';
  return html;
}
function wireBankerPanel() {
  const bd = $('#modal-root .bd'); if (!bd) return;
  $$('[data-req-ok]', bd).forEach(b => b.onclick = () => dispatch(null, { type: 'resolveReq', id: +b.dataset.reqOk, ok: true }));
  $$('[data-req-no]', bd).forEach(b => b.onclick = () => dispatch(null, { type: 'resolveReq', id: +b.dataset.reqNo, ok: false }));
}
function refreshBankerPanel() {
  const bd = $('#modal-root .bd'); if (!bd) return;
  const scroll = $('#modal-root .sheet')?.scrollTop;
  bd.innerHTML = bankerPanelHtml(S());
  if (scroll != null) $('#modal-root .sheet').scrollTop = scroll;
  wireBankerPanel();
}
function openBankerPanel() {
  if (!isBanker()) return openBankerClaim();
  openModal('🏧 แผงแบงก์เกอร์', bankerPanelHtml(S()), refreshBankerPanel);
  wireBankerPanel();
}

// ---------- ปุ่มทั้งหมด ----------
document.addEventListener('pointerdown', unlockAudio, { once: true });
document.addEventListener('click', e => {
  if (e.target.closest('[data-evclose]') && (e.target.matches('[data-evclose]') || e.target.closest('button[data-evclose]'))) { $('#ev-root').innerHTML = ''; return; }
  if (e.target.matches('[data-backdrop]') || e.target.closest('[data-close]')) return closeModal();
  const tab = e.target.closest('[data-tab]'); if (tab) { App.tab = tab.dataset.tab; return render(); }
  const ac = e.target.closest('[data-actor]'); if (ac) { App.actor = +ac.dataset.actor; return render(); }
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const [a, x] = b.dataset.a.split(':'); const as = b.dataset.as != null ? +b.dataset.as : null; const s = S();
  const turnActor = canAct(s.turn) ? s.turn : null; // ถึงตาใคร กดในนามคนนั้น (หรือแอดมิน)
  switch (a) {
    case 'endTurn': return dispatch(turnActor, { type: 'endTurn' });
    case 'drawEvent': return dispatch(turnActor, { type: 'drawEvent' });
    case 'go': return dispatch(turnActor, { type: 'goSalary' }).then(ok => { if (ok) toast(`🏁 รับ ${fmt(goAmount(s))} เข้าบัญชี ${P(s.turn).name} แล้ว`); });
    case 'transfer': return openTransfer(as);
    case 'payBank': return openPayBank(as);
    case 'req': return openRequest(as, x);
    case 'cancelReq': return dispatch(as, { type: 'cancelReq', id: +x });
    case 'bankLoan': return openBankLoan(as);
    case 'offer': return openOffer(as);
    case 'accept': return dispatch(as, { type: 'acceptLoan', id: +x });
    case 'cancel': return dispatch(as, { type: 'cancelLoan', id: +x });
    case 'repayAcc': return openRepay(as, +x, 'account');
    case 'repayCash': return openRepay(as, +x, 'cash');
    case 'forgive': return confirmBox('ยกหนี้ให้?', 'ยอดที่เหลือทั้งหมดจะถูกลบ ผู้กู้ไม่ต้องจ่ายคืน', 'ยกหนี้', () => dispatch(as, { type: 'forgive', id: +x }));
    case 'declare': return dispatch(as, { type: 'declareWorth', cash: +$('#w-cash').value || 0, assets: +$('#w-assets').value || 0 }).then(ok => { if (ok) toast('บันทึกยอดแล้ว'); });
    case 'declareFor': return openDeclareFor(+x);
    case 'endGame': return confirmBox('จบเกม?', 'หลังจบเกมทุกคนจะนับเงินสดกับทรัพย์สินแล้วแจ้งในแอปเพื่อจัดอันดับ ทำรายการเงินเพิ่มไม่ได้แล้ว', 'จบเกม', () => dispatch(null, { type: 'endGame' }));
    case 'admin': return isAdmin() ? openAdminPanel() : openAdminClaim();
    case 'banker': return isBanker() ? openBankerPanel() : openBankerClaim();
    case 'invite': return openInvite();
    case 'copy': return copyText(inviteLink());
    case 'sound': App.sound = !App.sound; store('bb_sound', App.sound ? 'on' : 'off'); if (App.sound) { unlockAudio(); beep('ping'); buzz(60); } return render();
    case 'home': return confirmBox('ออกจากห้อง?', App.mode === 'online' ? 'กลับเข้ามาได้ด้วยรหัสห้องและชื่อเดิม' : 'ข้อมูลบนเครื่องนี้จะหายไป', 'ออก', leaveToHome);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#ev-root').innerHTML = ''; } });

// ---------- เริ่มต้น ----------
App.uid = getUid();
render();
(async () => { // รีเฟรชหน้าแล้วกลับเข้าห้องเดิม
  const code = new URLSearchParams(location.search).get('room');
  if (!code || !FIREBASE_CONFIG) return;
  try { await fb(); const snap = await FB.getDoc(roomRef(code.toUpperCase()));
    if (snap.exists()) { const st = JSON.parse(snap.data().data); if (st.players.some(p => p.uid === App.uid) || isBankerUid(st, App.uid)) enterRoom(code.toUpperCase()); } } catch (e) { console.warn(e); }
})();

</script>
