// ---------- ตรวจความเปลี่ยนแปลงแล้วแจ้งเตือน (แทนของเดิม: ครบขึ้น แต่รวบเป็นก้อน ไม่รัว) ----------
const REQ_TXT = { deposit: 'ฝากเงินสด', withdraw: 'ถอนเงินสด', claim: 'ขอรับเงิน', payBank: 'จ่ายธนาคาร', loan: 'ขอกู้', mortgage: 'ขอจำนอง' };
function notifyChanges(prev, s) {
  if (prev && App.mode === 'online') { // เรื่องคนถือธนาคาร แจ้งได้ทั้งตอนรอเริ่มและระหว่างเกม
    if ((isHostUser() || isAdmin()) && (s.bankWait || []).length > (prev.bankWait || []).length) { toast('🙋 มีคนขอถือธนาคาร — กดอนุญาตถ้าใช่คนที่คุณให้ PIN'); beep('ping'); buzz(120); }
    if (isBankerUid(s, App.uid) && !isBankerUid(prev, App.uid)) { toast('🏦 คุณคือคนถือธนาคารแล้ว — คำขอต่างๆ จะขึ้นที่เคาน์เตอร์บนหน้าเล่น'); beep('money'); }
    if ((prev.bankWait || []).includes(App.uid) && !(s.bankWait || []).includes(App.uid) && !isBankerUid(s, App.uid)) toast('🚫 เจ้าของห้องไม่อนุญาตให้ถือธนาคาร');
  }
  if (!prev || s.status !== 'playing' || prev.status !== 'playing') return;
  const online = App.mode === 'online', me = mySeat(), since = prev.nextTx || 1;
  // งานธนาคาร (ทั้งออนไลน์และเครื่องเดียว)
  if (isBanker() && online && (s.reqs || []).length > (prev.reqs || []).length) {
    const r = s.reqs[s.reqs.length - 1];
    toast(`🏧 ${P(r.seat).name} ${REQ_TXT[r.kind] || 'ส่งคำขอ'} ${fmt(r.amt)} — รอคุณยืนยันที่เคาน์เตอร์`); beep('ping'); buzz(80);
  }
  if (s.auction && s.auction.open && (!prev.auction || prev.auction.n !== s.auction.n)) toast(`🔨 เปิดประมูล "${s.auction.name}" — เริ่ม ${fmt(s.auction.base)} เสนอราคาได้เลย`, 'bank');
  if (!online || me < 0) return;
  const p = P(me), pp = prev.players[me] || {};
  // ถึงตา / ตาหน้าเป็นของเรา
  if (prev.turn !== s.turn && s.turn === me) { toast('🎲 ถึงตาคุณแล้ว! — ทอยเต๋า เดิน แล้วกดจบตา'); beep('turn'); buzz([200, 100, 200]); flashTitle('🎲 ถึงตาคุณ!'); turnFlash(p.name); }
  else if (prev.turn !== s.turn && nextSeat(s) === me) toast('⏭️ ตาหน้าเป็นของคุณ — เตรียมทอยเต๋าได้เลย', 'info');
  // เงินเข้า: รวบหลายรายการเป็นก้อนเดียว
  const fresh = s.tx.filter(t => t.id >= since && t.t === me && t.f !== me && ['transfer', 'loan', 'repay', 'event', 'claim', 'deposit', 'admin', 'go', 'auction'].includes(t.k));
  if (fresh.length) {
    const sum = fresh.reduce((a, t) => a + t.a, 0), go = fresh.find(t => t.k === 'go'), t = fresh[fresh.length - 1];
    if (go && fresh.length === 1) toast(`🏁 ได้เงินเดือน +${fmt(go.a)} — ผ่านจุดเริ่มต้น เงินเข้าบัญชีแล้ว`);
    else if (fresh.length === 1) toast(`💰 ได้รับ ${fmt(t.a)} จาก${t.f == null ? 'ธนาคาร' : ' ' + P(t.f).name}${t.n ? ` — ${t.n}` : ''}`);
    else toast(`💰 เงินเข้า ${fresh.length} รายการ +${fmt(sum)} — แตะ 🔔 หรือดูในแอปธนาคาร`);
    beep('money'); buzz(120);
    if (go || sum >= (s.settings.goSalary || 2000)) burst('coin');
  }
  const cut = s.tx.filter(t => t.id >= since && t.f === me && t.k === 'bankerCut');
  if (cut.length) { toast(`✂️ ธนาคารตัดเงินคุณ ${fmt(cut.reduce((a, t) => a + t.a, 0))}${cut[0].n ? ` — ${cut[0].n}` : ''}`); beep('alarm'); buzz([80, 60, 80]); }
  const tax = s.tx.filter(t => t.id >= since && t.f === me && t.k === 'tax');
  if (tax.length) { toast(`🧾 ธนาคารเก็บภาษีความมั่งคั่ง ${fmt(tax[0].a)}`); beep('tax'); }
  const dep = s.tx.filter(t => t.id >= since && t.t === me && t.k === 'depOut' && /ครบกำหนด/.test(t.n));
  if (dep.length) { toast(`🐷 ฝากประจำครบกำหนด +${fmt(dep[0].a)} — เงินเข้าบัญชีแล้ว`); beep('money'); }
  // คำขอที่เราส่งไป ถูกจัดการแล้ว
  const mineBefore = (prev.reqs || []).filter(r => r.seat === me), gone = mineBefore.filter(r => !s.reqs.some(x => x.id === r.id));
  if (gone.length && !fresh.length) toast(`✅ ธนาคารจัดการคำขอแล้ว — ${REQ_TXT[gone[0].kind] || ''} ${fmt(gone[0].amt)}`);
  // สินเชื่อ / เครดิต
  const offers = s.loans.filter(L => L.status === 'offer' && L.borrower === me && !prev.loans.some(x => x.id === L.id));
  if (offers.length) { toast(`✉️ ${P(offers[0].lender).name} เสนอให้คุณกู้ ${fmt(offers[0].principal)} — กดรับได้ที่หน้าเล่น`); beep('ping'); buzz(120); }
  const od = s.loans.find(L => L.borrower === me && L.status === 'active' && L.overdue && !(prev.loans.find(x => x.id === L.id) || {}).overdue);
  if (od) { toast(`🚨 หนี้กับ${od.lender == null ? 'ธนาคาร' : ' ' + P(od.lender).name} เลยกำหนดแล้ว — เครดิตลด รีบคืนนะ`); beep('alarm'); }
  if (pp.credit != null && p.credit !== pp.credit) toast(p.credit > pp.credit ? `⭐ เครดิตขึ้นเป็น ${CREDIT[p.credit].name} — กู้ได้มากขึ้น ดอกถูกลง` : `📉 เครดิตลดเหลือ ${CREDIT[p.credit].name}`);
  // ความสำเร็จ
  const newAch = (p.ach || []).filter(id => !(pp.ach || []).includes(id));
  if (newAch.length) { const a = ACH_BY_ID[newAch[0]]; toast(`🏅 ปลดล็อกความสำเร็จ: ${a.icon} ${a.name} — ${a.desc}`); beep('ach'); buzz([60, 40, 60]); burst('party'); }
}

// ==================================================================
// v5.2 — ธนาคารแบบจัดเต็ม
//   ① ตารางอัตราดอกเบี้ยแบบธนาคารจริง (ทุกคนเห็น) + ปรับละเอียดทีละ 0.25% (คนถือธนาคารเท่านั้น)
//   ② ประกาศธนาคารแบบมีเลขที่ฉบับ หมวด ความสำคัญ วันมีผล และตารางเก่า→ใหม่
//   ③ แดชบอร์ดธนาคาร: กราฟ + ตัวเลขทั้งเกม (เฉพาะคนถือธนาคาร/แอดมิน)
// ทุกตัวเลขคิดจาก state เกมจริง ไม่มีค่าสมมติ
// ==================================================================

// ---------- ตัวช่วยจัดรูปตัวเลข ----------
const fmtR = x => (+x || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });          // 5.25
const pctS = x => `${fmtR(x)}%`;
// ย่อเลขใหญ่: 12,900 → 12.9K · 1,250,000 → 1.3M
const compact = n => { const a = Math.abs(n), sg = n < 0 ? '−' : '';
  return a >= 1e6 ? sg + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M' : a >= 1e4 ? sg + (a / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'K' : sg + fmt(Math.round(a)); };
const signed = (n, f = fmt) => `${n > 0 ? '+' : n < 0 ? '−' : '±'}${f(Math.abs(n))}`;
const arrow = d => d > 0 ? '▲' : d < 0 ? '▼' : '•';

// ==================================================================
// ① อัตราดอกเบี้ย
// ==================================================================
// การเปลี่ยนแปลงล่าสุดของค่านี้ (หาจากประกาศดอกเบี้ยย้อนหลัง)
function lastChange(s, k) {
  for (const a of s.anns || []) for (const r of a.rows || []) if (r[4] === k) return { o: r[1], n: r[2], r: a.r, no: a.no };
  return null;
}
// ป้ายเล็กๆ ข้างอัตรา: ▲0.25 (รอบ 7) / ⏳ → 5.5% รอบ 9
function rateTag(s, k) {
  const u = String((POLICY.find(p => p[0] === k) || [])[2] || '').startsWith('%') ? '%' : '';
  const pend = s.pendPol && s.pendPol.set[k] != null ? `<em class="rt-pend" title="ประกาศแล้ว รอมีผล">⏳ เป็น ${fmtR(s.pendPol.set[k])}${u} ตั้งแต่รอบ ${s.pendPol.r}</em>` : '';
  const c = lastChange(s, k);
  const ch = c && s.round - c.r <= 3 && c.n !== c.o ? `<em class="rt-ch ${c.n > c.o ? 'up' : 'dn'}">${arrow(c.n - c.o)}${fmtR(Math.abs(c.n - c.o))}</em>` : '';
  return ch + pend;
}
// ตารางอัตราแบบที่ธนาคารจริงติดหน้าสาขา — ใช้ทั้งแอปผู้เล่น โต๊ะเกม และเคาน์เตอร์
function rateTable(s, ed) {
  const st = s.settings, row = (label, val, k, sub) => `<div class="rx"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><b class="num">${val}</b><span class="rx-t">${k ? rateTag(s, k) : ''}</span></div>`;
  const grp = (g, title, body) => `<div class="rx-g">${ed ? `<button class="rx-h edit" data-a="polq:${g}">${title}<span class="pen">✏️ ปรับ</span></button>` : `<div class="rx-h">${title}</div>`}${body}</div>`;
  const taxNext = st.taxEvery > 0 ? s.round + (st.taxEvery - s.round % st.taxEvery || st.taxEvery) : null;
  const mm = s.marketMod || 0;
  return `<div class="rtab">
    <div class="rtab-h"><b>อัตราดอกเบี้ยและค่าธรรมเนียม</b><small>มีผล ณ รอบที่ ${s.round} · หน่วย %/รอบ${st.autoRate ? ` · <span class="mood ${mm > 0 ? 'up' : mm < 0 ? 'down' : 'flat'}">ตลาด ${mm > 0 ? '+' : ''}${mm}%</span>` : ' · ธนาคารคุมเอง'}</small></div>
    ${grp('save', '🐷 เงินฝาก', row('ออมทรัพย์', pctS(st.savRate), 'savRate', 'คิดจากยอดบวกในบัญชีทุกรอบ')
      + row('ฝากประจำ 2 รอบ', pctS(depRateFor(s, 2)), 'depRate') + row('ฝากประจำ 4 รอบ', pctS(depRateFor(s, 4)), 'dep4Add') + row('ฝากประจำ 6 รอบ', pctS(depRateFor(s, 6)), 'dep6Add')
      + row('ค่าปรับถอนก่อนกำหนด', pctS(st.depPen), 'depPen', 'ของเงินต้น · ไม่ได้ดอก'))}
    ${grp('loan', '💰 สินเชื่อ (เงินกู้ธนาคาร)', `<div class="rx-tiers">${CREDIT.map((c, k) => `<span><i style="--c:${c.color}">${c.name}</i><b class="num">${pctS(rateForCredit(s, k))}</b>${rateTag(s, 'cr' + c.name)}</span>`).join('')}</div>`
      + row('อัตราฐาน', pctS(st.rate), 'rate', 'เครดิตแต่ละระดับบวก/ลบจากตัวนี้') + row('ดอกเพิ่มเมื่อเลยกำหนด', '+' + pctS(st.lateAdd ?? 2), 'lateAdd')
      + row('เบิกเกินบัญชี (เครดิต B)', pctS(odShow(s)), 'odAdd', 'บัญชีติดลบโดนทุกรอบ')
      + row('วงเงินกู้ (เครดิต B)', fmt(roundUnit(s, st.start * st.capPct / 100)), 'capPct') + row('ค่าปรับค้างชำระ', pctS(st.penalty), 'penalty', 'ครั้งเดียวตอนเลยกำหนด'))}
    ${grp('mort', '📜 จำนองที่ดิน', row('วงเงินจำนอง', pctS(st.mortPct) + ' ของโฉนด', 'mortPct') + row('ดอกเบี้ยจำนอง', pctS(st.mortRate), 'mortRate') + row('ไถ่ถอนภายใน', `${st.mortDue} รอบ`, 'mortDue'))}
    ${grp('tax', '🧾 ภาษีและค่าธรรมเนียม', row('ภาษีความมั่งคั่ง', taxNext ? `${pctS(st.taxRate)} · เก็บรอบ ${taxNext}` : 'ไม่เก็บ', 'taxRate', taxNext ? `ทุก ${st.taxEvery} รอบ · ยกเว้น ${fmt(roundUnit(s, st.start * st.taxFree / 100))}` : '')
      + (stockOn(s) ? row('ค่าธรรมเนียมซื้อขายหุ้น', pctS(st.stockFee), 'stockFee') : ''))}
  </div>`;
}
// ดอกเบิกเกินบัญชีที่จะโชว์ (ไม่มีคนเครดิต B ก็คิดจากสูตร)
function odShow(s) { return r2(rateForCredit(s, 2) + (+s.settings.odAdd || 0)); }

// กระดาน "ธนาคารวันนี้" (ทับของเดิม) — ตารางอัตรา + ข่าว + สถานะลูกหนี้
function bankBoard(s, ro) {
  const act = s.players.map((_, i) => i).filter(i => !P(i).out), rows = debtorRows(s), ed = isBanker() && !ro;
  const x = bankSnap(s);
  return `<section class="panel stack board">
    <div class="bd-h"><b>🏦 ธนาคารวันนี้</b><span class="live-dot">สด · รอบ ${s.round}</span></div>
    ${s.pendPol ? `<div class="pendbar">⏳ ประกาศฉบับที่ ${s.pendPol.no} — อัตราใหม่มีผลรอบที่ ${s.pendPol.r}</div>` : ''}
    ${rateTable(s, ed)}
    ${ed ? '<div class="row" style="gap:6px"><button class="sm" data-a="bseg:rates" data-go="counter">🏛️ โต๊ะปรับดอกเบี้ย</button><button class="sm" data-a="annq">📢 เขียนประกาศ</button><button class="sm" data-view="dash">📊 แดชบอร์ด</button></div>' : ''}
    ${stockOn(s) ? `<div class="tick">${STOCKS.map(z => { const m = s.mkt[z.id], pv = m.h.length > 1 ? m.h[m.h.length - 2] : m.p, ch = (m.p - pv) / pv * 100;
      return `<span>${z.icon} <b class="num">${fmt(m.p)}</b> <i class="num ${ch > 0 ? 'u' : ch < 0 ? 'd' : ''}">${pctTxt(ch)}</i></span>`; }).join('')}</div>` : ''}
    <div class="kpis"><span><small>เงินฝากทั้งระบบ</small><b class="num">${baht(x.dep)}</b></span><span><small>สินเชื่อคงค้าง</small><b class="num">${fmt(x.cred)}</b></span>
      ${s.bankBudget != null ? `<span><small>งบกลางธนาคาร</small><b class="num" style="${s.bankBudget <= 0 ? 'color:var(--danger)' : ''}">${baht(s.bankBudget)}</b></span>` : ''}</div>
    <div class="sub-h">สถานะลูกหนี้</div>
    ${rows.length ? `<div class="debtors">${rows.map(d => `<div class="dr ${d.st[0]}">${tokHtml(d.i)}<span class="dr-n"><b>${esc(P(d.i).name)}</b><small>${d.st[1]} ${d.st[2]}${isFinite(d.next) ? ` · ครบรอบ ${d.next}` : ''}${P(d.i).bal < 0 ? ' · บัญชีติดลบ' : ''}</small></span>
      <span class="dr-a"><b class="num">${fmt(d.debt + d.mort)}</b><small>${d.mort ? `จำนอง ${fmt(d.mort)}` : ''}</small></span>${creditHtml(d.i)}</div>`).join('')}</div>`
      : '<p class="empty" style="padding:0">ไม่มีใครเป็นหนี้ธนาคาร 🎉</p>'}
  </section>`;
}

// ---------- ประมาณการกระแสดอกเบี้ยต่อรอบ (ใช้เทียบ "ก่อน/หลัง" ปรับนโยบาย) ----------
function estFlows(s, over) {
  const sx = over ? { ...s, settings: { ...s.settings, ...over } } : s, st = sx.settings, act = s.players.map((_, i) => i).filter(i => !P(i).out);
  const loanInt = s.loans.filter(L => L.lender == null && L.status === 'active').reduce((a, L) => a + L.balance * loanRate(sx, L) / 100, 0);
  const mortInt = (s.morts || []).reduce((a, m) => a + m.bal * (+st.mortRate || 0) / 100, 0);
  const odInt = act.reduce((a, i) => a + Math.max(0, -P(i).bal) * odRateOf(sx, i) / 100, 0);
  const savOut = act.reduce((a, i) => a + Math.max(0, P(i).bal) * (+st.savRate || 0) / 100, 0);
  const fdOut = (s.deps || []).reduce((a, d) => a + d.val * d.rate / 100, 0); // ฝากประจำเดิมล็อกดอกไว้ตอนเปิดบัญชี
  const inn = loanInt + mortInt + odInt, out = savOut + fdOut;
  return { loanInt, mortInt, odInt, savOut, fdOut, inn, out, net: inn - out };
}

// ลำดับแสดงในแต่ละหมวด (ตัวที่ใช้บ่อยอยู่บน)
const POL_ORDER = ['rate', 'rateFloor', 'lateAdd', 'odAdd', 'penalty', 'capPct', 'crAAA', 'crA', 'crB', 'crC', 'crD', 'savRate', 'depRate', 'dep4Add', 'dep6Add', 'depPen', 'mortPct', 'mortRate', 'mortDue', 'taxRate', 'taxEvery', 'taxFree', 'stockFee'];
// ---------- แผงปรับนโยบาย (ทับของเดิม): ทีละ 0.25% + พิมพ์ตัวเลขเองได้ ----------
function policyEditor(s, groups) {
  const draft = App.pol || {}, keys = Object.keys(draft).filter(k => draft[k] !== s.settings[k]), n = keys.length;
  const unitOf2 = u => u.replace(/ \(.*\)/, '').replace('% ของเงินเริ่มต้น', '%').replace('% ของราคาโฉนด', '%');
  // หมวดพับได้ (หน้าเคาน์เตอร์เปิดไว้แค่เงินกู้/เงินฝาก + หมวดที่มีร่างค้าง) · ในหน้าต่างปรับด่วนเปิดหมด
  App.pgOpen = App.pgOpen || { loan: 1, save: 1 };
  const isOpen = g => groups || App.pgOpen[g] || POLICY.some(p => POL_INFO[p[0]] && POL_INFO[p[0]][2] === g && draft[p[0]] != null);
  const rows = POL_GROUPS.filter(([g]) => !groups || groups.includes(g)).map(([g, gl]) => `<details class="pg" data-pg="${g}" ${isOpen(g) ? 'open' : ''}><summary class="pg-h">${gl}<small>${POLICY.filter(p => POL_INFO[p[0]] && POL_INFO[p[0]][2] === g).length} รายการ</small></summary>${POLICY.filter(p => POL_INFO[p[0]] && POL_INFO[p[0]][2] === g).sort((x, y) => POL_ORDER.indexOf(x[0]) - POL_ORDER.indexOf(y[0])).map(([k, label, unit, lo, hi]) => {
    const v = polVal(s, k), old = s.settings[k] ?? 0, ch = draft[k] != null && draft[k] !== old, step = POL_INFO[k][1];
    return `<div class="pol-row ${ch ? 'ch' : ''}"><div class="pr-t"><b>${label}</b><small>${POL_INFO[k][0]}</small></div>
      <div class="stepper"><button data-a="pstep:${k}:-1" ${v <= lo ? 'disabled' : ''} aria-label="ลด ${step}">−</button>
        <label class="num"><input class="pol-in" data-pk="${k}" type="number" inputmode="decimal" step="${step}" min="${lo}" max="${hi}" value="${v}" aria-label="${label}"><small>${unitOf2(unit)}</small></label>
        <button data-a="pstep:${k}:1" ${v >= hi ? 'disabled' : ''} aria-label="เพิ่ม ${step}">+</button></div>
      ${ch ? `<small class="was">เดิม ${fmtR(old)} → <b class="${v > old ? 'up' : 'dn'}">${arrow(v - old)} ${fmtR(Math.abs(v - old))}</b></small>` : ''}</div>`; }).join('')}</details>`).join('');
  let impact = '';
  if (n) {
    const a = estFlows(s), b = estFlows(s, draft), d = b.net - a.net;
    impact = `<div class="impact"><b>📐 ผลกระทบโดยประมาณต่อรอบ</b><small>จากยอดหนี้/เงินฝากที่มีตอนนี้</small>
      <div class="imp-g"><span><small>ดอกรับ</small><b class="num">${compact(a.inn)} → ${compact(b.inn)}</b></span><span><small>ดอกจ่าย</small><b class="num">${compact(a.out)} → ${compact(b.out)}</b></span>
      <span><small>สุทธิ/รอบ</small><b class="num ${d >= 0 ? 'up' : 'dn'}">${signed(Math.round(d))}</b></span></div></div>`;
  }
  return `<div class="stack">${rows}${impact}
    <div class="pol-save ${n ? 'on' : ''}">${n ? `<span>ร่างไว้ ${n} รายการ — ยังไม่มีผลจนกว่าจะออกประกาศ</span><button data-a="pcancel">ล้าง</button><button class="primary" data-a="psave">📣 ตรวจทาน & ประกาศ</button>` : '<span class="muted">กด − / + ทีละขั้น หรือแตะตัวเลขพิมพ์เอง แล้วกด "ประกาศ"</span>'}</div></div>`;
}
// พิมพ์ตัวเลขเอง: เก็บลงร่างทันที (ไม่วาดจอใหม่ระหว่างพิมพ์ กันตัวเลขหาย) วาดใหม่ตอนพิมพ์เสร็จ
document.addEventListener('input', e => {
  const el = e.target.closest && e.target.closest('.pol-in'); if (!el) return;
  const k = el.dataset.pk, P0 = POLICY.find(p => p[0] === k), v = parseFloat(el.value); if (!P0 || !Number.isFinite(v)) return;
  App.pol = App.pol || {}; App.pol[k] = Math.min(P0[4], Math.max(P0[3], Math.round(v * 100) / 100));
  if (App.pol[k] === S().settings[k]) delete App.pol[k];
});
document.addEventListener('change', e => { if (e.target.closest && e.target.closest('.pol-in')) setTimeout(() => { render(); refreshModal(); }, 0); }); // รอให้ blur จบก่อนค่อยวาดใหม่

// ชุดนโยบายสำเร็จรูป (ใส่ลงร่าง แล้วค่อยปรับต่อได้)
const POL_PRESETS = [
  ['🧊', 'ตึงตัว', 'ขึ้นดอกกู้ +0.5 · ฝาก +0.25 · กันคนกู้เยอะ', { rate: 0.5, savRate: 0.25, depRate: 0.25, mortRate: 0.25 }],
  ['🔥', 'กระตุ้นเศรษฐกิจ', 'ลดดอกกู้ −0.5 · ฝาก −0.25 · ให้เงินหมุน', { rate: -0.5, savRate: -0.25, depRate: -0.25, mortRate: -0.25 }],
  ['🐷', 'ชวนออม', 'ฝากประจำ +0.5 · ฝากยาวได้เพิ่ม', { depRate: 0.5, dep6Add: 0.25 }],
  ['⚖️', 'เข้มเครดิต', 'เครดิตแย่โดนเพิ่ม · เลยกำหนดโดนหนัก', { crC: 0.5, crD: 1, lateAdd: 0.5 }],
];
function presetApply(i) {
  const s = S(), d = POL_PRESETS[i][3]; App.pol = App.pol || {};
  for (const [k, dv] of Object.entries(d)) { const P0 = POLICY.find(p => p[0] === k); const v = Math.round((polVal(s, k) + dv) * 100) / 100; App.pol[k] = Math.min(P0[4], Math.max(P0[3], v)); if (App.pol[k] === s.settings[k]) delete App.pol[k]; }
  render(); refreshModal(); toast(`${POL_PRESETS[i][0]} ใส่ชุด "${POL_PRESETS[i][1]}" ลงร่างแล้ว — ตรวจแล้วกดประกาศ`);
}

// โหมดดอกเบี้ย: คนคุมเอง (ค่าเริ่มต้น) หรือ ขยับตามข่าวสุ่ม (ทับ marketSetter เดิม)

  return `<div class="panel stack mode52">
    <div class="row" style="flex-wrap:nowrap;gap:10px"><div style="flex:1;min-width:0"><b>🎛️ ใครเป็นคนเปลี่ยนดอกเบี้ย</b><small class="muted" style="display:block">${auto ? 'ตอนนี้: ขยับเองตามข่าวสุ่มทุกรอบ + มีการ์ดอีเว้นท์ดอกเบี้ย' : 'ตอนนี้: คนถือธนาคารเท่านั้น — ไม่มีอะไรเปลี่ยนเอง'}</small></div></div>
    <div class="seg"><button class="sm" data-a="autoRate:0" aria-pressed="${!auto}">🧑‍💼 ธนาคารคุมเอง</button><button class="sm" data-a="autoRate:1" aria-pressed="${auto}">🎲 ตามข่าวสุ่ม</button></div>

// โต๊ะปรับดอกเบี้ย (แท็บ "ดอกเบี้ย" ของเคาน์เตอร์)

// ตรวจทานก่อนประกาศ: เลือกมีผลทันที/รอบหน้า + เหตุผล + ความสำคัญ
function savePolicyDraft() {
  const s = S(), draft = App.pol || {};
  const ch = Object.entries(draft).filter(([k, v]) => v !== s.settings[k]).map(([k, v]) => { const p = POLICY.find(x => x[0] === k); return [p[1], s.settings[k] ?? 0, v, p[2], k]; });
  if (!ch.length) return toast('ยังไม่ได้แก้อะไร');
  const a = estFlows(s), b = estFlows(s, draft);
  openModal('📣 ตรวจทานก่อนประกาศ', `<div class="stack">
    ${annLetter({ no: (s.annNo || 0) + 1, r: s.round, cat: 'rate', icon: '🏛️', title: 'ธนาคารปรับนโยบายอัตรา', rows: ch, text: '' }, s, true)}
    <div class="field"><span class="label">มีผลเมื่อไหร่</span><div class="seg" id="pw"><button class="sm" data-w="now" aria-pressed="true">⚡ ทันที</button><button class="sm" data-w="next" aria-pressed="false">⏭️ รอบหน้า (รอบ ${s.round + 1})</button></div>
      <small class="muted">"รอบหน้า" = ให้ทุกคนมีเวลาเตรียมตัว (เช่น รีบกู้ก่อนดอกขึ้น) เหมือนธนาคารจริง</small></div>
    <div class="field"><label for="pn-note">เหตุผล / คำชี้แจง (ไม่บังคับ)</label><textarea id="pn-note" maxlength="200" rows="2" placeholder="เช่น หนี้เสียเยอะขึ้น ธนาคารจึงขึ้นดอกเบี้ยเพื่อลดความเสี่ยง"></textarea></div>
    <label class="check" for="pn-hi"><input type="checkbox" id="pn-hi"><span><b>ประกาศสำคัญ</b><small>เด้งแบบเด่นพร้อมเสียงเตือน</small></span></label>
    <small class="muted">ประมาณการต่อรอบ: ดอกรับ ${compact(a.inn)} → ${compact(b.inn)} · ดอกจ่าย ${compact(a.out)} → ${compact(b.out)}</small>
    <div class="row" style="justify-content:flex-end"><button data-close>กลับไปแก้</button><button class="primary" id="pn-go">📣 ออกประกาศ</button></div></div>`);
  let when = 'now';
  $$('#pw [data-w]').forEach(x => x.onclick = () => { when = x.dataset.w; $$('#pw [data-w]').forEach(y => y.setAttribute('aria-pressed', y === x)); });
  $('#pn-go').onclick = async () => {
    const ok = await dispatch(null, { type: 'bankPolicy', settings: draft, when, note: $('#pn-note').value, pri: $('#pn-hi').checked ? 'high' : 'normal' });
    if (ok) { App.pol = {}; closeModal(); toast(when === 'next' ? `📣 ประกาศแล้ว — มีผลรอบที่ ${s.round + 1}` : '📣 ประกาศแล้ว อัตราใหม่มีผลทันที'); render(); }
  };
}

const ANN_CAT = { gen: ['📢', 'ทั่วไป'], rate: ['🏛️', 'อัตราดอกเบี้ย'], warn: ['⚠️', 'แจ้งเตือน'], promo: ['🎁', 'โปรโมชั่น'], urgent: ['🚨', 'ด่วน'], event: ['🎉', 'กิจกรรม'] };
const ANN_TPL = [

  ['🎁 โปรฝากประจำ', 'promo', 'โปรโมชั่นเงินฝากประจำ', 'ฝากประจำ 6 รอบตอนนี้ได้ดอกเบี้ยสูงสุด ล็อกดอกไว้ตลอดสัญญา ไม่ต้องกลัวดอกลด'],
  ['🔨 ประมูลเร็วๆ นี้', 'event', 'ธนาคารจะเปิดประมูลที่ดิน', 'เตรียมเงินในบัญชีไว้ให้พร้อม ธนาคารจะเปิดประมูลโฉนดที่ยึดมาเร็วๆ นี้'],
  ['🧾 ภาษีรอบหน้า', 'warn', 'แจ้งกำหนดเก็บภาษี', 'ธนาคารจะเก็บภาษีความมั่งคั่งตามกำหนด กรุณาเตรียมเงินในบัญชีให้พอ'],
];
// เนื้อหาประกาศแบบจดหมายธนาคาร (ใช้ทั้งป๊อปอัพ บอร์ดประกาศ และหน้าตรวจทาน)
function annLetter(a, s, draft) {
  const [ic, cl] = ANN_CAT[a.cat] || ANN_CAT.gen;
  const pol = (a.rows || []).filter(r => r.length >= 4), kv = (a.rows || []).filter(r => r.length === 2), withRates = (a.rows || []).some(r => r[0] === '__rates__');
  const unitS = u => String(u || '').startsWith('%') ? '%' : '';
  return `<article class="ann ${a.pri === 'high' ? 'hi' : ''} c-${a.cat || 'gen'}">
    <header class="ann-h"><span class="g5-logo">฿</span><div><b>ประกาศ${BANK_NAME}</b><small>ฉบับที่ ${a.no}${draft ? ' (ร่าง)' : ''} · รอบที่ ${a.r}${a.at ? ' · ' + new Date(a.at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.' : ''}</small></div>
      <span class="ann-cat">${ic} ${cl}</span></header>
    <div class="ann-b">
      <h3>${a.pri === 'high' ? '<span class="ann-pri">สำคัญ</span>' : ''}${esc(a.title || '')}</h3>
      ${a.text ? `<p>${esc(a.text)}</p>` : ''}
      ${pol.length ? `<table class="ann-t"><thead><tr><th>รายการ</th><th class="r">เดิม</th><th class="r">ใหม่</th><th class="r">เปลี่ยน</th></tr></thead><tbody>
        ${pol.map(r => { const d = r[2] - r[1]; return `<tr><td>${esc(r[0])}</td><td class="r num">${fmtR(r[1])}${unitS(r[3])}</td><td class="r num"><b>${fmtR(r[2])}${unitS(r[3])}</b></td><td class="r num ${d > 0 ? 'up' : 'dn'}">${arrow(d)} ${fmtR(Math.abs(d))}</td></tr>`; }).join('')}</tbody></table>` : ''}
      ${kv.length ? `<dl class="ann-kv">${kv.map(r => `<dt>${esc(r[0])}</dt><dd class="num">${esc(r[1])}</dd>`).join('')}</dl>` : ''}
      ${withRates && s ? rateTable(s, false) : ''}
      ${a.eff != null ? `<div class="ann-eff">📅 มีผลตั้งแต่รอบที่ <b>${a.eff}</b>${s && a.eff > s.round ? ` <small>(อีก ${a.eff - s.round} รอบ)</small>` : ''}</div>` : ''}

    </div></article>`;
}
// บอร์ดประกาศย้อนหลัง (ฉบับใหม่อยู่บน แตะเพื่อกาง)
function annBoard(s, limit) {
  const list = (s.anns || []).slice(0, limit || 30);
  if (!list.length) return '<div class="emptybig">📭<b>ยังไม่มีประกาศ</b><small>ประกาศจากธนาคารทุกฉบับจะเก็บไว้ที่นี่</small></div>';
  return `<div class="annlist">${list.map((a, k) => { const [ic, cl] = ANN_CAT[a.cat] || ANN_CAT.gen;
    return `<details class="annrow ${a.pri === 'high' ? 'hi' : ''}" ${k === 0 && s.round - a.r <= 1 ? 'open' : ''}><summary><span class="ar-ic">${a.icon || ic}</span><span class="ar-t"><b>${esc(a.title || cl)}</b><small>ฉบับที่ ${a.no} · รอบ ${a.r} · ${cl}${a.eff != null && a.eff > s.round ? ` · มีผลรอบ ${a.eff}` : ''}</small></span></summary>${annLetter(a, s)}</details>`; }).join('')}

}
// ตัวเขียนประกาศ (คนถือธนาคาร)

// ป๊อปอัพประกาศ/ทวงหนี้ (ทับของเดิม) — แบบจดหมายธนาคาร มีตารางรายละเอียด

// ==================================================================
// ③ แดชบอร์ดธนาคาร — ชุดกราฟเล็กๆ (SVG ล้วน ไม่ต้องโหลดไลบรารี)

const VZ = {}; let vzN = 0;
// สีชุดข้อมูล (ผ่านตัวตรวจตาบอดสีแล้ว) ตั้งเป็นตัวแปร CSS --vz1.. สลับโหมดมืดเอง

// ขีดแกนแบบตัวเลขกลมๆ (0 / 1,000 / 2,000)

}
const vzLegend = (series, kind = 'line') => series.length < 2 ? '' : `<div class="vz-lg">${series.map((x, i) => `<span><i class="${kind}" style="--c:${x.color || VZC[i]}"></i>${esc(x.name)}</span>`).join('')}</div>`;
// ตารางข้อมูล (ให้ทุกค่าดูได้โดยไม่ต้องชี้เมาส์)

  <tbody>${xs.map((x, k) => `<tr><td>${esc(x)}</td>${series.map(z => `<td class="r num">${Number.isFinite(z.vals[k]) ? (z.f || f)(z.vals[k]) : '—'}</td>`).join('')}</tr>`).reverse().join('')}</tbody></table></div></details>`;

// กราฟเส้น (หลายชุด) · step = เส้นขั้นบันได (ใช้กับอัตราดอกเบี้ย)
function vzLine({ xs, series, h = 200, step = false, f = compact, zero = true, wide }) {
  const id = 'vz' + (++vzN), W = vzW(wide), H = h;

  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - m.l - m.r) / 46))));
  const xl = xs.map((x, i) => (i % every === 0 || i === n - 1) && !(i !== n - 1 && n - 1 - i < every / 2) ? `<text class="vz-ax" x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(x)}</text>` : '').join('');

  return `${vzLegend(series)}<div class="vz-box"><svg class="vz" id="${id}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(series.map(x => x.name).join(', '))}">
    ${grid}${xl}${lines}<line class="vz-cross" id="${id}-x" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" style="display:none"/>${dots}${endsSvg}${hits}</svg></div>${vzTable(xs, series, f)}`;

// กราฟแท่งแนวตั้งแบบบวก/ลบ (กำไร-ขาดทุนรายรอบ): บวก = น้ำเงิน · ลบ = แดง
function vzCols({ xs, vals, h = 170, f = compact, name = 'ค่า', wide }) {

  const tk = niceTicks(lo, hi, 4); lo = tk[0]; hi = tk[tk.length - 1];

  const grid = tk.map(v => `<line class="vz-grid ${v === 0 ? 'zero' : ''}" x1="${m.l}" x2="${W - m.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="vz-ax" x="${m.l - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${f(v)}</text>`).join('');
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - m.l - m.r) / 40))));

      : `M${x} ${y0}V${y - r}Q${x} ${y} ${x + r} ${y}H${x + bw - r}Q${x + bw} ${y} ${x + bw} ${y - r}V${y0}Z`; };

// เส้นจิ๋วในการ์ดตัวเลข

// แถบสัดส่วน 100% (รายได้ธนาคารแยกประเภท)
function vzMix(parts) {

    <div class="mix-l">${parts.map((x, i) => `<span><i style="--c:${VZC[i]}"></i>${esc(x[0])}<b class="num">${fmt(x[1])}</b><small>${tot ? (x[1] / tot * 100).toFixed(0) : 0}%</small></span>`).join('')}</div>`;

// งบดุลรายคน: ซ้าย = หนี้ · ขวา = ทรัพย์สิน (บัญชี / ฝากประจำ / หุ้น)
function vzSheet(s) {
  const rows = s.order.map(i => { const p = P(i); return { i, out: p.out, a: [Math.max(0, p.bal), depValue(s, i), stockValue(s, i)], d: bankDebt(s, i) + mortOf(s, i) + Math.max(0, -p.bal) + s.loans.filter(L => L.borrower === i && L.lender != null && L.status === 'active').reduce((a, L) => a + L.balance, 0) }; });

    <div class="sheet5">${rows.sort((a, b) => (b.a.reduce((x, y) => x + y, 0) - b.d) - (a.a.reduce((x, y) => x + y, 0) - a.d)).map(r => `<div class="sh-r ${r.out ? 'out' : ''}">
      <span class="sh-n">${TOKENS[P(r.i).token].icon} ${esc(P(r.i).name)}</span>
      <span class="sh-bar"><span class="sh-l" style="width:${L}%">${r.d ? `<i style="width:${r.d / (maxD || 1) * 100}%;--c:var(--vz2)" data-tt="${esc(P(r.i).name)} · หนี้ทั้งหมด|${fmt(r.d)}"></i>` : ''}</span>
        <span class="sh-r2" style="width:${100 - L}%">${r.a.map((v, k) => v > 0 ? `<i style="width:${v / maxA * 100}%;--c:${['var(--vz1)', 'var(--vz3)', 'var(--vz4)'][k]}" data-tt="${esc(P(r.i).name)} · ${names[k]}|${fmt(v)}"></i>` : '').join('')}</span></span>
      <b class="num sh-v ${netWorth(s, r.i) < 0 ? 'neg' : ''}">${compact(netWorth(s, r.i))}</b></div>`).join('')}</div>
    <small class="muted">ตัวเลขขวาสุด = มูลค่าสุทธิ (รวมเงินสด/ทรัพย์สินที่แจ้งด้วย) · แตะแท่งเพื่อดูยอด</small>`;
}
// ดัชนีความเหลื่อมล้ำ (Gini) 0 = เท่ากันหมด · 1 = รวยคนเดียว
function gini(vals) {
  const v = vals.map(x => Math.max(0, x)).sort((a, b) => a - b), n = v.length, sum = v.reduce((a, b) => a + b, 0);
  if (n < 2 || !sum) return 0;
  return v.reduce((a, x, i) => a + (2 * (i + 1) - n - 1) * x, 0) / (n * sum);
}

document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') vzShow(e); });
document.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') vzShow(e); });
window.addEventListener('scroll', () => { const t = $('#vz-tip'); if (t) t.style.display = 'none'; }, { passive: true });
let vzRz; window.addEventListener('resize', () => { if (App.view !== 'dash') return; clearTimeout(vzRz); vzRz = setTimeout(render, 200); });

// ---------- ข้อมูลรายรอบ: ประวัติที่เก็บไว้ + จุด "ตอนนี้" ----------
function dashRows(s) {
  const x = bankSnap(s), live = [x.r, x.sav, x.fd, x.loan, x.mort, x.od, x.npl, x.inc, x.exp, x.rB, x.sv, x.fdR, x.mR, x.tx];
  const rows = (s.bh || []).filter(r => r[0] < s.round);
  rows.push(live);
  const lim = App.dashRange === 'all' ? 999 : +(App.dashRange || 10);
  return rows.slice(-lim);
}
const col = (rows, k) => rows.map(r => r[k]);

function renderDash(s) {
  const x = bankSnap(s), rows = dashRows(s), prevAll = (s.bh || []).filter(r => r[0] < s.round), prev = prevAll[prevAll.length - 1];
  const xs = rows.map(r => r[0] === s.round ? 'ตอนนี้' : 'ร.' + r[0]);
  const dep = rows.map(r => r[1] + r[2]), cred = rows.map(r => r[3] + r[4] + r[5]);
  const profitCum = rows.map(r => r[7] - r[8]);
  // กำไรรายรอบ = ส่วนต่างของกำไรสะสม
  const allRows = [...prevAll, rows[rows.length - 1]], pr = allRows.map((r, k) => (r[7] - r[8]) - (k ? allRows[k - 1][7] - allRows[k - 1][8] : 0)).slice(-rows.length);
  const ldr = x.dep ? x.cred / x.dep * 100 : 0, npl = x.cred ? x.npl / x.cred * 100 : 0;
  const pd = (k, f) => prev ? f(prev) : null;
  const dDep = prev ? x.dep - (prev[1] + prev[2]) : null, dCred = prev ? x.cred - (prev[3] + prev[4] + prev[5]) : null;
  const ldrPrev = prev && (prev[1] + prev[2]) ? (prev[3] + prev[4] + prev[5]) / (prev[1] + prev[2]) * 100 : null;
  const nplPrev = prev && (prev[3] + prev[4] + prev[5]) ? prev[6] / (prev[3] + prev[4] + prev[5]) * 100 : null;
  const txRound = s.tx.filter(t => t.r === s.round), vol = txRound.filter(t => t.k === 'transfer' || t.k === 'auction').reduce((a, t) => a + t.a, 0);
  const act = s.players.map((_, i) => i).filter(i => !P(i).out), g = gini(act.map(i => netWorth(s, i)));
  const est = estFlows(s), profit = x.inc - x.exp, dProfit = prev ? profit - (prev[7] - prev[8]) : null;
  // การ์ดตัวเลข: [ชื่อ, ค่า, เปลี่ยน, ขึ้นดีไหม, เส้นจิ๋ว, คำอธิบาย]
  // d = undefined → ไม่โชว์บรรทัดเปลี่ยนแปลง · null → ยังไม่มีรอบก่อนให้เทียบ
  const tile = (label, val, d, upGood, sp, hint) => `<div class="st5"><small>${label}</small><b class="num">${val}</b>
    ${d === undefined ? '' : d != null ? `<span class="dl ${Math.abs(d) < 0.005 ? '' : (d > 0) === upGood ? 'good' : 'bad'}">${arrow(Math.abs(d) < 0.005 ? 0 : d)} ${Math.abs(d) < 100 ? fmtR(Math.round(Math.abs(d) * 10) / 10) : compact(Math.abs(d))}<small> จากรอบก่อน</small></span>` : '<span class="dl"><small>รอบแรก</small></span>'}
    ${sp || ''}${hint ? `<em>${hint}</em>` : ''}</div>`;
  const tiles = [
    tile('🏦 เงินฝากทั้งระบบ', compact(x.dep), dDep, true, spark(dep), `ออมทรัพย์ ${compact(x.sav)} · ประจำ ${compact(x.fd)}`),
    tile('💳 สินเชื่อคงค้าง', compact(x.cred), dCred, false, spark(cred), `กู้ ${compact(x.loan)} · จำนอง ${compact(x.mort)}${x.od ? ` · ติดลบ ${compact(x.od)}` : ''}`),
    tile('⚖️ สินเชื่อต่อเงินฝาก (LDR)', `${ldr.toFixed(0)}%`, ldrPrev != null ? ldr - ldrPrev : null, false, spark(rows.map(r => (r[1] + r[2]) ? (r[3] + r[4] + r[5]) / (r[1] + r[2]) * 100 : 0)), ldr > 100 ? '⚠️ ปล่อยกู้เกินเงินฝาก' : 'ต่ำกว่า 100% = ปลอดภัย'),
    tile('🚨 หนี้เสีย (NPL)', `${npl.toFixed(1)}%`, nplPrev != null ? npl - nplPrev : null, false, spark(rows.map(r => (r[3] + r[4] + r[5]) ? r[6] / (r[3] + r[4] + r[5]) * 100 : 0)), `${compact(x.npl)} เลยกำหนด/ติดลบ`),
    tile('💰 ดอกเบี้ยรับสะสม', compact(x.int), undefined, true, '', `ภาษี ${compact(x.tax)} · ค่าธรรมเนียม ${compact(x.fee)}`),
    tile('💸 จ่ายดอก/ปันผลสะสม', compact(x.exp), undefined, false, '', 'ออมทรัพย์ + ฝากประจำ + ปันผลหุ้น'),
    tile('🔄 ธุรกรรมรอบนี้', fmt(txRound.length), undefined, true, '', `มูลค่าโอน/ประมูล ${compact(vol)}`),
    tile('📐 ความเหลื่อมล้ำ (Gini)', g.toFixed(2), undefined, false, '', g < 0.25 ? '🟢 ใกล้เคียงกัน' : g < 0.45 ? '🟡 เริ่มห่าง' : '🔴 รวยกระจุก'),
  ];
  if (s.bankBudget != null) tiles.push(tile('🏛️ งบกลางธนาคาร', compact(s.bankBudget), undefined, true, '', s.bankBudget <= 0 ? '⚠️ งบหมด' : 'จ่ายเกินงบ = ธนาคารล้ม'));
  const ranges = [['5', '5 รอบ'], ['10', '10 รอบ'], ['all', 'ทั้งเกม']];
  const cur = App.dashRange || '10';
  const enough = rows.length >= 2;
  const waitMsg = '<div class="emptybig">⏳<b>กำลังเก็บข้อมูล</b><small>กราฟจะขึ้นหลังจบรอบแรก (ระบบเก็บสถิติตอนขึ้นรอบใหม่ทุกครั้ง)</small></div>';
  const rateSeries = [
    { name: 'ดอกกู้ (เครดิต B)', short: 'กู้', vals: col(rows, 9), f: pctS },
    { name: 'ออมทรัพย์', short: 'ออม', vals: col(rows, 10), f: pctS },
    { name: 'ฝากประจำ 2 รอบ', short: 'ประจำ', vals: col(rows, 11), f: pctS },
    { name: 'จำนอง', short: 'จำนอง', vals: col(rows, 12), f: pctS },
  ];
  const credCount = CREDIT.map((c, k) => [c, act.filter(i => P(i).credit === k).length]);
  const loanBook = [
    ...s.loans.filter(L => L.lender == null && L.status === 'active').map(L => ({ no: 'L' + L.id, who: L.borrower, kind: '🧾 เงินกู้', prin: L.principal, bal: L.balance, rate: loanRate(s, L), due: L.dueRound, bad: L.overdue })),
    ...(s.morts || []).map(m => ({ no: 'M' + m.id, who: m.seat, kind: '📜 ' + m.name, prin: m.amt || m.bal, bal: m.bal, rate: +s.settings.mortRate, due: m.due, bad: s.round > m.due })),
  ].sort((a, b) => b.bad - a.bad || a.due - b.due);
  const fdBook = (s.deps || []).slice().sort((a, b) => a.due - b.due);
  const ticker = [`กู้ ${pctS(rateForCredit(s, 2))}`, `ออม ${pctS(s.settings.savRate)}`, `ประจำ ${pctS(depRateFor(s, 2))}–${pctS(depRateFor(s, 6))}`, `จำนอง ${pctS(s.settings.mortRate)}`, `LDR ${ldr.toFixed(0)}%`, `NPL ${npl.toFixed(1)}%`,
    ...(stockOn(s) ? STOCKS.map(z => { const m = s.mkt[z.id], pv = m.h.length > 1 ? m.h[m.h.length - 2] : m.p, ch = (m.p - pv) / pv * 100; return `${z.icon} ${fmt(m.p)} ${ch > 0 ? '▲' : ch < 0 ? '▼' : '•'}${Math.abs(ch).toFixed(1)}%`; }) : [])];
  const tk = ticker.map(t => `<span>${esc(t)}</span>`).join('');
  return `<div class="g5v staff dash">
    <header class="tl-head">
      <div class="tl-bar"><button class="bk-back dk-back" data-view="staff" aria-label="กลับเคาน์เตอร์">‹ เคาน์เตอร์</button>
        <div class="g5-brand"><b>📊 แดชบอร์ดธนาคาร</b><small>${BANK_NAME} · รอบที่ ${s.round}${s.status === 'over' ? ' · จบเกมแล้ว' : ''}</small></div>
        ${liveBadge()}<button class="ib5" data-a="help:dash" aria-label="อ่านแดชบอร์ดยังไง">❓</button></div>
      <div class="tape" aria-label="อัตราและราคาล่าสุด"><div class="tape-in">${tk}${tk}</div></div>
    </header>
    <main class="g5-main dash-main">
      <div class="dfilter" role="group" aria-label="ช่วงรอบ"><span class="muted">ช่วง:</span>${ranges.map(([k, l]) => `<button class="sm" data-a="dashRange:${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>
      <section class="hero5">
        <div><small>กำไรสุทธิของธนาคาร (สะสม)</small><b class="num ${profit < 0 ? 'neg' : ''}">${baht(profit)}</b>
          <span class="dl ${dProfit == null || dProfit === 0 ? '' : dProfit > 0 ? 'good' : 'bad'}">${dProfit != null ? `${signed(dProfit)} รอบนี้` : 'รอบแรก'}</span></div>
        <div class="hero-est"><small>ประมาณการรอบหน้า</small><span>ดอกรับ <b class="num">${compact(est.inn)}</b></span><span>ดอกจ่าย <b class="num">${compact(est.out)}</b></span><span>สุทธิ <b class="num ${est.net < 0 ? 'neg' : ''}">${signed(Math.round(est.net), compact)}</b></span></div>
      </section>
      <section class="tiles5">${tiles.join('')}</section>
      <div class="dgrid">
        <section class="card5"><h3>เงินฝาก vs สินเชื่อ <small>ยอดคงค้างแต่ละรอบ</small></h3>${enough ? vzLine({ xs, series: [{ name: 'เงินฝาก', vals: dep }, { name: 'สินเชื่อ', vals: cred }] }) : waitMsg}</section>
        <section class="card5"><h3>กำไรธนาคารรายรอบ <small>ดอกรับ+ภาษี+ประมูล − ดอกจ่าย/ปันผล</small></h3>${enough ? vzCols({ xs, vals: pr, name: 'กำไรรอบนั้น' }) : waitMsg}</section>
        <section class="card5"><h3>อัตราดอกเบี้ยย้อนหลัง <small>%/รอบ · เปลี่ยนเมื่อธนาคารประกาศ</small></h3>${enough ? vzLine({ xs, series: rateSeries, step: true, f: pctS }) : waitMsg}</section>
        <section class="card5"><h3>รายได้ธนาคารมาจากไหน <small>สะสมทั้งเกม</small></h3>${vzMix([['ดอกเบี้ย', x.int], ['ภาษี', x.tax], ['ค่าธรรมเนียม', x.fee], ['ขายประมูล', x.auc]])}
          <div class="mini-k"><span><small>กำไรสะสม</small><b class="num">${baht(profit)}</b></span><span><small>อัตรากำไร</small><b class="num">${x.inc ? (profit / x.inc * 100).toFixed(0) : 0}%</b></span></div>
          ${enough ? `<h3 style="margin-top:14px">กำไรสะสม <small>ตลอดช่วง</small></h3>${vzLine({ xs, series: [{ name: 'กำไรสะสม', vals: profitCum }], h: 150 })}` : ''}</section>
      </div>
      <section class="card5"><h3>งบดุลลูกค้า <small>ทรัพย์สิน (ขวา) เทียบหนี้ (ซ้าย)</small></h3>${vzSheet(s)}</section>
      <div class="dgrid">
        <section class="card5"><h3>ระดับเครดิตลูกค้า</h3><div class="crd5">${credCount.map(([c, k]) => `<span style="--c:${c.color}"><i>${c.name}</i><b class="num">${k}</b><small>ดอก ${pctS(rateForCredit(s, CREDIT.indexOf(c)))}</small></span>`).join('')}</div>
          <small class="muted">เครดิตลดเมื่อค้างหนี้/โดนยึด · เพิ่มเมื่อคืนหนี้ตรงเวลา</small></section>
        <section class="card5"><h3>ประกาศล่าสุด <small>${(s.anns || []).length} ฉบับ</small></h3>${annBoard(s, 3)}</section>
      </div>
      <section class="card5"><h3>สมุดสินเชื่อ <small>${loanBook.length} สัญญา · คงค้าง ${fmt(loanBook.reduce((a, l) => a + l.bal, 0))}</small></h3>
        ${loanBook.length ? `<div class="tscroll"><table class="book"><thead><tr><th>เลขที่</th><th>ลูกค้า</th><th>ประเภท</th><th class="r">เงินต้น</th><th class="r">คงค้าง</th><th class="r">ดอก</th><th class="r">ครบ</th><th>สถานะ</th></tr></thead><tbody>
          ${loanBook.map(l => `<tr class="${l.bad ? 'bad' : ''}"><td class="num">${l.no}</td><td>${pn(l.who)}</td><td>${esc(l.kind)}</td><td class="r num">${fmt(l.prin)}</td><td class="r num"><b>${fmt(l.bal)}</b></td><td class="r num">${pctS(l.rate)}</td><td class="r num">ร.${l.due}</td><td>${l.bad ? '🔴 เลยกำหนด' : l.due - s.round <= 1 ? '🟡 ใกล้ครบ' : '🟢 ปกติ'}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty" style="padding:0">ยังไม่มีสัญญาเงินกู้/จำนอง</p>'}</section>
      <section class="card5"><h3>สมุดเงินฝากประจำ <small>${fdBook.length} บัญชี · ต้องจ่ายคืนรวม ${fmt(fdBook.reduce((a, d) => a + d.val, 0))}</small></h3>
        ${fdBook.length ? `<div class="tscroll"><table class="book"><thead><tr><th>ลูกค้า</th><th class="r">เงินต้น</th><th class="r">มูลค่าตอนนี้</th><th class="r">ดอก (ล็อก)</th><th class="r">ครบ</th></tr></thead><tbody>
          ${fdBook.map(d => `<tr><td>${pn(d.seat)}</td><td class="r num">${fmt(d.amt)}</td><td class="r num"><b>${fmt(d.val)}</b></td><td class="r num">${pctS(d.rate)}</td><td class="r num">ร.${d.due}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty" style="padding:0">ยังไม่มีใครฝากประจำ</p>'}</section>
      <section class="card5"><h3>บัญชีลูกค้าทั้งหมด</h3><div class="tscroll"><table class="book"><thead><tr><th>ลูกค้า</th><th>เครดิต</th><th class="r">บัญชี</th><th class="r">ฝากประจำ</th><th class="r">หุ้น</th><th class="r">หนี้ธนาคาร</th><th class="r">ดอกกู้</th><th class="r">สุทธิ</th></tr></thead><tbody>
        ${s.order.map(i => { const p = P(i); return `<tr class="${p.out ? 'out' : ''}"><td>${pn(i)}</td><td>${creditHtml(i)}</td><td class="r num ${p.bal < 0 ? 'neg' : ''}">${baht(p.bal)}</td><td class="r num">${fmt(depValue(s, i))}</td><td class="r num">${fmt(stockValue(s, i))}</td><td class="r num">${fmt(bankDebt(s, i) + mortOf(s, i))}</td><td class="r num">${pctS(bankRate(s, i))}</td><td class="r num"><b>${baht(netWorth(s, i))}</b></td></tr>`; }).join('')}</tbody></table></div></section>
    </main>
    <nav class="g5-nav"><div class="in">
      <button data-view="table"><span class="bi">🎲</span>โต๊ะเกม</button>
      ${s.status === 'playing' ? `<button data-view="staff"><span class="bi">🧑‍💼</span>เคาน์เตอร์${(s.reqs || []).length ? `<span class="count">${s.reqs.length}</span>` : ''}</button>` : ''}
      <button aria-selected="true"><span class="bi">📊</span>แดชบอร์ด</button>
    </div></nav>
  </div>`;
}

// ---------- คำสั่งใหม่ของ v5.2 ----------
Object.assign(G5_ACTIONS, {
  preset: x => presetApply(+x),
  polCancel: () => confirmBox('ยกเลิกประกาศที่รอมีผล?', 'อัตราใหม่ที่ประกาศไว้จะไม่มีผล ใช้อัตราเดิมต่อ และทุกคนจะเห็นประกาศยกเลิก', 'ยกเลิกประกาศ', () => dispatch(null, { type: 'policyCancel' })),
  autoRate: x => { const on = x === '1'; if (!!S().settings.autoRate === on) return;
    dispatch(null, { type: 'bankPolicy', autoRate: on, settings: {} }).then(ok => { if (ok) toast(on ? '🎲 ดอกเบี้ยจะขยับตามข่าวสุ่มทุกรอบ' : '🧑‍💼 ดอกเบี้ยเปลี่ยนได้เฉพาะตอนธนาคารประกาศเท่านั้น'); }); },
  annAll: () => openModal('📢 ประกาศธนาคารทั้งหมด', annBoard(S()), () => { const bd = $('#modal-root .bd'); if (bd) bd.innerHTML = annBoard(S()); }),
  dashRange: x => { App.dashRange = x; render(); },
});

// การ์ดกราฟดอกเบี้ยย้อนหลัง (ผู้เล่นทุกคนดูได้ในแอปธนาคาร)
function rateHistCard(s) {
  const rows = [...(s.bh || []).filter(r => r[0] < s.round), [s.round, 0, 0, 0, 0, 0, 0, 0, 0, rateForCredit(s, 2), +s.settings.savRate || 0, depRateFor(s, 2), +s.settings.mortRate || 0, 0]].slice(-12);
  if (rows.length < 2) return '';
  const xs = rows.map(r => r[0] === s.round ? 'ตอนนี้' : 'ร.' + r[0]);
  return `<section class="panel stack"><b>📈 ดอกเบี้ยย้อนหลัง <small class="muted">%/รอบ · 12 รอบล่าสุด</small></b>
    ${vzLine({ xs, step: true, f: pctS, h: 170, series: [{ name: 'ดอกกู้ (เครดิต B)', short: 'กู้', vals: col(rows, 9) }, { name: 'ออมทรัพย์', short: 'ออม', vals: col(rows, 10) }, { name: 'ฝากประจำ 2 รอบ', short: 'ประจำ', vals: col(rows, 11) }, { name: 'จำนอง', short: 'จำนอง', vals: col(rows, 12) }] })}</section>`;
}

// จำว่าหมวดไหนกาง/พับไว้ (กันวาดใหม่แล้วพับกลับเอง)
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details.pg[data-pg]') && !d.closest('.modal')) { App.pgOpen = App.pgOpen || {}; App.pgOpen[d.dataset.pg] = d.open ? 1 : 0; } }, true);

// ==================================================================
// v5.2.1 — ธนาคารจ่ายเงินเข้าบัญชี + ใบแจ้งหนี้ (เกมไร้เงินสด)
// ==================================================================
const billRem = B => B.amt + B.pen - B.paid;
const billLeft = (s, B) => B.due - s.round; // เหลืออีกกี่รอบ (ติดลบ = เลยกำหนด)
const billWhen = (s, B) => B.late ? '🔴 เลยกำหนด' : billLeft(s, B) <= 0 ? '🟡 ครบกำหนดรอบนี้' : `ภายในรอบ ${B.due} (อีก ${billLeft(s, B)} รอบ)`;
// รายการใบแจ้งหนี้ที่ผู้เล่นต้องจ่าย (โชว์บนหน้าเล่น)
function billTodos(s, v, live) {
  return (s.bills || []).filter(b => b.st === 'open' && b.seat === v).map(B => `<div class="w-todo ${B.late ? 'bad' : 'gold'}"><span>🧾</span><div><b>ใบแจ้งหนี้ #${B.id} · ${fmt(billRem(B))}</b><small>${esc(B.note)} · ${billWhen(s, B)}${B.pen ? ` · รวมค่าปรับ ${fmt(B.pen)}` : ''}</small></div>
    ${live ? `<button class="sm primary" data-a="billPay:${B.id}" data-as="${v}">จ่ายเลย</button>` : ''}</div>`);
}
// แบบเดียวกัน สำหรับหน้า "ต้องจัดการ" ในแอปธนาคาร
function billNotices(s, v, live) {

// โหลด three.js จากไฟล์ในเว็บเราเอง (ไม่ต้องพึ่ง CDN) เฉพาะตอนเปิดโหมดกระดาน
let _T3 = null;
async function loadThree() { if (!_T3) _T3 = import('./vendor/three.module.min.js'); return _T3; }
// สร้างฉาก 3D กระดาน: วงรอบ 39 ช่อง + หมากทรงกลมที่เด้งไปตามช่อง
async function board3D(container, who) {
  const T = await loadThree(); const W = Math.min(container.clientWidth || 340, 360), H = Math.round(W * 0.9);
  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); renderer.setSize(W, H);
  renderer.domElement.className = 'board3d-cv'; container.appendChild(renderer.domElement);
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(42, W / H, 0.1, 100); cam.position.set(0, 17, 10); cam.lookAt(0, 0, 0);
  scene.add(new T.AmbientLight(0xffffff, 0.85)); const dl = new T.DirectionalLight(0xffffff, 0.8); dl.position.set(5, 10, 6); scene.add(dl);
  const g = new T.Group(); scene.add(g);
  const N = RING.length, R = 5.2, pos = i => { const a = (i / N) * Math.PI * 2 - Math.PI / 2; return new T.Vector3(R * Math.cos(a), 0, R * Math.sin(a)); };
  const COL = { s: 0xf2c94c, j: 0xeb5757, g: 0xeb5757, p: 0x56ccf2, c: 0xbb6bd9, l: 0x6fcf97 };
  const tiles = RING.map(([k], i) => { const m = new T.Mesh(new T.BoxGeometry(0.8, 0.3, 0.8), new T.MeshStandardMaterial({ color: COL[k] || 0x9aa8a2 }));
    m.position.copy(pos(i)); m.position.y = 0.15; g.add(m); return m; });
  const p = (window.P ? P(who) : null) || { token: 0 }; const tc = TOKENS[p.token] ? parseInt(TOKENS[p.token].color.slice(1), 16) : 0x2a78d6;
  const tok = new T.Mesh(new T.SphereGeometry(0.42, 24, 16), new T.MeshStandardMaterial({ color: tc, emissive: tc, emissiveIntensity: 0.25 }));
  tok.position.copy(pos(0)); tok.position.y = 0.6; g.add(tok);
  let target = pos(0), hi = null, drag = null, alive = true, lastX = 0;
  const setPos = i => { target = pos(i); const k = RING[i][0]; if (hi) hi.material.emissive.setHex(0); hi = tiles[i]; hi.material.emissive.setHex(0x333333); };
  renderer.domElement.addEventListener('pointerdown', e => { drag = true; lastX = e.clientX; });
  window.addEventListener('pointerup', () => { drag = false; });
  renderer.domElement.addEventListener('pointermove', e => { if (drag) { g.rotation.y += (e.clientX - lastX) * 0.01; lastX = e.clientX; } });
  let t = 0; (function loop() { if (!alive) return; t++; tok.position.x += (target.x - tok.position.x) * 0.18; tok.position.z += (target.z - tok.position.z) * 0.18;
    tok.position.y = 0.6 + Math.abs(Math.sin(t * 0.15)) * 0.0 + (Math.hypot(target.x - tok.position.x, target.z - tok.position.z) > 0.05 ? 0.5 : 0); if (!drag) g.rotation.y += 0.002;
    renderer.render(scene, cam); requestAnimationFrame(loop); })();
  return { setPos, dispose() { alive = false; renderer.forceContextLoss(); renderer.domElement.remove(); } };
}

  const flatTrack = () => {
    const track = Array.from({ length: total }, (_, i) => `<i data-i="${i}" class="${RING[i][0] === 'l' ? '' : 'sp'}" title="${esc(RING[i][1])}"></i>`).join('');
    stage.innerHTML = `<div class="walk-track">${track}<b class="walk-tok" style="--tc:${TOKENS[p.token].color}">${TOKENS[p.token].icon || '●'}</b></div>`;
    const tok = stage.querySelector('.walk-tok'), cells = stage.querySelectorAll('.walk-track i');
    place = i => { const c = cells[i]; if (!c) return; tok.style.transform = `translate(${c.offsetLeft}px,${c.offsetTop}px)`; cells.forEach(x => x.classList.remove('hot')); c.classList.add('hot'); };
    setTimeout(() => place(from), 0);
  };
  if (fx === 'board') {
    board3D(stage, who).then(b => { dispose = b.dispose; place = b.setPos; b.setPos(from); }).catch(() => { toast('โหลดกระดาน 3D ไม่ได้ ใช้แบบปกติแทน'); flatTrack(); });
  } else flatTrack();
  let k = 0; const stepTimer = setInterval(() => {
    k++; if (place) place((from + k) % total);
    if (k >= steps) {
      clearInterval(stepTimer); const L = S().landed || {}; const [kind, lname] = RING[L.pos] || ['l', ''];
      const what = kind === 'l' ? `ตกที่ ${lname}` : kind === 'c' ? `ตกช่องโอกาส — ธนาคารจะกำหนดการ์ดเอง` : kind === 'j' ? 'ช่องเข้าคุก' : kind === 'g' ? '🚓 ถูกส่งไปเข้าคุก' : kind === 's' ? '🏁 ถึงจุดเริ่มต้น' : `🅿️ พักที่ ${lname}`;
      ov.querySelector('#walk-land').innerHTML = `<b>${esc(what)}</b>`;
      setTimeout(() => { ov.classList.add('out'); dispose(); }, 1800); setTimeout(() => ov.remove(), 2300);
    }
  }, 260);
}

  // เปิดแอปใหม่โดยไม่มี ?room= (เช่น ปิดแอป/เบราว์เซอร์เด้ง) → ลองกลับห้องล่าสุดที่จำไว้
  let code = new URLSearchParams(location.search).get('room');
  if (!code) { try { code = localStorage.getItem('bb_room'); } catch (e) {} }
  if (!code || !FIREBASE_CONFIG) return;
  try { await fb(); const snap = await FB.getDoc(roomRef(code.toUpperCase()));
    if (snap.exists()) { const st = JSON.parse(snap.data().data); if (st.players.some(p => p.uid === App.uid) || isBankerUid(st, App.uid) || (st.bankWait || []).includes(App.uid) || isAdminUid(st, App.uid)) enterRoom(code.toUpperCase()); } } catch (e) { console.warn(e); }
})();

</script>
