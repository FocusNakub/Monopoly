<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ธนาคารเศรษฐี</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* ---------- โทนสี ---------- */
:root{
  --ground:#e9ece5; --surface:#fbfbf6; --surface2:#f0f2ea; --ink:#1c2b2a; --muted:#5d6d68;
  --line:#cdd4c9; --jade:#0f5b52; --jade-ink:#fff; --gold:#c98f0a; --danger:#c0392b; --ok:#1f8a4c;
  --note:#fff6dc; --shadow:0 1px 2px rgba(20,40,35,.08),0 6px 22px rgba(20,40,35,.08);
  --display:'Mitr',system-ui,sans-serif; --body:'IBM Plex Sans Thai',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --ground:#0d1514; --surface:#15211f; --surface2:#1c2b28; --ink:#e4ece8; --muted:#95a7a1;
    --line:#2d3e3a; --jade:#3fb8a4; --jade-ink:#062522; --gold:#e8b33a; --danger:#ef6b5b; --ok:#4cc17e; --note:#2a2616; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35); }
}
:root[data-theme="dark"]{ color-scheme:dark; --ground:#0d1514; --surface:#15211f; --surface2:#1c2b28; --ink:#e4ece8; --muted:#95a7a1;
  --line:#2d3e3a; --jade:#3fb8a4; --jade-ink:#062522; --gold:#e8b33a; --danger:#ef6b5b; --ok:#4cc17e; --note:#2a2616; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 26px rgba(0,0,0,.35); }
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--body);padding-inline:16px;padding-block:12px 40px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.2;text-wrap:balance}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.5em 1em}
button:hover:not(:disabled){background:var(--surface2)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:600}
button.primary:hover:not(:disabled){background:var(--jade);filter:brightness(1.08)}
button.gold{background:var(--gold);border-color:var(--gold);color:#1c1400;font-weight:600}
button.gold:hover:not(:disabled){background:var(--gold);filter:brightness(1.06)}
button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
button.sm{padding:.25em .7em;font-size:13.5px;border-radius:8px}
button.big{padding:.75em 1.2em;font-size:17px;border-radius:14px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55em .75em;min-width:0;width:100%}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field{display:grid;gap:4px}
.field small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:14px}
.tok{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:18px;border:2px solid var(--c);background:var(--surface);flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.badge.me{background:color-mix(in srgb,var(--jade) 16%,var(--surface));border-color:var(--jade)}
.badge.bad{background:color-mix(in srgb,var(--danger) 14%,var(--surface));border-color:var(--danger);color:var(--danger)}
.credit{font-family:var(--mono);font-weight:500;font-size:12px;padding:1px 8px;border-radius:6px;color:#fff;background:var(--cc)}
.warn{font-size:13.5px;background:var(--note);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px}

/* ---------- หน้าแรก ---------- */
.hero{display:grid;gap:6px;padding-top:3vh}
.hero h1{font-size:clamp(34px,8vw,54px);font-weight:600}
.hero h1 span{color:var(--gold)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.features li{display:grid;gap:2px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.features b{font-family:var(--display);font-weight:500;font-size:15px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.tokpick{display:flex;gap:6px;flex-wrap:wrap}
.tokpick button{font-size:21px;padding:3px 8px;line-height:1.3}
.tokpick button[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--surface));box-shadow:inset 0 0 0 1px var(--gold)}

/* ---------- เกม ---------- */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:20px;margin-right:auto}
.top h1 span{color:var(--gold)}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:var(--surface)}
.turn{display:grid;gap:12px;background:var(--jade);color:var(--jade-ink);border:0;position:relative;overflow:hidden}
.turn::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid color-mix(in srgb,var(--jade-ink) 10%,transparent)}
.turn .rnd{font-family:var(--mono);font-size:13px;opacity:.85}
.turn .who{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:clamp(22px,6vw,30px);font-weight:500}
.turn .who .tok{width:46px;height:46px;font-size:26px;border-color:var(--jade-ink)}
.turn .next{font-size:13.5px;opacity:.85}
.turn button{border-color:transparent}
.turn button.ghost{background:color-mix(in srgb,var(--jade-ink) 14%,transparent);color:var(--jade-ink)}
.effects{display:flex;gap:6px;flex-wrap:wrap}
.effect{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:5px 12px;border-radius:999px;background:var(--note);border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line))}
.effect small{color:var(--muted);font-family:var(--mono)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;border:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;border:0;background:transparent;padding:.5em .3em;font-size:14px;border-radius:9px;position:relative}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.tabs .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.who-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.who-pick button{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.who-pick button[aria-pressed="true"]{border-color:var(--jade);background:color-mix(in srgb,var(--jade) 14%,var(--surface))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:340px){.stats{grid-template-columns:1fr 1fr}}
.loan{display:grid;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.loan.over{border-color:var(--danger);box-shadow:inset 4px 0 0 var(--danger)}
.loan.offer{border-style:dashed;border-color:var(--gold);background:var(--note)}
.loan .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.loan .amt{font-family:var(--mono);font-size:20px;font-weight:500;margin-left:auto}
.loan .meta{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade)}
.loan.over .bar i{background:var(--danger)}
.section-h{display:flex;align-items:center;gap:8px;margin-top:4px}
.section-h h2{font-size:17px;margin-right:auto}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tscroll{overflow-x:auto}
.hist{display:grid;gap:8px}
.hist .h{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.hist .ic{font-size:26px;line-height:1}
.hist small{color:var(--muted);font-family:var(--mono)}
.log{display:grid;gap:2px;font-size:13.5px}
.log div{padding:5px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:34px 1fr;gap:6px}
.log small{font-family:var(--mono);color:var(--muted)}

/* ---------- ป๊อปอัป ---------- */
.modal{position:fixed;inset:0;background:rgba(10,20,18,.55);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:18px;max-width:480px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet .hd{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .hd h2{font-size:19px;margin-right:auto}
.sheet .bd{padding:16px 18px;display:grid;gap:12px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.preview{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:2px}
/* การ์ดอีเว้นท์ */
.evmodal{position:fixed;inset:0;background:rgba(8,16,14,.72);display:grid;place-items:center;padding:16px;z-index:60;perspective:1200px}
.evcard{width:min(100%,380px);border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;animation:flip .7s cubic-bezier(.2,.8,.2,1)}
.evcard .evtop{background:repeating-linear-gradient(135deg,var(--gold) 0 14px,color-mix(in srgb,var(--gold) 80%,#fff) 14px 28px);padding:26px 20px 18px;display:grid;justify-items:center;gap:6px;color:#1c1400}
.evcard .ic{font-size:64px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.evcard .kicker{font-size:12px;letter-spacing:.14em;font-weight:600}
.evcard h2{font-size:28px;font-weight:600;text-align:center}
.evcard .tx{padding:18px 20px;font-size:17px;line-height:1.6;text-align:center}
.evcard .ft{padding:0 20px 20px}
.evcard .ft button{width:100%}
@keyframes flip{0%{transform:rotateY(90deg) scale(.8);opacity:0}100%{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;z-index:99;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* ---------- บัญชีธนาคาร ---------- */
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:600;font-family:var(--mono)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--jade)}
.check span{display:grid;gap:1px}
.check small{color:var(--muted);font-size:12.5px}
.card-bank{position:relative;overflow:hidden;border-radius:20px;padding:18px 20px;color:#f6f3e8;
  background:radial-gradient(120% 140% at 100% 0%,#1d7a6d 0%,#0f4d45 45%,#0b3530 100%);box-shadow:var(--shadow);display:grid;gap:4px}
.card-bank::after{content:"";position:absolute;right:-30px;bottom:-60px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(232,179,58,.16)}
.card-bank.neg{background:radial-gradient(120% 140% at 100% 0%,#8f3a2f 0%,#5d231d 55%,#3b1511 100%)}
.cb-name{font-family:var(--display);font-size:16px}
.cb-label{font-size:12.5px;letter-spacing:.04em;opacity:.8;margin-top:6px}
.cb-bal{font-size:clamp(34px,10vw,46px);font-weight:500;line-height:1.1;letter-spacing:-.01em}
.cb-foot{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;opacity:.9;margin-top:6px;position:relative;z-index:1}
.cb-foot b{font-weight:500}
.card-bank .credit{position:relative;z-index:1}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.actions{grid-template-columns:repeat(4,1fr);gap:6px}}
.actions button{display:grid;justify-items:center;gap:4px;padding:10px 4px;font-size:12.5px;line-height:1.25;border-radius:14px}
.actions button span{font-size:22px;line-height:1}
.txlist{padding:4px 12px}
.txr{display:grid;grid-template-columns:28px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.txr:last-child{border-bottom:0}
.tx-ic{grid-row:1/3;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px}
.tx-ic.in{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.tx-ic.out{background:color-mix(in srgb,var(--danger) 13%,var(--surface));color:var(--danger)}
.tx-main{font-size:14px;min-width:0;overflow-wrap:anywhere}
.tx-main small{display:block;color:var(--muted);font-size:12px}
.tx-amt{font-size:15px;text-align:right}
.tx-amt.in{color:var(--ok)} .tx-amt.out{color:var(--danger)}
.tx-r{grid-column:3;font-size:11.5px;text-align:right}
.turn.mine{box-shadow:0 0 0 3px var(--gold),var(--shadow)}
/* ---------- QR เชิญ ---------- */
.invite{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
@media (max-width:380px){.invite{grid-template-columns:1fr}}
.qrbox{background:#fff;border-radius:14px;padding:8px;width:148px;max-width:100%;border:1px solid var(--line)}
.qr{display:block;width:100%;height:auto}
/* ---------- ผลการแข่งขัน ---------- */
.podium{display:grid;gap:8px}
.rank{display:grid;grid-template-columns:34px auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.rank .pos{font-size:22px;text-align:center;font-family:var(--mono)}
.rank .rk-name{display:grid;min-width:0}
.rank .rk-name small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.rank .rk-net{font-size:18px}
.rank > button{grid-column:3/5;justify-self:end}
.rank.win{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 40%,transparent)}
.hls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.hl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.hl-ic{font-size:24px}
.hl small{display:block;color:var(--muted);font-size:12px}
.worth{border-color:var(--gold)}
.cev{padding:6px 0;border-bottom:1px dashed var(--line)}
.pm{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.pm:last-child{border-bottom:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="ev-root"></div>
<div id="toast" hidden></div>

<script>
// ================================================================
// 🔧 ตั้งค่า Firebase: วาง config ของโปรเจกต์คุณตรงนี้ (ดูวิธีใน README)
//    ถ้าปล่อยเป็น null จะใช้ได้เฉพาะโหมด "มือถือเครื่องเดียววางกลางโต๊ะ"
// ================================================================
const FIREBASE_CONFIG = null;
const ROOMS = 'boardbank_rooms'; // ชื่อ collection ใน Firestore
</script>

<script>
// ================== ENGINE: ธนาคารเศรษฐี (ผู้ช่วยเศรษฐีกระดานจริง) ==================
// เล่นกระดานจริง + เงินสดกระดาษ คู่กับบัญชีธนาคารในแอป
// แอปทำหน้าที่: บัญชีธนาคาร (ฝาก/ถอน/โอน), นับตา/รอบ, กู้ยืม, อีเว้นท์พิเศษ, แอดมิน, สรุปผล
// ฟังก์ชันล้วน: รับ state + คำสั่ง -> คืน state ใหม่ (ใช้ได้ทั้งออนไลน์/เครื่องเดียว)

const MAX_PLAYERS = 8;
const TOKENS = [
  { icon: '🛺', color: '#e4572e' }, { icon: '🚕', color: '#2e86ab' }, { icon: '🐘', color: '#7b5ea7' },
  { icon: '🍜', color: '#3d9a50' }, { icon: '🛵', color: '#d99a00' }, { icon: '🦆', color: '#c2185b' },
  { icon: '🐯', color: '#8d6e63' }, { icon: '🚀', color: '#455a64' },
];
// ระดับเครดิต: ปรับดอกเบี้ย (+/- %) และวงเงินกู้ (×)
const CREDIT = [
  { name: 'D',   adj: +4, cap: 0.3, color: '#c0392b' },
  { name: 'C',   adj: +2, cap: 0.6, color: '#e67e22' },
  { name: 'B',   adj: 0,  cap: 1.0, color: '#7f8c8d' },
  { name: 'A',   adj: -1, cap: 1.3, color: '#27ae60' },
  { name: 'AAA', adj: -2, cap: 1.6, color: '#c98f0a' },
];
const DEFAULT_SETTINGS = {
  start: 15000,       // เงินเริ่มต้นบนกระดาน (ใช้คำนวณสัดส่วนเงินในอีเว้นท์)
  rate: 5,            // ดอกเบี้ยเงินกู้ธนาคาร %/รอบ
  capPct: 50,         // วงเงินกู้ธนาคาร % ของเงินเริ่มต้น
  penalty: 10,        // ค่าปรับค้างชำระ %
  eventMode: 'every', // ความถี่อีเว้นท์
  startBal: 0,        // ยอดเงินในบัญชีตอนเริ่มเกม
  goSalary: 2000,     // เงินผ่านจุดเริ่มต้น (กดรับเข้าบัญชี)
  autoPay: true,      // อีเว้นท์ตัด/เติมเงินในบัญชีอัตโนมัติ
  cashConfirm: true,  // ฝาก/ถอนเงินสดต้องให้แอดมินยืนยัน
};
const EVENT_MODES = { every: 'ทุกรอบ', every2: 'ทุก 2 รอบ', chance: 'สุ่ม 50% ต่อรอบ', manual: 'กดสุ่มเองเท่านั้น' };
const REQ_KIND = { deposit: 'ฝากเงินสดเข้าบัญชี', withdraw: 'ถอนเป็นเงินสด', claim: 'ขอรับเงินจากธนาคาร' };

const fmt = n => Number(n).toLocaleString('en-US');
const clone = o => JSON.parse(JSON.stringify(o));
class GameError extends Error {}
const need = (c, m) => { if (!c) throw new GameError(m); };
const shuffle = (a, rng) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const posInt = (x, msg) => { const v = Math.round(+x); need(Number.isFinite(v) && v > 0, msg || 'จำนวนเงินไม่ถูกต้อง'); return v; };

// หน่วยเงินปัดเศษ: กระดาน 1,500 -> ปัดทีละ 10, กระดาน 15,000 -> ปัดทีละ 100
const unitOf = s => Math.max(1, Math.pow(10, Math.floor(Math.log10(s.settings.start / 150))));
// แปลงยอดเงินฐาน (อิงกระดาน 1,500) ให้เข้ากับกระดานจริง
const money = (s, base) => { const u = unitOf(s); return Math.max(u, Math.round(base * s.settings.start / 1500 / u) * u); };
const roundUnit = (s, x, up) => { const u = unitOf(s); return (up ? Math.ceil(x / u) : Math.round(x / u)) * u; };

function log(s, msg) { s.log.push({ r: s.round || 0, m: msg }); if (s.log.length > 150) s.log.splice(0, s.log.length - 150); }
const nm = (s, i) => i == null ? 'ธนาคาร' : s.players[i].name;
const active = s => s.order.filter(i => !s.players[i].out);
const hasEffect = (s, key) => (s.effects || []).some(e => e.key === key);
// ---------- แอดมิน (กรรมการ): เจ้าของห้อง + ใครก็ตามที่ใส่ PIN ถูก ไม่ต้องเป็นผู้เล่นก็ได้ ----------
const genPin = () => String(Math.floor(1000 + Math.random() * 9000));
const isAdminUid = (s, uid) => uid === s.hostUid || (s.admins || []).includes(uid);
// ---------- แบงก์เกอร์: คนถือเงินสดธนาคาร มีรหัส PIN แยกจากแอดมิน ทำได้แค่ยืนยันฝาก/ถอน/รับเงิน (แอดมินทำแทนได้เสมอ) ----------
const isBankerUid = (s, uid) => isAdminUid(s, uid) || (s.bankers || []).includes(uid);

// ---------- บัญชีธนาคาร ----------
// บันทึกรายการเงิน (from/to = seat หรือ null = ธนาคาร)
function addTx(s, kind, from, to, amt, note) {
  s.tx.push({ id: s.nextTx++, k: kind, f: from, t: to, a: amt, n: note || '', r: s.round });
  if (s.tx.length > 300) s.tx.splice(0, s.tx.length - 300);
}
// เปลี่ยนยอดบัญชี (ยอมให้ติดลบได้เฉพาะที่ระบบสั่ง เช่น อีเว้นท์ = เบิกเกินบัญชี)
function credit(s, seat, amt, kind, note, from = null) { s.players[seat].bal += amt; addTx(s, kind, from, seat, amt, note); }
function debit(s, seat, amt, kind, note, to = null) { s.players[seat].bal -= amt; addTx(s, kind, seat, to, amt, note); }
function xfer(s, from, to, amt, kind, note) { s.players[from].bal -= amt; s.players[to].bal += amt; addTx(s, kind, from, to, amt, note); }

// ---------- ดอกเบี้ย / วงเงิน ----------
function bankRate(s, seat) {
  if (hasEffect(s, 'rate0')) return 0;
  let r = Math.max(1, s.settings.rate + CREDIT[s.players[seat].credit].adj);
  if (hasEffect(s, 'rateX2')) r *= 2;
  if (hasEffect(s, 'rateHalf')) r = Math.max(1, Math.round(r / 2));
  return r;
}
const loanRate = (s, L) => (L.lender == null ? bankRate(s, L.borrower) : L.rate) + (L.overdue ? 2 : 0);
function bankCap(s, seat) { return roundUnit(s, s.settings.start * s.settings.capPct / 100 * CREDIT[s.players[seat].credit].cap); }
const bankDebt = (s, seat) => s.loans.filter(L => L.lender == null && L.borrower === seat && L.status === 'active').reduce((a, L) => a + L.balance, 0);
const debtOf = (s, seat) => s.loans.filter(L => L.borrower === seat && L.status === 'active').reduce((a, L) => a + L.balance, 0);
const lentOf = (s, seat) => s.loans.filter(L => L.lender === seat && L.status === 'active').reduce((a, L) => a + L.balance, 0);
function bumpCredit(s, seat, d) {
  const p = s.players[seat], old = p.credit;
  p.credit = Math.max(0, Math.min(CREDIT.length - 1, p.credit + d));
  if (p.credit !== old) log(s, `${d > 0 ? '📈' : '📉'} เครดิตของ ${p.name} ${d > 0 ? 'ขึ้น' : 'ลด'}เป็น ${CREDIT[p.credit].name}`);
}

// ---------- ความมั่งคั่งสุทธิ (ใช้จัดอันดับ) ----------
// = ยอดบัญชี + เงินสดกระดาษที่แจ้ง + มูลค่าทรัพย์สินที่แจ้ง + เงินที่คนอื่นติดเรา − หนี้ของเรา
function netWorth(s, seat) {
  const p = s.players[seat];
  return p.bal + (p.cash || 0) + (p.assets || 0) + lentOf(s, seat) - debtOf(s, seat);
}
function gameStats(s, seat) {
  const mine = s.loans.filter(L => L.borrower === seat && ['active', 'paid', 'forgiven'].includes(L.status));
  const sent = s.tx.filter(t => t.f === seat && t.t != null && t.k === 'transfer').reduce((a, t) => a + t.a, 0);
  const got = s.tx.filter(t => t.t === seat && t.k === 'transfer').reduce((a, t) => a + t.a, 0);
  const lent = s.loans.filter(L => L.lender === seat && ['active', 'paid', 'forgiven'].includes(L.status)).reduce((a, L) => a + L.principal, 0);
  return { borrowed: mine.reduce((a, L) => a + L.principal, 0), interest: mine.reduce((a, L) => a + L.interest, 0), sent, got, lent };
}

// อีเว้นท์ที่แอดมินสร้างเอง: target = all | random | seat, amount บวก = รับจากธนาคาร / ลบ = จ่ายธนาคาร
function customFx(c) {
  return (s, a) => {
    let who = [];
    if (c.target === 'all') who = a.all();
    else if (c.target === 'random') who = a.pick(1);
    else if (c.target === 'seat' && s.players[c.seat] && !s.players[c.seat].out) who = [c.seat];
    const amt = Math.round(c.amount || 0);
    who.forEach(i => { if (amt > 0) a.giveRaw(i, amt); else if (amt < 0) a.takeRaw(i, -amt); });
    const names = who.map(a.n).join(', ') || '—';
    const raw = String(c.text || '');
    let text = raw.replace(/\{ชื่อ\}/g, names).replace(/\{เงิน\}/g, fmt(Math.abs(amt)));
    if (amt && !/\{เงิน\}/.test(raw)) {
      const tail = `${amt > 0 ? 'รับ' : 'จ่าย'} ${fmt(Math.abs(amt))}${c.target === 'all' ? ' คนละเท่ากัน' : ''}`;
      text += /\{ชื่อ\}/.test(raw) ? ` (${tail})` : `${text ? ' — ' : ''}${names} ${tail}`;
    } else if (!raw && who.length) text = names;
    return text || c.title;
  };
}
const findEvent = (s, id) => EVENT_BY_ID[id] || (s.customEvents || []).map(c => ({ id: c.id, icon: c.icon, title: c.title, fx: customFx(c), custom: true })).find(e => e.id === id);

function drawEvent(s, rng, forceId, adhoc) {
  if (!active(s).length) return;
  const deckIds = () => shuffle([...EVENTS.map(e => e.id), ...(s.customEvents || []).filter(c => c.inDeck).map(c => c.id)], rng);
  if (!s.eventDeck || !s.eventDeck.length) s.eventDeck = deckIds();
  let e;
  if (adhoc) e = adhoc;
  else {
    let id = forceId;
    if (id) s.eventDeck = s.eventDeck.filter(x => x !== id); // เลือกเอง: ไม่ให้ใบเดิมซ้ำในสำรับ
    else {
      do { id = s.eventDeck.shift(); if (!s.eventDeck.length && !findEvent(s, id)) s.eventDeck = deckIds(); } while (!findEvent(s, id)); // ข้ามใบที่ถูกลบไปแล้ว
    }
    e = findEvent(s, id);
  }
  const all = () => active(s);
  let moved = false;
  const auto = s.settings.autoPay;
  const api = {
    m: b => fmt(money(s, b)),
    n: i => s.players[i].name,
    all,
    roll: () => 1 + Math.floor(rng() * 6),
    pick: k => shuffle(all().slice(), rng).slice(0, k),
    skip: i => { s.skip[i] = (s.skip[i] || 0) + 1; },
    effect: (key, label, rounds) => { s.effects = s.effects.filter(x => x.key !== key); s.effects.push({ key, label, icon: e.icon, until: s.round + rounds - 1 }); },
    mostDebt: () => { const d = all().map(i => [i, debtOf(s, i)]).filter(x => x[1] > 0).sort((p, q) => q[1] - p[1]); return d.length ? d[0][0] : null; },
    richestLender: () => { const l = all().map(i => [i, lentOf(s, i)]).sort((p, q) => q[1] - p[1]); return l[0][1] > 0 ? l[0][0] : api.pick(1)[0]; },
    // เงินเข้า/ออกบัญชีตามอีเว้นท์ (ยอดฐานอิงกระดาน 1,500 จะถูกปรับสัดส่วนให้)
    give: (i, base) => { if (auto) { credit(s, i, money(s, base), 'event', e.title); moved = true; } },
    take: (i, amt) => { if (auto) { debit(s, i, amt, 'event', e.title); moved = true; } },
    pay: (from, to, base) => { if (auto && from !== to) { xfer(s, from, to, money(s, base), 'event', e.title); moved = true; } },
    giveRaw: (i, amt) => { if (auto) { credit(s, i, amt, 'event', e.title); moved = true; } },
    takeRaw: (i, amt) => { if (auto) { debit(s, i, amt, 'event', e.title); moved = true; } },
  };
  let text = e.fx(s, api);
  if (moved) text += ' 💳 ตัด/เติมเงินในบัญชีให้แล้ว';
  s.event = { n: (s.event ? s.event.n : 0) + 1, id: e.id, icon: e.icon, title: e.title, text, round: s.round };
  s.eventHistory.unshift({ icon: e.icon, title: e.title, text, round: s.round });
  if (s.eventHistory.length > 40) s.eventHistory.length = 40;
  log(s, `${e.icon} อีเว้นท์: ${e.title} — ${text}`);
}

// ================== รอบใหม่: คิดดอกเบี้ย เช็คครบกำหนด ==================
function newRound(s, rng) {
  s.round++;
  log(s, `🔔 เริ่มรอบที่ ${s.round}`);
  s.effects = s.effects.filter(e => e.until >= s.round);
  for (const L of s.loans) {
    if (L.status !== 'active') continue;
    const r = loanRate(s, L);
    const add = r > 0 ? roundUnit(s, L.balance * r / 100, true) : 0;
    if (add) { L.balance += add; L.interest += add; }
    if (s.round > L.dueRound && !L.overdue) {
      L.overdue = true;
      const pen = roundUnit(s, L.balance * s.settings.penalty / 100, true);
      L.balance += pen; L.interest += pen;
      log(s, `🚨 ${nm(s, L.borrower)} ค้างชำระหนี้${L.lender == null ? 'ธนาคาร' : 'ของ ' + nm(s, L.lender)} โดนค่าปรับ ${fmt(pen)} ยอดค้าง ${fmt(L.balance)}`);
      bumpCredit(s, L.borrower, -1);
    }
  }
  // เบิกเกินบัญชี (ยอดติดลบ) คิดดอกเบี้ยเท่าดอกเบี้ยเงินกู้ธนาคาร
  for (const i of active(s)) {
    const p = s.players[i];
    if (p.bal >= 0) continue;
    const r = bankRate(s, i);
    const add = r > 0 ? roundUnit(s, -p.bal * r / 100, true) : 0;
    if (add) { debit(s, i, add, 'overdraft', `ดอกเบี้ยเบิกเกินบัญชี ${r}%`); log(s, `🔴 ${p.name} บัญชีติดลบ โดนดอกเบี้ย ${fmt(add)}`); }
  }
  const m = s.settings.eventMode;
  if (m === 'every' || (m === 'every2' && s.round % 2 === 0) || (m === 'chance' && rng() < 0.5)) drawEvent(s, rng);
}

function nextTurn(s, rng) {
  const act = active(s);
  if (!act.length) return;
  let idx = s.order.indexOf(s.turn);
  for (let guard = 0; guard < 50; guard++) {
    idx = (idx + 1) % s.order.length;
    if (idx === 0) newRound(s, rng);
    const seat = s.order[idx];
    if (s.players[seat].out) continue;
    if (s.skip[seat] > 0) { s.skip[seat]--; log(s, `🚦 ${s.players[seat].name} ข้ามตานี้ (รถติด)`); continue; }
    s.turn = seat; break;
  }
  s.goCount = 0;
  log(s, `▶️ ตาของ ${s.players[s.turn].name}`);
}

// ================== ตัวหลัก ==================
function newRoom(hostUid) {
  return { v: 3, status: 'lobby', hostUid, pin: genPin(), admins: [], bankPin: genPin(), bankers: [], players: [], settings: { ...DEFAULT_SETTINGS }, log: [], seq: 0 };
}

// คำสั่งเหล่านี้เป็นของแอดมิน/แบงก์เกอร์ (กรรมการ) ไม่จำเป็นต้องเป็นผู้เล่นในห้องก็สั่งได้
const ADMIN_NO_SEAT = ['settings', 'reorder', 'start', 'setOut', 'endGame', 'endTurn', 'drawEvent', 'editLoan', 'adjustCredit', 'forceEvent',
  'setRound', 'resetPin', 'resetBankPin', 'resolveReq', 'adjustBalance', 'addCustomEvent', 'deleteCustomEvent', 'declareWorth', 'goSalary'];

function applyAction(state, uid, act, rng = Math.random) {
  const s = clone(state);
  s.seq = (s.seq || 0) + 1;

  if (act.type === 'join') {
    const seat0 = s.players.findIndex(p => p.uid === uid);
    const name = String(act.name || '').trim().slice(0, 16);
    need(name, 'กรุณาใส่ชื่อ');
    const same = s.players.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
    if (s.status !== 'lobby') {
      need(same >= 0, 'เกมเริ่มไปแล้ว (เข้ากลับได้ด้วยชื่อเดิมเท่านั้น)');
      if (s.players[same].uid === s.hostUid) s.hostUid = uid;
      s.players[same].uid = uid; log(s, `🔌 ${name} กลับเข้าห้อง`); return s;
    }
    if (seat0 >= 0) { need(same < 0 || same === seat0, 'ชื่อนี้มีคนใช้แล้ว'); s.players[seat0].name = name; return s; }
    need(s.players.length < MAX_PLAYERS, `ห้องเต็มแล้ว (สูงสุด ${MAX_PLAYERS} คน)`);
    need(same < 0, 'ชื่อนี้มีคนใช้แล้ว');
    const used = s.players.map(p => p.token);
    const token = Number.isInteger(act.token) && !used.includes(act.token) ? act.token : TOKENS.findIndex((_, i) => !used.includes(i));
    s.players.push({ uid, name, token, credit: 2, out: false, bal: 0, cash: null, assets: null });
    log(s, `👋 ${name} เข้าห้อง`);
    return s;
  }
  if (act.type === 'claimAdmin') {
    need(String(act.pin || '').trim() === s.pin, 'รหัส PIN ไม่ถูกต้อง');
    s.admins = s.admins || [];
    if (uid !== s.hostUid && !s.admins.includes(uid)) { s.admins.push(uid); log(s, `🛡️ มีคนเข้าสู่โหมดแอดมินด้วยรหัส PIN`); }
    return s;
  }
  if (act.type === 'claimBanker') {
    need(String(act.pin || '').trim() === s.bankPin, 'รหัส PIN ไม่ถูกต้อง');
    s.bankers = s.bankers || [];
    if (!isBankerUid(s, uid) && !s.bankers.includes(uid)) { s.bankers.push(uid); log(s, `🏧 มีคนเข้าสู่โหมดแบงก์เกอร์ด้วยรหัส PIN`); }
    return s;
  }

  const seat = s.players.findIndex(p => p.uid === uid);
  const me = seat >= 0 ? s.players[seat] : null;
  const isHost = s.hostUid === uid;
  const isAdmin = isAdminUid(s, uid);
  const isBanker = isBankerUid(s, uid);
  if (!ADMIN_NO_SEAT.includes(act.type)) need(seat >= 0, 'คุณไม่ได้อยู่ในห้องนี้');

  switch (act.type) {
    case 'leave':
      need(s.status === 'lobby', 'ออกระหว่างเกมไม่ได้ ให้แอดมินตั้งเป็น "ออกจากเกม" แทน');
      s.players.splice(seat, 1);
      if (isHost && s.players.length) s.hostUid = s.players[0].uid;
      log(s, `🚪 ${me.name} ออกจากห้อง`);
      break;
    case 'pickToken':
      need(s.status === 'lobby', 'เปลี่ยนตัวเดินได้เฉพาะก่อนเริ่ม');
      need(!s.players.some((p, i) => i !== seat && p.token === act.token), 'มีคนใช้ตัวนี้แล้ว');
      me.token = act.token; break;
    case 'settings': {
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      const v = act.settings || {};
      const st = s.settings;
      if (v.start != null) { const x = Math.round(+v.start); need(x >= 100 && x <= 10000000, 'เงินเริ่มต้นไม่ถูกต้อง'); st.start = x; }
      if (v.rate != null) { const x = Math.round(+v.rate); need(x >= 0 && x <= 50, 'ดอกเบี้ยต้องอยู่ระหว่าง 0–50%'); st.rate = x; }
      if (v.capPct != null) { const x = Math.round(+v.capPct); need(x >= 10 && x <= 300, 'วงเงินต้องอยู่ระหว่าง 10–300%'); st.capPct = x; }
      if (v.penalty != null) { const x = Math.round(+v.penalty); need(x >= 0 && x <= 100, 'ค่าปรับต้องอยู่ระหว่าง 0–100%'); st.penalty = x; }
      if (v.eventMode != null) { need(EVENT_MODES[v.eventMode], 'โหมดอีเว้นท์ไม่ถูกต้อง'); st.eventMode = v.eventMode; }
      if (v.startBal != null) { const x = Math.round(+v.startBal); need(x >= 0 && x <= 100000000, 'ยอดเริ่มต้นไม่ถูกต้อง'); st.startBal = x; }
      if (v.goSalary != null) { const x = Math.round(+v.goSalary); need(x >= 0 && x <= 100000000, 'เงินผ่านจุดเริ่มต้นไม่ถูกต้อง'); st.goSalary = x; }
      if (v.autoPay != null) st.autoPay = !!v.autoPay;
      if (v.cashConfirm != null) st.cashConfirm = !!v.cashConfirm;
      if (s.status === 'playing') log(s, `⚙️ แอดมินปรับการตั้งค่า`);
      break;
    }
    case 'reorder': {
      need(isAdmin && s.status === 'lobby', 'จัดลำดับได้เฉพาะแอดมินก่อนเริ่ม');
      const i = act.seat, j = i + act.dir;
      need(s.players[i] && s.players[j], 'ย้ายไม่ได้');
      [s.players[i], s.players[j]] = [s.players[j], s.players[i]];
      break;
    }
    case 'start':
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      need(s.status === 'lobby', 'เริ่มไปแล้ว');
      need(s.players.length >= 2, 'ต้องมีผู้เล่นอย่างน้อย 2 คน');
      if (act.shuffle) shuffle(s.players, rng);
      Object.assign(s, { status: 'playing', order: s.players.map((_, i) => i), turn: 0, round: 1, loans: [], effects: [], skip: {},
        event: null, eventHistory: [], eventDeck: null, nextLoan: 1, tx: [], nextTx: 1, reqs: [], nextReq: 1, customEvents: s.customEvents || [], goCount: 0 });
      s.players.forEach((p, i) => { p.bal = 0; p.cash = null; p.assets = null; if (s.settings.startBal > 0) credit(s, i, s.settings.startBal, 'start', 'ยอดเริ่มต้น'); });
      log(s, `🎲 เริ่มเกม! ลำดับ: ${s.players.map(p => p.name).join(' → ')}`);
      log(s, `▶️ ตาของ ${s.players[0].name}`);
      break;
    case 'resetPin':
      need(isHost, 'เฉพาะเจ้าของห้องเท่านั้น');
      s.pin = genPin(); s.admins = [];
      log(s, `🛡️ เจ้าของห้องสร้างรหัส PIN แอดมินใหม่ (แอดมินคนอื่นหลุดสถานะ)`);
      break;
    case 'resetBankPin':
      need(isHost, 'เฉพาะเจ้าของห้องเท่านั้น');
      s.bankPin = genPin(); s.bankers = [];
      log(s, `🏧 เจ้าของห้องสร้างรหัส PIN แบงก์เกอร์ใหม่ (แบงก์เกอร์คนอื่นหลุดสถานะ)`);
      break;
    case 'declareWorth': {
      // แจ้งเงินสดกระดาษ + มูลค่าทรัพย์สินบนกระดาน (ใช้ตอนจบเกม) — ทำได้ทั้งระหว่างเกมและหลังจบ
      need(s.status !== 'lobby', 'ยังไม่เริ่มเกม');
      const target = act.seat != null && isAdmin ? act.seat : seat;
      need(target >= 0 && s.players[target], 'ไม่พบผู้เล่น');
      const c = Math.round(+act.cash || 0), as = Math.round(+act.assets || 0);
      need(c >= 0 && as >= 0, 'ตัวเลขต้องไม่ติดลบ');
      s.players[target].cash = c; s.players[target].assets = as;
      log(s, `🧮 ${s.players[target].name} แจ้งเงินสด ${fmt(c)} + ทรัพย์สิน ${fmt(as)}`);
      break;
    }
    default:
      need(s.status === 'playing', 'เกมยังไม่เริ่มหรือจบไปแล้ว');
      playAction(s, seat, me, isAdmin, isBanker, isHost, act, rng);
  }
  return s;
}

function playAction(s, seat, me, isAdmin, isBanker, isHost, act, rng) {
  const findLoan = id => { const L = s.loans.find(x => x.id === id); need(L, 'ไม่พบสัญญานี้'); return L; };
  const closeIfPaid = L => {
    if (L.balance > 0) return;
    L.status = 'paid'; L.paidRound = s.round;
    log(s, `✅ ${nm(s, L.borrower)} ปิดหนี้${L.lender == null ? 'ธนาคาร' : 'ของ ' + nm(s, L.lender)} ครบแล้ว`);
    if (!L.overdue && s.round > L.startRound) bumpCredit(s, L.borrower, 1);
  };
  const notOut = () => need(!me.out, 'คุณออกจากเกมแล้ว');
  switch (act.type) {
    // ---------- ตา / รอบ ----------
    case 'endTurn':
      need(seat === s.turn || isAdmin, 'ยังไม่ถึงตาของคุณ');
      log(s, `⏭️ ${s.players[s.turn].name} จบตา`);
      nextTurn(s, rng);
      break;
    case 'drawEvent':
      need(seat === s.turn || isAdmin, 'สุ่มอีเว้นท์ได้เฉพาะคนที่ถึงตาหรือแอดมิน');
      drawEvent(s, rng);
      break;
    case 'goSalary': {
      // ผ่านจุดเริ่มต้น: เงินเดือนเข้าบัญชีคนที่ถึงตา (กดได้ไม่เกิน 2 ครั้งต่อตา กันกดซ้ำ)
      need(seat === s.turn || isAdmin, 'กดได้เฉพาะคนที่ถึงตาหรือแอดมิน');
      need((s.goCount || 0) < 2, 'ตานี้รับเงินผ่านจุดเริ่มต้นไปแล้ว');
      const t = s.turn, amt = s.settings.goSalary * (hasEffect(s, 'go2') ? 2 : 1);
      need(amt > 0, 'ตั้งค่าเงินผ่านจุดเริ่มต้นเป็น 0 อยู่');
      credit(s, t, amt, 'go', 'ผ่านจุดเริ่มต้น');
      s.goCount = (s.goCount || 0) + 1;
      log(s, `🏁 ${s.players[t].name} ผ่านจุดเริ่มต้น รับ ${fmt(amt)} เข้าบัญชี`);
      break;
    }
    // ---------- บัญชีธนาคาร ----------
    case 'transfer': {
      notOut();
      const to = act.to, amt = posInt(act.amount);
      need(s.players[to] && to !== seat && !s.players[to].out, 'เลือกผู้รับให้ถูกต้อง');
      need(me.bal >= amt, `ยอดในบัญชีไม่พอ (มี ${fmt(me.bal)})`);
      const note = String(act.note || '').slice(0, 40);
      xfer(s, seat, to, amt, 'transfer', note);
      log(s, `💸 ${me.name} โอน ${fmt(amt)} ให้ ${s.players[to].name}${note ? ` (${note})` : ''}`);
      break;
    }
    case 'payBank': {
      notOut();
      const amt = posInt(act.amount);
      need(me.bal >= amt, `ยอดในบัญชีไม่พอ (มี ${fmt(me.bal)})`);
      const note = String(act.note || '').slice(0, 40);
      debit(s, seat, amt, 'payBank', note);
      log(s, `🏦 ${me.name} จ่ายธนาคาร ${fmt(amt)}${note ? ` (${note})` : ''}`);
      break;
    }
    case 'request': {
      // ฝาก/ถอนเงินสด หรือขอรับเงินจากธนาคาร: ถ้าต้องยืนยัน จะรอแอดมินกด (แอดมินทำให้ตัวเองได้ทันที)
      notOut();
      need(REQ_KIND[act.kind], 'ประเภทคำขอไม่ถูกต้อง');
      const amt = posInt(act.amount);
      if (act.kind === 'withdraw') need(me.bal >= amt, `ยอดในบัญชีไม่พอ (มี ${fmt(me.bal)})`);
      const note = String(act.note || '').slice(0, 40);
      if (!s.settings.cashConfirm || isBanker) { applyReq(s, { seat, kind: act.kind, amt, note }); break; }
      need(s.reqs.filter(r => r.seat === seat).length < 5, 'มีคำขอค้างอยู่หลายรายการ รอแบงก์เกอร์ยืนยันก่อน');
      s.reqs.push({ id: s.nextReq++, seat, kind: act.kind, amt, note, r: s.round });
      log(s, `🙋 ${me.name} ขอ${REQ_KIND[act.kind]} ${fmt(amt)} — รอแอดมินยืนยัน`);
      break;
    }
    case 'cancelReq': {
      const i = s.reqs.findIndex(r => r.id === act.id);
      need(i >= 0 && s.reqs[i].seat === seat, 'ไม่พบคำขอนี้');
      s.reqs.splice(i, 1);
      log(s, `↩️ ${me.name} ยกเลิกคำขอ`);
      break;
    }
    case 'resolveReq': {
      need(isBanker, 'เฉพาะแอดมินหรือแบงก์เกอร์เท่านั้น');
      const i = s.reqs.findIndex(r => r.id === act.id);
      need(i >= 0, 'คำขอนี้ถูกจัดการไปแล้ว');
      const r = s.reqs[i];
      if (act.ok) {
        if (r.kind === 'withdraw') need(s.players[r.seat].bal >= r.amt, `${s.players[r.seat].name} ยอดในบัญชีไม่พอแล้ว`);
        s.reqs.splice(i, 1);
        applyReq(s, r);
      } else {
        s.reqs.splice(i, 1);
        log(s, `❌ ${isAdmin ? 'แอดมิน' : 'แบงก์เกอร์'}ปฏิเสธคำขอ${REQ_KIND[r.kind]}ของ ${s.players[r.seat].name}`);
      }
      break;
    }
    case 'adjustBalance': {
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      const p = s.players[act.seat]; need(p, 'ไม่พบผู้เล่น');
      const d = Math.round(+act.delta); need(Number.isFinite(d) && d !== 0, 'จำนวนเงินไม่ถูกต้อง');
      const note = String(act.note || 'แอดมินปรับยอด').slice(0, 40);
      if (d > 0) credit(s, act.seat, d, 'admin', note); else debit(s, act.seat, -d, 'admin', note);
      log(s, `🛡️ แอดมินปรับยอดบัญชี ${p.name} ${d > 0 ? '+' : '−'}${fmt(Math.abs(d))} (${note})`);
      break;
    }
    // ---------- กู้ยืม ----------
    case 'bankLoan': {
      notOut();
      const amt = Math.round(+act.amount), rounds = Math.round(+act.rounds);
      need(amt > 0 && amt % unitOf(s) === 0, `ยอดกู้ต้องเป็นทวีคูณของ ${fmt(unitOf(s))}`);
      need(rounds >= 1 && rounds <= 20, 'ระยะเวลาไม่ถูกต้อง');
      need(!s.loans.some(L => L.borrower === seat && L.status === 'active' && L.overdue), 'มีหนี้ค้างชำระอยู่ ธนาคารไม่ให้กู้เพิ่ม');
      const room = bankCap(s, seat) - bankDebt(s, seat);
      need(amt <= room, `เกินวงเงิน กู้ได้อีกไม่เกิน ${fmt(Math.max(0, room))}`);
      const intoCash = act.into === 'cash';
      const L = { id: s.nextLoan++, lender: null, borrower: seat, principal: amt, balance: amt, rate: bankRate(s, seat), interest: 0,
        startRound: s.round, dueRound: s.round + rounds, status: 'active', overdue: false, via: intoCash ? 'cash' : 'account' };
      s.loans.push(L);
      if (!intoCash) credit(s, seat, amt, 'loan', 'เงินกู้ธนาคาร');
      log(s, `🏦 ${me.name} กู้ธนาคาร ${fmt(amt)} คืนภายในรอบที่ ${L.dueRound} → ${intoCash ? 'รับเงินสดจากธนาคาร' : 'เงินเข้าบัญชีแล้ว'}`);
      break;
    }
    case 'offerLoan': {
      notOut();
      const to = act.to, amt = Math.round(+act.amount), rate = Math.round(+act.rate), rounds = Math.round(+act.rounds);
      need(s.players[to] && to !== seat && !s.players[to].out, 'เลือกผู้กู้ให้ถูกต้อง');
      need(amt > 0, 'ยอดเงินไม่ถูกต้อง');
      need(rate >= 0 && rate <= 50, 'ดอกเบี้ยต้องอยู่ระหว่าง 0–50% ต่อรอบ');
      need(rounds >= 1 && rounds <= 20, 'ระยะเวลาไม่ถูกต้อง');
      const via = act.via === 'cash' ? 'cash' : 'account';
      if (via === 'account') need(me.bal >= amt, `ยอดในบัญชีไม่พอให้กู้ (มี ${fmt(me.bal)})`);
      s.loans.push({ id: s.nextLoan++, lender: seat, borrower: to, principal: amt, balance: amt, rate, interest: 0,
        startRound: null, dueRound: null, rounds, status: 'offer', overdue: false, via, note: String(act.note || '').slice(0, 60) });
      log(s, `✉️ ${me.name} เสนอให้ ${nm(s, to)} กู้ ${fmt(amt)} ดอกเบี้ย ${rate}%/รอบ ${rounds} รอบ (${via === 'cash' ? 'เงินสด' : 'โอนเข้าบัญชี'})`);
      break;
    }
    case 'acceptLoan': {
      const L = findLoan(act.id);
      need(L.status === 'offer' && L.borrower === seat, 'ไม่มีข้อเสนอนี้สำหรับคุณ');
      if (L.via === 'account') {
        need(s.players[L.lender].bal >= L.principal, `${nm(s, L.lender)} มียอดในบัญชีไม่พอแล้ว`);
        xfer(s, L.lender, seat, L.principal, 'loan', 'เงินกู้จากเพื่อน');
      }
      Object.assign(L, { status: 'active', startRound: s.round, dueRound: s.round + L.rounds });
      log(s, `🤝 ${me.name} รับเงินกู้จาก ${nm(s, L.lender)} ${fmt(L.principal)} → ${L.via === 'account' ? 'โอนเข้าบัญชีแล้ว' : nm(s, L.lender) + ' ส่งเงินสดให้ ' + me.name}`);
      break;
    }
    case 'cancelLoan': {
      const L = findLoan(act.id);
      need(L.status === 'offer' && (L.borrower === seat || L.lender === seat), 'ยกเลิกไม่ได้');
      L.status = 'declined';
      log(s, L.borrower === seat ? `🙅 ${me.name} ปฏิเสธข้อเสนอกู้จาก ${nm(s, L.lender)}` : `↩️ ${me.name} ยกเลิกข้อเสนอให้กู้`);
      break;
    }
    case 'repay': {
      // คืนด้วยเงินสด: หนี้ธนาคาร = ผู้กู้กดเอง / หนี้ผู้เล่น = ผู้ให้กู้เป็นคนกดยืนยันว่าได้รับเงิน
      const L = findLoan(act.id);
      need(L.status === 'active', 'สัญญานี้ปิดไปแล้ว');
      need(L.lender == null ? (L.borrower === seat || isAdmin) : L.lender === seat, L.lender == null ? 'เฉพาะผู้กู้' : 'ผู้ให้กู้ต้องเป็นคนกดยืนยันว่าได้รับเงินแล้ว');
      const amt = Math.round(+act.amount);
      need(amt > 0 && amt <= L.balance, `ยอดต้องอยู่ระหว่าง 1–${fmt(L.balance)}`);
      L.balance -= amt;
      log(s, `💵 ${nm(s, L.borrower)} คืนเงินสด ${fmt(amt)} ให้${nm(s, L.lender)} (เหลือ ${fmt(L.balance)})`);
      closeIfPaid(L);
      break;
    }
    case 'repayAccount': {
      // คืนจากบัญชี: ผู้กู้กดเองได้เลย (ระบบตรวจยอดให้ ไม่ต้องให้ผู้ให้กู้ยืนยัน)
      const L = findLoan(act.id);
      need(L.status === 'active' && L.borrower === seat, 'เฉพาะผู้กู้ของสัญญานี้');
      const amt = Math.round(+act.amount);
      need(amt > 0 && amt <= L.balance, `ยอดต้องอยู่ระหว่าง 1–${fmt(L.balance)}`);
      need(me.bal >= amt, `ยอดในบัญชีไม่พอ (มี ${fmt(me.bal)})`);
      if (L.lender == null) debit(s, seat, amt, 'repay', 'คืนหนี้ธนาคาร');
      else xfer(s, seat, L.lender, amt, 'repay', 'คืนหนี้');
      L.balance -= amt;
      log(s, `💸 ${me.name} คืนหนี้จากบัญชี ${fmt(amt)} ให้${nm(s, L.lender)} (เหลือ ${fmt(L.balance)})`);
      closeIfPaid(L);
      break;
    }
    case 'forgive': {
      const L = findLoan(act.id);
      need(L.status === 'active' && L.lender === seat, 'เฉพาะผู้ให้กู้');
      L.status = 'forgiven';
      log(s, `😇 ${me.name} ยกหนี้ ${fmt(L.balance)} ให้ ${nm(s, L.borrower)}`);
      break;
    }
    // ---------- แอดมิน ----------
    case 'forceEvent':
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      need(findEvent(s, act.id), 'ไม่พบอีเว้นท์นี้');
      drawEvent(s, rng, act.id);
      log(s, `🛡️ แอดมินเลือกอีเว้นท์เอง`);
      break;
    case 'addCustomEvent': {
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      const title = String(act.title || '').trim().slice(0, 30);
      need(title, 'ใส่ชื่ออีเว้นท์ก่อน');
      const target = ['all', 'random', 'seat', 'none'].includes(act.target) ? act.target : 'none';
      if (target === 'seat') need(s.players[act.seat], 'เลือกผู้เล่นให้ถูกต้อง');
      const amount = Math.round(+act.amount || 0);
      need(Math.abs(amount) <= 100000000, 'จำนวนเงินมากเกินไป');
      const c = { id: 'c' + (s.nextCustom = (s.nextCustom || 0) + 1), icon: String(act.icon || '⭐').slice(0, 4), title,
        text: String(act.text || '').slice(0, 160), target, seat: target === 'seat' ? act.seat : null, amount, inDeck: !!act.inDeck };
      if (act.inDeck || !act.now) {
        s.customEvents.push(c);
        if (c.inDeck && s.eventDeck) s.eventDeck.splice(Math.floor(rng() * (s.eventDeck.length + 1)), 0, c.id);
        log(s, `🛡️ แอดมินสร้างอีเว้นท์ "${title}"${c.inDeck ? ' (ใส่ในสำรับสุ่มแล้ว)' : ''}`);
      }
      if (act.now) drawEvent(s, rng, null, { id: c.id, icon: c.icon, title: c.title, fx: customFx(c) });
      break;
    }
    case 'deleteCustomEvent': {
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      const i = s.customEvents.findIndex(c => c.id === act.id);
      need(i >= 0, 'ไม่พบอีเว้นท์นี้');
      s.customEvents.splice(i, 1);
      if (s.eventDeck) s.eventDeck = s.eventDeck.filter(x => x !== act.id);
      break;
    }
    case 'editLoan': {
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      const L = findLoan(act.id);
      if (act.balance != null) {
        const b = Math.round(+act.balance); need(b >= 0, 'ยอดต้องไม่ติดลบ');
        L.balance = b;
        if (L.status === 'offer') L.principal = b;
        if (b === 0 && L.status === 'active') { L.status = 'paid'; L.paidRound = s.round; }
      }
      if (act.rate != null) { const r = Math.round(+act.rate); need(r >= 0 && r <= 50, 'ดอกเบี้ยไม่ถูกต้อง'); L.rate = r; }
      if (act.dueRound != null && L.status !== 'offer') { const d = Math.round(+act.dueRound); need(d >= 1, 'รอบไม่ถูกต้อง'); L.dueRound = d; L.overdue = s.round > d; }
      if (act.status && ['active', 'paid', 'forgiven', 'declined'].includes(act.status) && act.status !== L.status) {

        L.status = act.status;
      }
      log(s, `🛡️ แอดมินแก้ไขสัญญาเงินกู้ของ ${nm(s, L.borrower)}`);
      break;
    }
    case 'adjustCredit': {
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      const p = s.players[act.seat]; need(p, 'ไม่พบผู้เล่น');
      const c = Math.round(+act.credit); need(c >= 0 && c < CREDIT.length, 'ระดับเครดิตไม่ถูกต้อง');
      p.credit = c;
      log(s, `🛡️ แอดมินปรับเครดิตของ ${p.name} เป็น ${CREDIT[c].name}`);
      break;
    }
    case 'setRound': {
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      const r = Math.round(+act.round); need(r >= 1 && r <= 999, 'รอบไม่ถูกต้อง');

      log(s, `🛡️ แอดมินปรับเป็นรอบที่ ${r}`);
      break;
    }
    case 'setOut': {
      need(isAdmin, 'เฉพาะแอดมินเท่านั้น');
      const p = s.players[act.seat]; need(p, 'ไม่พบผู้เล่น');
      p.out = !p.out;
      log(s, p.out ? `💀 ${p.name} ออกจากเกม (ล้มละลาย)` : `↩️ ${p.name} กลับเข้าเกม`);
      if (p.out) {
        for (const L of s.loans) if (L.status === 'offer' && (L.lender === act.seat || L.borrower === act.seat)) L.status = 'declined';

    case 'endGame':

      s.status = 'over';
      s.reqs = [];
      log(s, '🏁 จบเกม — ทุกคนนับเงินสดกระดาษ + มูลค่าที่ดินบนกระดาน แล้วแจ้งในแอปเพื่อจัดอันดับ');

}

// ทำรายการตามคำขอ (หลังแอดมินยืนยัน หรือไม่ต้องยืนยัน)
function applyReq(s, r) {
  const p = s.players[r.seat];
  if (r.kind === 'deposit') { credit(s, r.seat, r.amt, 'deposit', r.note || 'ฝากเงินสด'); log(s, `🏧 ${p.name} ฝากเงินสด ${fmt(r.amt)} เข้าบัญชี (ยื่นแบงก์ให้คนถือธนาคาร)`); }
  if (r.kind === 'withdraw') { debit(s, r.seat, r.amt, 'withdraw', r.note || 'ถอนเงินสด'); log(s, `🏧 ${p.name} ถอนเงินสด ${fmt(r.amt)} (รับแบงก์จากคนถือธนาคาร)`); }
  if (r.kind === 'claim') { credit(s, r.seat, r.amt, 'claim', r.note || 'รับจากธนาคาร'); log(s, `🏦 ธนาคารจ่าย ${fmt(r.amt)} เข้าบัญชี ${p.name}${r.note ? ` (${r.note})` : ''}`); }
}

<script>
// ================== ส่วนแสดงผล + ออนไลน์ ==================
const $ = (q, el = document) => el.querySelector(q);
const $$ = (q, el = document) => [...el.querySelectorAll(q)];
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };

const App = { mode: null, state: null, room: null, uid: null, busy: false, unsub: null, tab: 'me', actor: 0, seenEvent: null,
  token: +(store('bb_token') || 0), sound: store('bb_sound') !== 'off', audio: null, titleTimer: null };
function getUid() {
  let u = null; try { u = sessionStorage.getItem('bb_uid'); } catch (e) {}
  if (!u) { u = 'u' + Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('bb_uid', u); } catch (e) {} }
  return u;
}
const S = () => App.state;
const mySeat = () => App.mode === 'online' && S() ? S().players.findIndex(p => p.uid === App.uid) : -1;
const viewSeat = () => App.mode === 'local' ? App.actor : mySeat();       // บัญชีที่กำลังดูอยู่
const isHostUser = () => !!S() && S().hostUid === App.uid;          // เจ้าของห้องตัวจริง (ตั้ง/รีเซ็ต PIN ได้)
const isAdmin = () => App.mode === 'local' || (!!S() && isAdminUid(S(), App.uid)); // เจ้าของห้อง หรือใครก็ตามที่ใส่ PIN แอดมินถูก
const isBanker = () => App.mode === 'local' || (!!S() && isBankerUid(S(), App.uid)); // แอดมิน หรือคนถือเงินสดธนาคารที่ใส่ PIN แบงก์เกอร์ถูก
const canAct = seat => App.mode === 'local' || seat === mySeat();
const P = i => S().players[i];
const tokHtml = (i, cls = '') => { const p = P(i), t = TOKENS[p.token]; return `<span class="tok ${cls}" style="--c:${t.color}">${t.icon}</span>`; };
const pn = i => i == null ? '🏦 ธนาคาร' : `${TOKENS[P(i).token].icon} ${esc(P(i).name)}`;
const creditHtml = i => { const c = CREDIT[P(i).credit]; return `<span class="credit" style="--cc:${c.color}" title="ระดับเครดิต">${c.name}</span>`; };
const baht = n => `${n < 0 ? '−' : ''}${fmt(Math.abs(n))}`;

function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3600); }

// ---------- เสียง + สั่น + กระพริบชื่อแท็บ (แจ้งเตือน) ----------
function unlockAudio() { // เบราว์เซอร์ยอมให้เล่นเสียงหลังผู้ใช้แตะจอครั้งแรกเท่านั้น
  if (App.audio) return;
  try { const C = window.AudioContext || window.webkitAudioContext; if (C) App.audio = new C(); } catch (e) {}
}
function beep(kind) {
  if (!App.sound || !App.audio) return;
  try {
    const ctx = App.audio, now = ctx.currentTime;
    const notes = kind === 'turn' ? [660, 880] : kind === 'money' ? [988, 1319] : [520];
    notes.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + i * 0.14);
      g.gain.exponentialRampToValueAtTime(0.25, now + i * 0.14 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.14 + 0.22);
      o.connect(g).connect(ctx.destination); o.start(now + i * 0.14); o.stop(now + i * 0.14 + 0.25);
    });
  } catch (e) {}
}
function buzz(p) { try { if (App.sound && navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function flashTitle(msg) {
  if (!document.hidden) return;
  clearInterval(App.titleTimer);
  const base = 'ธนาคารเศรษฐี'; let on = false;
  App.titleTimer = setInterval(() => { document.title = (on = !on) ? msg : base; }, 1000);
  const stop = () => { clearInterval(App.titleTimer); document.title = base; document.removeEventListener('visibilitychange', stop); };
  document.addEventListener('visibilitychange', stop);
}
// เทียบ state เก่ากับใหม่ แล้วแจ้งเตือนสิ่งที่เกี่ยวกับเครื่องนี้
function notifyChanges(prev, s) {
  if (!prev || App.mode !== 'online' || s.status !== 'playing' || prev.status !== 'playing') return;
  const me = mySeat();
  if (me >= 0 && prev.turn !== s.turn && s.turn === me) {
    toast('🎲 ถึงตาคุณแล้ว!'); beep('turn'); buzz([200, 100, 200]); flashTitle('🎲 ถึงตาคุณ!');
  }
  if (me >= 0) {
    const fresh = s.tx.filter(t => t.id >= (prev.nextTx || 1) && t.t === me && t.f !== me && ['transfer', 'loan', 'repay', 'event', 'claim', 'deposit', 'admin'].includes(t.k));
    if (fresh.length) {
      const t = fresh[fresh.length - 1];
      toast(`💰 ได้รับ ${fmt(t.a)} จาก${t.f == null ? 'ธนาคาร' : ' ' + P(t.f).name}${t.n ? ` (${t.n})` : ''}`); beep('money'); buzz(120);
    }
    const mineBefore = (prev.reqs || []).filter(r => r.seat === me).map(r => r.id);
    const gone = mineBefore.filter(id => !s.reqs.some(r => r.id === id));
    if (gone.length && !fresh.length) toast('แบงก์เกอร์จัดการคำขอของคุณแล้ว ดูรายการล่าสุดในบัญชี');
    const offers = s.loans.filter(L => L.status === 'offer' && L.borrower === me && !prev.loans.some(x => x.id === L.id));
    if (offers.length) { toast(`✉️ ${P(offers[0].lender).name} เสนอให้คุณกู้ ${fmt(offers[0].principal)}`); beep('ping'); buzz(120); }
  }
  if (isBanker() && s.reqs.length > (prev.reqs || []).length) { toast('🏧 มีคำขอฝาก/ถอนรอแบงก์เกอร์ยืนยัน'); beep('ping'); buzz(80); }
}

// ---------- QR โค้ด (ใช้ไลบรารี qrcode-generator ที่ฝังในไฟล์) ----------
function qrSvg(text) {
  try {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 2, size = n + m * 2;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m},${r + m}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${size} ${size}" role="img" aria-label="QR โค้ดเข้าห้อง" shape-rendering="crispEdges"><rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
  } catch (e) { return ''; }
}

// ---------- Firebase ----------
let FB = null;
async function fb() {
  if (FB) return FB;
  if (!FIREBASE_CONFIG) throw new Error('ยังไม่ได้ตั้งค่า Firebase');
  const V = '10.12.2';
  const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  FB = { ...fs, db: fs.getFirestore(appMod.initializeApp(FIREBASE_CONFIG)) };
  return FB;
}
const roomRef = code => FB.doc(FB.db, ROOMS, code);

// ส่งคำสั่ง: seat = ทำในนามผู้เล่นคนไหน (null = เครื่องนี้ / แอดมิน)
async function dispatch(seat, act) {
  if (App.busy) return false;
  const uid = seat == null ? (App.mode === 'local' ? S().hostUid : App.uid) : P(seat).uid;
  if (App.mode === 'local') {
    try { setState(applyAction(S(), uid, act)); return true; }
    catch (e) { toast(e.message); if (!(e instanceof GameError)) console.error(e); return false; }
  }
  App.busy = true; document.body.style.cursor = 'progress';
  try {
    await FB.runTransaction(FB.db, async tx => {
      const snap = await tx.get(roomRef(App.room));
      if (!snap.exists()) throw new GameError('ไม่พบห้องนี้แล้ว');
      tx.update(roomRef(App.room), { data: JSON.stringify(applyAction(JSON.parse(snap.data().data), uid, act)), t: Date.now() });
    });
    return true;
  } catch (e) { toast(e instanceof GameError ? e.message : 'เชื่อมต่อไม่สำเร็จ: ' + e.message); if (!(e instanceof GameError)) console.error(e); return false; }
  finally { App.busy = false; document.body.style.cursor = ''; }
}

async function createRoom(name) {
  await fb();
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (let k = 0; k < 5; k++) {
    const code = Array.from({ length: 5 }, () => A[Math.floor(Math.random() * A.length)]).join('');
    const ok = await FB.runTransaction(FB.db, async tx => {
      if ((await tx.get(roomRef(code))).exists()) return false;
      tx.set(roomRef(code), { data: JSON.stringify(applyAction(newRoom(App.uid), App.uid, { type: 'join', name, token: App.token })), t: Date.now() });
      return true;
    });
    if (ok) return enterRoom(code);
  }
  throw new Error('สร้างห้องไม่สำเร็จ ลองใหม่');
}
async function roomTx(code, act) {
  await fb(); code = code.trim().toUpperCase();
  await FB.runTransaction(FB.db, async tx => {
    const snap = await tx.get(roomRef(code));
    if (!snap.exists()) throw new GameError('ไม่พบห้อง ' + code);
    tx.update(roomRef(code), { data: JSON.stringify(applyAction(JSON.parse(snap.data().data), App.uid, act)), t: Date.now() });
  });
  enterRoom(code);
}
const joinRoom = (code, name) => roomTx(code, { type: 'join', name, token: App.token });
const adminEnterRoom = (code, pin) => roomTx(code, { type: 'claimAdmin', pin });
const bankerEnterRoom = (code, pin) => roomTx(code, { type: 'claimBanker', pin });
function enterRoom(code) {
  App.mode = 'online'; App.room = code;
  try { history.replaceState(null, '', '?room=' + code); } catch (e) {}
  if (App.unsub) App.unsub();
  App.unsub = FB.onSnapshot(roomRef(code), snap => { if (snap.exists()) setState(JSON.parse(snap.data().data)); else toast('ห้องถูกลบแล้ว'); }, err => toast('การเชื่อมต่อขาด: ' + err.message));
}
function startLocal(names) {
  App.mode = 'local';
  let s = newRoom('L0');
  names.forEach((n, i) => { s = applyAction(s, 'L' + i, { type: 'join', name: n, token: i }); });
  s = applyAction(s, 'L0', { type: 'settings', settings: { cashConfirm: false } }); // เครื่องเดียว: คนถือเครื่องคือแบงก์เกอร์อยู่แล้ว
  App.seenEvent = null; App.actor = 0;
  setState(s);
}
function setState(s) {
  const prev = App.state;
  App.state = s;
  if (!prev && s.event) App.seenEvent = s.event.n; // เข้าห้องกลางเกม ไม่ต้องเด้งอีเว้นท์เก่า
  if (prev && prev.status === 'playing' && s.status === 'over') App.tab = 'result';
  if (s.status === 'playing' && App.tab === 'result') App.tab = 'me';
  notifyChanges(prev, s);
  render();
}
function leaveToHome() {
  if (App.unsub) App.unsub();
  Object.assign(App, { unsub: null, state: null, mode: null, room: null, seenEvent: null, tab: 'me' });
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  closeModal(); $('#ev-root').innerHTML = ''; render();
}

function nextSeat(s) {
  const act = s.order.filter(i => !s.players[i].out);
  if (act.length < 2) return null;
  let idx = s.order.indexOf(s.turn);
  for (let k = 0; k < s.order.length; k++) { idx = (idx + 1) % s.order.length; const i = s.order[idx]; if (!s.players[i].out) return i; }
  return null;
}
function myAlerts(s, seat) {
  if (seat < 0) return 0;
  return s.loans.filter(L => (L.status === 'offer' && L.borrower === seat) || (L.status === 'active' && L.borrower === seat && L.overdue)).length + (P(seat).bal < 0 ? 1 : 0);
}

function renderGame() {
  const s = S(), over = s.status === 'over';
  const t = s.turn, nx = nextSeat(s);
  const admin = isAdmin();
  const ctlTurn = canAct(t) || admin;
  const alerts = myAlerts(s, viewSeat());
  const tabs = [...(over ? [['result', 'ผลการแข่งขัน']] : []), ['me', 'บัญชีของฉัน'], ['all', 'ทุกคน'], ['ev', 'อีเว้นท์'], ['log', 'บันทึก']];
  if (!tabs.some(x => x[0] === App.tab)) App.tab = tabs[0][0];
  const goAmt = goAmount(s);
  $('#app').innerHTML = `<main class="wrap">
    <div class="top"><h1>ธนาคาร<span>เศรษฐี</span></h1>
      ${App.mode === 'online' ? `<button class="chip" data-a="invite">ห้อง <b class="num">${App.room}</b> · QR</button>${soundBtn()}` : ''}
      ${roleButtons()}
      <button class="sm" data-a="home">ออก</button></div>
    ${over ? `<section class="panel turn"><div class="who">🏁 จบเกมแล้ว</div><div class="next">ทุกคนนับเงินสดกระดาษ + มูลค่าที่ดินบนกระดาน แล้วแจ้งในแท็บ "ผลการแข่งขัน"</div></section>` :
    `<section class="panel turn ${t === mySeat() ? 'mine' : ''}" aria-live="polite">
      <div class="rnd">รอบที่ ${s.round}${t === mySeat() ? ' · ถึงตาคุณแล้ว!' : ''}</div>
      <div class="who">${tokHtml(t)}<span>ตาของ ${esc(P(t).name)}</span></div>
      ${nx != null ? `<div class="next">คนต่อไป: ${pn(nx)}${s.skip[nx] ? ' (โดนข้ามตา)' : ''}</div>` : ''}
      <div class="row">${ctlTurn ? `<button class="gold big" data-a="endTurn">จบตา ➜</button>
        ${goAmt > 0 ? `<button class="ghost" data-a="go" ${(s.goCount || 0) >= 2 ? 'disabled' : ''}>🏁 ผ่านจุดเริ่มต้น +${fmt(goAmt)}</button>` : ''}
        <button class="ghost" data-a="drawEvent">🎴 สุ่มอีเว้นท์</button>` : `<span class="next">รอ ${esc(P(t).name)} เล่นบนกระดาน…</span>`}</div>
    </section>`}
    ${s.effects.length ? `<div class="effects" aria-label="ผลที่กำลังมีผล">${s.effects.map(e => `<span class="effect">${e.icon} ${esc(e.label)} <small>ถึงรอบ ${e.until}</small></span>`).join('')}</div>` : ''}
    <nav class="tabs" role="tablist">
      ${tabs.map(([k, l]) => `<button role="tab" aria-selected="${App.tab === k}" data-tab="${k}">${l}${k === 'me' && alerts ? '<span class="dot"></span>' : ''}</button>`).join('')}
    </nav>
    <section id="tab">${({ result: tabResult, me: tabMe, all: tabAll, ev: tabEv, log: tabLog })[App.tab](s)}</section>
  </main>`;
  showEventIfNew(s);
  refreshModal();
}

// ---------- แท็บ: บัญชีของฉัน ----------
const TX_LABEL = { transfer: 'โอน', payBank: 'จ่ายธนาคาร', deposit: 'ฝากเงินสด', withdraw: 'ถอนเงินสด', claim: 'รับจากธนาคาร', go: 'ผ่านจุดเริ่มต้น',
  loan: 'เงินกู้', repay: 'คืนหนี้', event: 'อีเว้นท์', admin: 'แอดมินปรับยอด', start: 'ยอดเริ่มต้น', overdraft: 'ดอกเบี้ยเบิกเกิน' };
function txRow(t, v) {
  const inbound = t.t === v;
  const other = inbound ? t.f : t.t;
  const who = t.k === 'deposit' || t.k === 'withdraw' ? 'เงินสด ↔ บัญชี' : other == null ? 'ธนาคาร' : esc(P(other).name);
  return `<div class="txr"><span class="tx-ic ${inbound ? 'in' : 'out'}">${inbound ? '↓' : '↑'}</span>
    <span class="tx-main"><b>${TX_LABEL[t.k] || t.k}</b> <span class="muted">${inbound ? 'จาก' : 'ไป'} ${who}</span>${t.n ? `<small>${esc(t.n)}</small>` : ''}</span>
    <span class="tx-amt num ${inbound ? 'in' : 'out'}">${inbound ? '+' : '−'}${fmt(t.a)}</span><span class="tx-r num muted">ร.${t.r}</span></div>`;
}

function loanCard(s, L, view) {
  const bank = L.lender == null;
  const iAmBorrower = L.borrower === view;
  const other = iAmBorrower ? L.lender : L.borrower;
  const who = pn(other);
  const viaTxt = L.via === 'cash' ? 'เงินสด' : 'โอนเข้าบัญชี';
  if (L.status === 'offer') {
    return `<div class="loan offer"><div class="l1"><b>${iAmBorrower ? `${who} เสนอให้คุณกู้` : `คุณเสนอให้ ${who} กู้`}</b><span class="amt">${fmt(L.principal)}</span></div>
      <div class="meta"><span>ดอกเบี้ย ${L.rate}%/รอบ</span><span>คืนภายใน ${L.rounds} รอบ</span><span>${viaTxt}</span>${L.note ? `<span>“${esc(L.note)}”</span>` : ''}</div>
      <div class="row">${iAmBorrower ? `<button class="primary sm" data-a="accept:${L.id}" data-as="${view}">รับเงินกู้</button><button class="sm danger" data-a="cancel:${L.id}" data-as="${view}">ปฏิเสธ</button>`
        : `<span class="muted" style="font-size:13px">รออีกฝ่ายตอบรับ</span><button class="sm" data-a="cancel:${L.id}" data-as="${view}" style="margin-left:auto">ยกเลิก</button>`}</div></div>`;
  }
  const left = L.dueRound - s.round;
  const due = L.overdue ? `<span style="color:var(--danger);font-weight:600">เลยกำหนด (รอบ ${L.dueRound})</span>` : left <= 0 ? `<span style="color:var(--danger)">ครบกำหนดรอบนี้!</span>` : `ครบกำหนดรอบ ${L.dueRound} (อีก ${left} รอบ)`;
  const span = Math.max(1, L.dueRound - L.startRound), pct = Math.min(100, Math.max(0, (s.round - L.startRound) / span * 100));
  const live = s.status === 'playing' && canAct(view);
  let btns = '';
  if (live && iAmBorrower) btns = `<button class="primary sm" data-a="repayAcc:${L.id}" data-as="${view}">คืนจากบัญชี</button>${bank ? `<button class="sm" data-a="repayCash:${L.id}" data-as="${view}">คืนเป็นเงินสด</button>` : `<span class="muted" style="font-size:12.5px">หรือยื่นเงินสดให้ ${esc(P(L.lender).name)} แล้วให้เขากดยืนยัน</span>`}`;
  if (live && !bank && !iAmBorrower) btns = `<button class="sm" data-a="repayCash:${L.id}" data-as="${view}">ได้รับเงินสดคืนแล้ว</button><button class="sm" data-a="forgive:${L.id}" data-as="${view}">ยกหนี้</button>`;
  return `<div class="loan ${L.overdue ? 'over' : ''}"><div class="l1"><b>${iAmBorrower ? 'หนี้กับ ' + who : who + ' ติดหนี้คุณ'}</b>${L.overdue ? '<span class="badge bad">ค้างชำระ</span>' : ''}<span class="amt">${fmt(L.balance)}</span></div>
    <div class="meta"><span>เงินต้น ${fmt(L.principal)}</span><span>ดอกเบี้ย ${loanRate(s, L)}%/รอบ</span><span>ดอกสะสม ${fmt(L.interest)}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${due}</span></div>
    ${btns ? `<div class="row">${btns}</div>` : ''}</div>`;
}

function worthForm(s, v) {
  const p = P(v), done = p.cash != null;
  return `<div class="panel stack worth"><div class="label">นับเงินจบเกม</div>
    <p class="muted" style="margin:0;font-size:13.5px">นับเงินสดกระดาษในมือ และรวมมูลค่าที่ดิน/บ้านบนกระดาน (ราคาซื้อตามโฉนด ติดจำนองนับครึ่งเดียว) แล้วกรอกตรงนี้</p>
    <div class="grid2"><div class="field"><label for="w-cash">เงินสดกระดาษ</label><input id="w-cash" type="number" inputmode="numeric" value="${p.cash ?? ''}" placeholder="0"></div>
    <div class="field"><label for="w-assets">มูลค่าทรัพย์สินบนกระดาน</label><input id="w-assets" type="number" inputmode="numeric" value="${p.assets ?? ''}" placeholder="0"></div></div>
    <button class="primary" data-a="declare" data-as="${v}">${done ? 'แก้ไขยอดที่แจ้ง' : 'แจ้งยอด'}</button></div>`;
}

function tabMe(s) {
  const pick = App.mode === 'local' ? `<div class="who-pick" role="group" aria-label="ใช้งานในนาม">${s.players.map((p, i) => `<button class="sm" data-actor="${i}" aria-pressed="${i === App.actor}">${TOKENS[p.token].icon} ${esc(p.name)}${myAlerts(s, i) ? ' •' : ''}</button>`).join('')}</div>` : '';
  const v = viewSeat();
  if (v < 0) {
    if (isAdmin()) return pick + '<p class="empty">คุณเป็นกรรมการในห้องนี้ (ไม่มีบัญชี) · ดูภาพรวมได้ที่แท็บ "ทุกคน" และจัดการเกมที่ปุ่ม 🛡️ แอดมิน</p>';
    if (isBanker()) return pick + '<p class="empty">คุณเป็นแบงก์เกอร์ในห้องนี้ (ไม่มีบัญชี) · ดูภาพรวมได้ที่แท็บ "ทุกคน" และยืนยันฝาก/ถอนที่ปุ่ม 🏧 แบงก์เกอร์</p>';
    return pick + '<p class="empty">คุณเป็นกรรมการในห้องนี้ (ไม่มีบัญชี) · ดูภาพรวมได้ที่แท็บ "ทุกคน"</p>';
  }
  const p = P(v), over = s.status === 'over';
  const live = !over && !p.out && canAct(v);
  const mine = s.loans.filter(L => L.borrower === v || L.lender === v);
  const incoming = mine.filter(L => L.status === 'offer' && L.borrower === v);
  const outgoing = mine.filter(L => L.status === 'offer' && L.lender === v);
  const debts = mine.filter(L => L.status === 'active' && L.borrower === v).sort((a, b) => b.overdue - a.overdue || a.dueRound - b.dueRound);
  const lent = mine.filter(L => L.status === 'active' && L.lender === v);
  const room = Math.max(0, bankCap(s, v) - bankDebt(s, v));
  const reqs = (s.reqs || []).filter(r => r.seat === v);
  const txs = s.tx.filter(t => t.f === v || t.t === v).slice(-15).reverse();
  const isTurn = s.turn === v && !over;
  return `<div class="stack">${pick}
    <div class="card-bank ${p.bal < 0 ? 'neg' : ''}">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="cb-name">${TOKENS[p.token].icon} ${esc(p.name)}</span>${creditHtml(v)}</div>
      <div class="cb-label">${p.bal < 0 ? 'เบิกเกินบัญชี (โดนดอกเบี้ยทุกรอบ)' : 'ยอดเงินในบัญชี'}</div>
      <div class="cb-bal num">${baht(p.bal)}</div>
      <div class="cb-foot"><span>หนี้ <b class="num">${fmt(debtOf(s, v))}</b></span><span>ให้ยืม <b class="num">${fmt(lentOf(s, v))}</b></span><span>กู้ธนาคารได้อีก <b class="num">${fmt(room)}</b></span></div>
    </div>
    ${p.out ? '<div class="warn">ผู้เล่นนี้ออกจากเกมแล้ว</div>' : ''}
    ${over ? worthForm(s, v) : ''}
    ${live ? `<div class="actions">
      <button data-a="transfer" data-as="${v}"><span>💸</span>โอน</button>
      <button data-a="payBank" data-as="${v}"><span>🏦</span>จ่ายธนาคาร</button>
      <button data-a="req:deposit" data-as="${v}"><span>📥</span>ฝากเงินสด</button>
      <button data-a="req:withdraw" data-as="${v}"><span>📤</span>ถอนเงินสด</button>
      <button data-a="req:claim" data-as="${v}"><span>🙋</span>รับจากธนาคาร</button>
      <button data-a="bankLoan" data-as="${v}"><span>🧾</span>กู้ธนาคาร</button>
      <button data-a="offer" data-as="${v}"><span>🤝</span>ให้เพื่อนกู้</button>
      ${isTurn && goAmount(s) > 0 ? `<button data-a="go" ${(s.goCount || 0) >= 2 ? 'disabled' : ''}><span>🏁</span>ผ่านจุดเริ่มต้น</button>` : ''}
    </div>` : ''}
    ${reqs.length ? `<div class="section-h"><h2>รอแบงก์เกอร์ยืนยัน</h2></div>${reqs.map(r => `<div class="loan offer"><div class="l1"><b>${REQ_KIND[r.kind]}</b><span class="amt">${fmt(r.amt)}</span></div>
      <div class="row"><span class="muted" style="font-size:13px">${r.kind === 'deposit' ? 'ยื่นแบงก์ให้คนถือธนาคาร แล้วรอเขากดยืนยัน' : r.kind === 'withdraw' ? 'รอคนถือธนาคารส่งแบงก์ให้และกดยืนยัน' : esc(r.note || 'รอแบงก์เกอร์อนุมัติ')}</span>
      ${canAct(v) ? `<button class="sm" data-a="cancelReq:${r.id}" data-as="${v}" style="margin-left:auto">ยกเลิก</button>` : ''}</div></div>`).join('')}` : ''}
    ${incoming.length ? `<div class="section-h"><h2>ข้อเสนอถึงคุณ</h2></div>${incoming.map(L => loanCard(s, L, v)).join('')}` : ''}
    <div class="section-h"><h2>หนี้ที่ต้องจ่าย</h2><span class="muted num">${debts.length}</span></div>
    ${debts.length ? debts.map(L => loanCard(s, L, v)).join('') : '<p class="empty">ไม่มีหนี้ 🎉</p>'}
    ${lent.length ? `<div class="section-h"><h2>เงินที่ให้คนอื่นยืม</h2><span class="muted num">${lent.length}</span></div>${lent.map(L => loanCard(s, L, v)).join('')}` : ''}
    ${outgoing.length ? `<div class="section-h"><h2>ข้อเสนอที่รอตอบ</h2></div>${outgoing.map(L => loanCard(s, L, v)).join('')}` : ''}
    <div class="section-h"><h2>รายการล่าสุด</h2></div>
    ${txs.length ? `<div class="panel txlist">${txs.map(t => txRow(t, v)).join('')}</div>` : '<p class="empty">ยังไม่มีรายการในบัญชี</p>'}
  </div>`;
}

function tabAll(s) {
  const admin = isAdmin();
  const rows = s.order.map(i => {
    const p = P(i), od = s.loans.some(L => L.borrower === i && L.status === 'active' && L.overdue);
    return `<tr style="${p.out ? 'opacity:.5' : ''}"><td><div class="row" style="flex-wrap:nowrap">${tokHtml(i)}<span>${esc(p.name)}${i === s.turn && s.status === 'playing' ? ' <span class="badge me">ถึงตา</span>' : ''}${od ? ' <span class="badge bad">ค้าง</span>' : ''}${p.out ? ' <span class="badge">ออก</span>' : ''}</span></div></td>
      <td>${creditHtml(i)}</td><td class="r num" style="${p.bal < 0 ? 'color:var(--danger)' : ''}">${baht(p.bal)}</td><td class="r num">${fmt(debtOf(s, i))}</td><td class="r num">${fmt(lentOf(s, i))}</td></tr>`;
  }).join('');
  const act = s.loans.filter(L => L.status === 'active');
  return `<div class="stack"><div class="panel tscroll"><table><thead><tr><th>ผู้เล่น</th><th>เครดิต</th><th class="r">บัญชี</th><th class="r">หนี้</th><th class="r">ให้ยืม</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="section-h"><h2>สัญญาที่ยังเปิดอยู่</h2><span class="muted num">${act.length}</span></div>
    ${act.length ? `<div class="panel tscroll"><table><thead><tr><th>ผู้กู้</th><th>เจ้าหนี้</th><th class="r">ยอดค้าง</th><th class="r">กำหนด</th></tr></thead><tbody>
      ${act.map(L => `<tr><td>${pn(L.borrower)}</td><td>${pn(L.lender)}</td><td class="r num" style="${L.overdue ? 'color:var(--danger)' : ''}">${fmt(L.balance)}</td><td class="r num">รอบ ${L.dueRound}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">ไม่มีสัญญาค้าง</p>'}
    ${admin ? `<div class="row"><button data-a="admin">🛡️ เปิดแผงแอดมิน</button></div>` : isBanker() ? `<div class="row"><button data-a="banker">🏧 เปิดแผงแบงก์เกอร์</button></div>` : ''}</div>`;
}

function tabEv(s) {
  const custom = (s.customEvents || []).filter(c => c.inDeck).length;
  return `<div class="stack"><div class="warn">อีเว้นท์สุ่มอัตโนมัติ: <b>${EVENT_MODES[s.settings.eventMode]}</b>${s.settings.autoPay ? ' · ตัด/เติมเงินในบัญชีให้อัตโนมัติ' : ' · จ่ายเงินสดตามการ์ดเอง'}${custom ? ` · มีอีเว้นท์ที่แอดมินสร้างอยู่ในสำรับ ${custom} ใบ` : ''}</div>
    ${s.eventHistory.length ? `<div class="hist">${s.eventHistory.map(e => `<div class="h"><span class="ic">${e.icon}</span><div><b>${esc(e.title)}</b> <small>รอบ ${e.round}</small><div style="font-size:14px">${esc(e.text)}</div></div></div>`).join('')}</div>` : '<p class="empty">ยังไม่มีอีเว้นท์</p>'}
    <details class="panel"><summary><b>อีเว้นท์ทั้งหมด ${EVENTS.length} แบบ</b></summary><div style="display:grid;gap:4px;margin-top:8px;font-size:14px">${EVENTS.map(e => `<div>${e.icon} ${esc(e.title)}</div>`).join('')}</div></details></div>`;
}
function tabLog(s) {
  return `<div class="panel log">${s.log.slice().reverse().map(l => `<div><small>ร.${l.r}</small><span>${esc(l.m)}</span></div>`).join('')}</div>`;
}

// ---------- แท็บ: ผลการแข่งขัน ----------
function tabResult(s) {
  const seats = s.players.map((_, i) => i);
  const ranked = seats.slice().sort((a, b) => netWorth(s, b) - netWorth(s, a));
  const missing = seats.filter(i => P(i).cash == null);
  const st = seats.map(i => ({ i, ...gameStats(s, i) }));
  const top = (key, label, icon, fmtv = fmt) => { const b = st.slice().sort((x, y) => y[key] - x[key])[0]; return b && b[key] > 0 ? `<div class="hl"><span class="hl-ic">${icon}</span><span><small>${label}</small><b>${pn(b.i)}</b></span><span class="num">${fmtv(b[key])}</span></div>` : ''; };
  const best = seats.slice().sort((a, b) => P(b).credit - P(a).credit)[0];
  const medal = ['🥇', '🥈', '🥉'];
  const v = viewSeat();
  const canDeclareOthers = isAdmin();
  return `<div class="stack">
    ${missing.length ? `<div class="warn">ยังไม่ได้แจ้งเงินสด/ทรัพย์สิน: ${missing.map(i => esc(P(i).name)).join(', ')} — อันดับอาจเปลี่ยนเมื่อแจ้งครบ</div>` : ''}
    <div class="podium">${ranked.map((i, k) => {
      const p = P(i);
      return `<div class="rank ${k === 0 && !missing.length ? 'win' : ''}"><span class="pos">${medal[k] || k + 1}</span>${tokHtml(i)}
        <span class="rk-name"><b>${esc(p.name)}</b><small>บัญชี ${baht(p.bal)} · เงินสด ${p.cash == null ? '—' : fmt(p.cash)} · ทรัพย์สิน ${p.assets == null ? '—' : fmt(p.assets)} · ให้ยืม ${fmt(lentOf(s, i))} · หนี้ −${fmt(debtOf(s, i))}</small></span>
        <span class="rk-net num">${baht(netWorth(s, i))}</span>
        ${canDeclareOthers && App.mode === 'online' && i !== mySeat() ? `<button class="sm" data-a="declareFor:${i}">แจ้งแทน</button>` : ''}</div>`;
    }).join('')}</div>
    <div class="muted" style="font-size:12.5px">มูลค่าสุทธิ = ยอดบัญชี + เงินสดกระดาษ + ทรัพย์สินบนกระดาน + เงินที่ให้คนอื่นยืม − หนี้ที่ค้าง</div>
    <div class="section-h"><h2>รางวัลพิเศษ</h2></div>
    <div class="hls">
      ${top('borrowed', 'นักกู้ตัวยง (กู้รวมมากสุด)', '🧾')}
      ${top('interest', 'จ่ายดอกเบี้ยมากสุด', '🔥')}
      ${top('lent', 'เจ้าหนี้ใหญ่ (ให้กู้มากสุด)', '🦈')}
      ${top('sent', 'ใจป๋า (โอนออกมากสุด)', '💸')}
